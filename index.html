 "Muestran la situación financiera y los resultados de un periodo.", "Laura Garza cap. 9 · 9.5.1", null], ["ae.eef", "¿Cuál NO es un estado financiero básico según el libro?", "Estado de costo de ventas", ["Balance general", "Estado de resultados", "Estado de flujos de efectivo"], "Básicos: balance general, estado de resultados, estado de cambios en el patrimonio y estado de flujos de efectivo. El de costo de ventas es secundario.", "Laura Garza cap. 9 · 9.5.2", null], ["ae.eef", "Por su importancia, el estado de costo de ventas y el de movimientos del capital contable son estados:", "Secundarios, accesorios o anexos", ["Principales o básicos", "Extraordinarios", "Dinámicos únicamente"], "Principales: balance, resultados y cambios en la situación financiera.", "Laura Garza cap. 9 · 9.5.3", null], ["ae.eef", "Por el periodo que abarcan, los estados que muestran cifras a un momento dado son:", "Estáticos", ["Dinámicos", "Ordinarios", "Secundarios"], "Estáticos = a una fecha (balance); dinámicos = por un periodo (resultados).", "Laura Garza cap. 9 · 9.5.3", null], ["ae.eef", "Los estados que muestran el resultado de movimientos realizados durante un periodo son:", "Dinámicos", ["Estáticos", "Extraordinarios", "Accesorios"], "Ejemplo: el estado de resultados.", "Laura Garza cap. 9 · 9.5.3", null], ["ae.eef", "Por su fecha de elaboración, los estados que se formulan fuera del periodo acostumbrado según las necesidades de los interesados son:", "Extraordinarios", ["Ordinarios", "Estáticos", "Básicos"], "Ordinarios = periódicos y conforme al ciclo normal.", "Laura Garza cap. 9 · 9.5.3", null], ["ae.eef", "El balance general es un estado financiero:", "Básico y estático", ["Básico y dinámico", "Secundario y estático", "Secundario y dinámico"], "Muestra la situación financiera a una fecha determinada.", "Laura Garza cap. 9 · 9.5.4", null], ["ae.eef", "La ecuación del balance general es:", "Activo = Pasivo + Capital", ["Activo = Pasivo − Capital", "Capital = Activo + Pasivo", "Pasivo = Activo + Capital"], "Se llama balance porque los activos igualan pasivo más capital.", "Laura Garza cap. 9 · 9.5.4", null], ["ae.eef", "Estado donde se evalúa la solvencia de la empresa:", "Estado de situación financiera", ["Estado de pérdidas y ganancias", "Estado de resultados", "Estado de variaciones en el capital contable"], "Pregunta de repaso del libro: el balance (situación financiera).", "Laura Garza cap. 9 · 9.5.4 · Repaso 1", null], ["ae.eef", "Seleccione las cuentas del Balance General: 1. Bancos, 2. Créditos bancarios, 3. Resultado cambiario, 4. Otros productos, 5. Utilidades retenidas, 6. Capital social, 7. Otros gastos", "1, 2, 5, 6", ["2, 3, 6, 7", "1, 3, 4, 7", "2, 3, 4, 5"], "Pregunta de repaso del libro. Resultado cambiario, otros productos y otros gastos son cuentas de resultados.", "Laura Garza cap. 9 · 9.5.4 · Repaso 5", null], ["ae.eef", "Características del Balance General: 1. Dinámico; 2. Se elabora por periodos; 3. Estático; 4. A = P − C; 5. A = P + C; 6. Muestra las ventas; 7. Organiza el activo por disponibilidad", "3, 5 y 7", ["1, 3 y 4", "1, 4 y 7", "1, 4 y 6"], "Pregunta de repaso del libro: estático, A = P + C y activo ordenado por disponibilidad.", "Laura Garza cap. 9 · 9.5.4 · Repaso 12", null], ["ae.eef", "En el balance, los bienes y derechos propiedad de la empresa son:", "Activos", ["Pasivos", "Capital contable", "Ingresos"], "Pasivo = compromisos con terceros; capital = aportación de los dueños.", "Laura Garza cap. 9 · 9.5.4", null], ["ae.eef", "¿Cuál de estas cuentas es de PASIVO circulante?", "Proveedores", ["Clientes", "Almacén", "Acreedores hipotecarios"], "Acreedores hipotecarios es pasivo fijo (largo plazo); clientes y almacén son activo.", "Laura Garza cap. 9 · 9.5.4", null], ["ae.eef", "Acreedores hipotecarios se clasifica como:", "Pasivo fijo (largo plazo)", ["Pasivo circulante", "Activo fijo", "Capital contable"], "En el ejemplo del libro es el pasivo fijo.", "Laura Garza cap. 9 · 9.5.4", null], ["ae.eef", "El estado de resultados es un estado financiero:", "Básico y dinámico", ["Básico y estático", "Secundario y estático", "Extraordinario"], "Muestra la utilidad o pérdida de un periodo.", "Laura Garza cap. 9 · 9.5.5", null], ["ae.eef", "En el estado de resultados, Ventas netas − Costo de ventas =", "Utilidad bruta", ["Utilidad de operación", "Utilidad neta", "Utilidad antes de impuestos"], "Luego se restan gastos de operación para la utilidad de operación.", "Laura Garza cap. 9 · 9.5.5", null], ["ae.eef", "En el estado de resultados, Utilidad bruta − Gastos de operación =", "Utilidad de operación", ["Utilidad neta", "Utilidad antes de impuestos", "EBITDA"], "Después se resta el costo integral de financiamiento.", "Laura Garza cap. 9 · 9.5.5", null], ["ae.eef", "El orden correcto del estado de resultados es:", "Ventas, costo de ventas, utilidad bruta, gastos de operación, utilidad de operación, CIF, utilidad antes de impuestos, impuestos, utilidad neta", ["Ventas, gastos de operación, utilidad bruta, costo de ventas, utilidad neta", "Ventas, CIF, utilidad bruta, impuestos, utilidad de operación", "Ventas, impuestos, costo de ventas, utilidad neta"], "Así viene en el ejemplo de Corporación ABC.", "Laura Garza cap. 9 · 9.5.5", null], ["ae.eef", "Las razones financieras se agrupan en:", "Liquidez, actividad, rentabilidad y cobertura", ["Liquidez, solvencia, mercado y riesgo", "Corto, mediano y largo plazo", "Vertical, horizontal y tendencias"], "Son los cuatro grupos del libro.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Las razones de liquidez muestran:", "La capacidad de pago de la empresa en el corto plazo (un año)", ["La eficiencia en el uso de activos", "El rendimiento para los accionistas", "La relación deuda-capital"], "Razón circulante y prueba del ácido.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Razón circulante =", "Activo circulante / Pasivo circulante", ["(Activo circulante − Inventario) / Pasivo circulante", "Pasivo total / Activo total", "Ventas / Promedio de activo"], "Mide la capacidad de pago de corto plazo.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "La prueba del ácido descuenta del activo circulante:", "El inventario (y los anticipos a proveedores)", ["El efectivo", "Las cuentas por cobrar", "Los activos fijos"], "Prueba ácida = (Activo circulante − Inventario) / Pasivo circulante.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Las razones de actividad también se llaman:", "Razones de productividad", ["Razones de solvencia", "Razones de mercado", "Razones de apalancamiento"], "Muestran la eficiencia al emplear los recursos para vender.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Rotación de activo =", "Ventas / Promedio de activo", ["Utilidad neta / Promedio de activo", "Costo de ventas / Promedio de inventario", "Ventas / Pasivo total"], "Una rotación alta indica buen aprovechamiento de los activos.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Rotación de inventario =", "Costo de ventas / Promedio de inventario", ["Ventas / Promedio de inventario", "Inventario / Costo de ventas", "360 / Costo de ventas"], "Veces que se surte y desplaza el almacén en el año.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Días de inventario =", "360 / Rotación de inventario", ["365 / Rotación de activo", "Rotación de inventario / 360", "Inventario × 360"], "El libro usa año de 360 días.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Una rotación de inventario ALTA indica:", "Un rápido desplazamiento de la mercancía", ["Exceso de inventario", "Baja liquidez", "Mala cobranza"], "Más rotación = menos días en almacén.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Las razones de rentabilidad analizan:", "El porcentaje de éxito en las ventas con base en la utilidad que generan", ["La capacidad de pago de corto plazo", "La relación pasivo-capital", "La rotación de los inventarios"], "Margen de utilidad, ROI (ROA) y ROE.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Razones financieras de rentabilidad: 1. Margen de utilidad; 2. Prueba del ácido; 3. Rotación de inventarios; 4. Rendimiento sobre activos; 5. Cobertura de intereses; 6. Rendimiento sobre capital; 7. Apalancamiento", "1, 4 y 6", ["1, 2 y 5", "3, 5 y 7", "1, 3 y 7"], "Pregunta de repaso del libro.", "Laura Garza cap. 9 · 9.5.6 · Repaso 13", null], ["ae.eef", "Margen de utilidad =", "(Utilidad neta / Ventas) × 100", ["(Utilidad bruta / Costo de ventas) × 100", "(Utilidad neta / Capital) × 100", "(Ventas / Activo) × 100"], "Porcentaje de ganancia sobre lo vendido.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Según el libro, el ROI (rendimiento sobre los activos) =", "(Utilidad neta / Promedio de activo) × 100", ["(Utilidad neta / Capital contable inicial) × 100", "(Ventas / Promedio de activo) × 100", "(UAFIR / Intereses) × 100"], "Rendimiento sobre las inversiones hechas en activos.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Según el libro, el ROE (rendimiento sobre el capital) =", "(Utilidad neta / Capital contable inicial) × 100", ["(Utilidad neta / Promedio de activo) × 100", "(Utilidad neta / Ventas) × 100", "Pasivo total / Capital contable"], "Rendimiento respecto de la inversión de los accionistas.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Las razones de cobertura muestran:", "La capacidad para cubrir compromisos de largo plazo y la relación entre financiamiento interno y externo (palanca financiera)", ["La liquidez inmediata", "La rotación de cuentas por cobrar", "El margen bruto"], "Pasivo a activo, palanca financiera y cobertura de intereses.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Razón que muestra qué parte de los activos se financia con recursos externos:", "Pasivo total / Activo total", ["Pasivo total / Capital contable", "Activo circulante / Pasivo circulante", "Utilidad neta / Activo"], "Razón de pasivo a activo.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Palanca financiera (apalancamiento) =", "Pasivo total / Capital contable", ["Pasivo total / Activo total", "Capital / Activo", "Activo / Pasivo"], "Relación entre financiamiento externo (pasivo) y aportaciones internas (capital).", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Cobertura de intereses =", "(UAFIR + Depreciación + Amortización) / Intereses pagados", ["Utilidad neta / Intereses", "Intereses / Ventas", "Pasivo / UAFIR"], "Veces que la empresa puede soportar su carga financiera.", "Laura Garza cap. 9 · 9.5.6", null], ["ae.eef", "Razón que muestra la capacidad de la empresa para enfrentar su deuda con costo financiero:", "Cobertura de intereses", ["Margen de utilidad", "Prueba del ácido", "Rotación de activo"], "Pregunta de repaso del libro.", "Laura Garza cap. 9 · 9.5.6 · Repaso 14", null], ["ae.eef", "Análisis que otorga el 100 % a un total (ventas, activo, pasivo y capital) y muestra qué porcentaje representa cada cuenta:", "Análisis vertical", ["Análisis horizontal", "Razones financieras", "Análisis de tendencias"], "Mide la composición de las subcuentas.", "Laura Garza cap. 9 · 9.5.7", null], ["ae.eef", "Análisis que mide las variaciones de la misma cuenta de un periodo a otro en pesos, porcentaje o coeficiente:", "Análisis horizontal", ["Análisis vertical", "Análisis fundamental", "Análisis técnico"], "Compara periodos.", "Laura Garza cap. 9 · 9.5.7", null], ["ae.eef", "El análisis horizontal también se conoce como:", "Aumentos y disminuciones", ["Porcentual", "Compras y ventas", "Sumas y restas por variable"], "Pregunta de repaso del libro. El vertical es el porcentual.", "Laura Garza cap. 9 · 9.5.7 · Repaso 7", null], ["ae.eef", "El análisis vertical también se conoce como:", "Porcentual (porcientos integrales)", ["Aumentos y disminuciones", "Tendencias", "Comparativo"], "Expresa cada cuenta como porcentaje de un total.", "Laura Garza cap. 9 · 9.5.8", null], ["ae.eef", "¿Qué permite medir el análisis vertical?", "La composición de las subcuentas que integran una cuenta en particular", ["El aumento o disminución de una cuenta entre periodos", "El precio teórico de la acción", "La tendencia del precio en bolsa"], "Vertical = composición; horizontal = variación entre periodos.", "Laura Garza cap. 9 · 9.5.8", null], ["ae.fdm", "El análisis realizado para determinar el valor intrínseco o precio teórico de las acciones se denomina:", "Análisis fundamental", ["Análisis técnico", "Análisis horizontal", "Análisis chartista"], "Estudia la información de la compañía y su contexto sectorial y macroeconómico.", "Laura Garza cap. 9 · 9.6.1", null], ["ae.fdm", "El análisis fundamental busca obtener:", "El valor intrínseco o precio teórico de la empresa", ["La tendencia de corto plazo del precio", "Las zonas de sobrecompra", "El volumen de operación"], "El técnico estudia precios y volúmenes; el fundamental, el valor intrínseco.", "Laura Garza cap. 9 · 9.6.1", null], ["ae.fdm", "¿Cuál es un fundamental de una ECONOMÍA?", "La inflación", ["La política de financiamiento de la empresa", "La rotación de inventarios", "El análisis sectorial de la emisora"], "Fundamentales de la economía: PIB, inflación, tasas y oferta monetaria, tipo de cambio, demanda, inversión, ahorro, déficit, balanza de pagos, etc.", "Laura Garza cap. 9 · 9.6.1", null], ["ae.fdm", "¿Cuál es un fundamental de una EMPRESA?", "Análisis del balance y sus razones financieras", ["El tipo de cambio", "La tasa de desempleo", "El déficit público sobre PIB"], "De la empresa: política de financiamiento, balance, resultados, flujo de efectivo y análisis sectorial.", "Laura Garza cap. 9 · 9.6.1", null], ["ae.fdm", "¿Cuál NO es un método de valoración de empresas listado en el libro?", "El método de promedios móviles", ["Descuento de dividendos", "Descuento de flujos de caja libre", "Medidas de creación de valor"], "Los promedios móviles son análisis técnico.", "Laura Garza cap. 9 · 9.6.1", null], ["ae.fdm", "Según el libro, el múltiplo 'ingresos por acción' se obtiene dividiendo:", "El valor de mercado de cada acción entre la utilidad por acción (UPA)", ["Las ventas totales entre las acciones", "La utilidad neta entre el capital", "El EBITDA entre las acciones"], "Así lo define el libro en 9.6.2.", "Laura Garza cap. 9 · 9.6.2", null], ["ae.fdm", "El flujo de efectivo por acción es:", "Utilidad neta más partidas que no suponen salida de efectivo (depreciación, pérdida cambiaria y monetaria), entre las acciones en circulación", ["Ventas entre acciones en circulación", "Precio entre UPA", "Dividendos entre precio"], "Suma las partidas virtuales restadas en la contabilidad.", "Laura Garza cap. 9 · 9.6.2", null], ["ae.fdm", "El WACC (CPPC) es:", "La tasa de descuento para descontar los flujos operativos al valorar una empresa", ["La tasa de interés interbancaria", "El rendimiento del dividendo", "El margen operativo"], "Costo promedio ponderado del capital.", "Laura Garza cap. 9 · 9.6.3", null], ["ae.fdm", "En la fórmula del WACC, Ke representa:", "La tasa de costo de oportunidad de los accionistas (se obtiene con CAPM)", ["El costo de la deuda", "La tasa de impuestos", "El capital aportado"], "Kd = costo de la deuda; T = tasa de impuestos; CAA = capital aportado; D = deuda.", "Laura Garza cap. 9 · 9.6.4", null], ["ae.fdm", "El método usado para obtener Ke en el WACC es:", "CAPM", ["Prueba del ácido", "Análisis vertical", "Método Dow"], "Ke = costo de oportunidad de los accionistas.", "Laura Garza cap. 9 · 9.6.4", null], ["ae.fdm", "En el WACC, la diferencia (1 − T) se conoce como:", "Escudo fiscal (tax shield)", ["Prima de riesgo", "Costo de oportunidad", "Beta"], "Los intereses son deducibles, por eso la deuda cuesta Kd × (1 − T).", "Laura Garza cap. 9 · 9.6.4", null], ["ae.fdm", "La fórmula del WACC es:", "Ke × CAA/(CAA + D) + Kd × (1 − T) × D/(CAA + D)", ["Ke + Kd × T", "(Ke + Kd) / 2", "Ke × D/(CAA + D) + Kd × CAA/(CAA + D)"], "Ponderar cada costo por su peso en el financiamiento; la deuda neta de impuestos.", "Laura Garza cap. 9 · 9.6.4", null], ["ae.fdm", "El método de descuento de flujos de efectivo determina:", "El valor actual de los flujos futuros descontados a una tasa que refleja el costo de capital", ["El precio de cierre de mañana", "Las zonas de soporte", "El margen de utilidad"], "Sirve para valorar un proyecto o una compañía entera.", "Laura Garza cap. 9 · 9.6.5", null], ["ae.fdm", "Se descuentan los flujos futuros porque:", "No es lo mismo contar con una cantidad de dinero ahora que en el futuro", ["Así lo exige la CNBV", "Se elimina el riesgo", "Los flujos futuros siempre son negativos"], "Valor del dinero en el tiempo.", "Laura Garza cap. 9 · 9.6.5", null], ["ae.fdm", "El enfoque más utilizado del descuento de flujos es el 'Enterprise Approach', que valúa el patrimonio como:", "Valor de los activos operativos menos el valor de la deuda más otros activos no operativos", ["Suma de dividendos pagados", "Capital social más utilidades retenidas", "Precio por número de acciones"], "Los flujos operativos no incorporan intereses ni dividendos.", "Laura Garza cap. 9 · 9.6.5", null], ["ae.fdm", "EBITDA (UAFIDA) significa:", "Utilidad antes de intereses, impuestos, depreciaciones y amortizaciones", ["Utilidad después de impuestos y dividendos", "Utilidad bruta menos gastos de venta", "Utilidad neta más dividendos"], "Mide los recursos que genera la empresa al margen de su estructura financiera e impuestos.", "Laura Garza cap. 9 · 9.6.6", null], ["ae.fdm", "Para comparar el EBITDA entre empresas conviene:", "Relativizarlo frente al activo, los recursos propios o las ventas", ["Usarlo solo en pesos absolutos", "Sumarle los dividendos", "Restarle la depreciación"], "Así se obtienen ratios comparables en el tiempo y entre empresas.", "Laura Garza cap. 9 · 9.6.6", null], ["ae.fdm", "El PER (Price-Earning Ratio) relaciona:", "El precio de mercado con la utilidad por acción", ["El precio con el valor en libros", "El precio con las ventas", "El valor empresa con el EBITDA"], "P/UPA = Precio de mercado / Utilidad por acción.", "Laura Garza cap. 9 · 9.6.7", null], [" const FORMULAS = [["DA = C + I + G + (X − M)", "Demanda agregada; el consumo es ~60 %"], ["Tasa de desempleo", "Desempleados / población activa"], ["M1 ⊂ M2 ⊂ M3 ⊂ M4", "M1 líquido · M2 + captación y fondos de retiro · M3 + residentes del exterior · M4 + sucursales en el exterior"], ["Razón circulante", "Activo circulante / Pasivo circulante"], ["Prueba del ácido", "(Activo circulante − Inventario) / Pasivo circulante"], ["Rotación de activo", "Ventas / Promedio de activo"], ["Rotación de activo fijo", "Ventas / Promedio de activo fijo"], ["Rotación de inventario", "Costo de ventas / Promedio de inventario"], ["Días de inventario", "360 / Rotación de inventario"], ["Margen de utilidad", "Utilidad neta / Ventas × 100"], ["ROI (ROA)", "Utilidad neta / Promedio de activo × 100"], ["ROE", "Utilidad neta / Capital contable INICIAL × 100"], ["Pasivo a activo", "Pasivo total / Activo total"], ["Palanca financiera", "Pasivo total / Capital contable"], ["Cobertura de intereses", "(UAFIR + Depreciación + Amortización) / Intereses pagados"], ["P/U (PER)", "Precio de mercado / Utilidad por acción"], ["P/VL", "Precio de mercado / Valor en libros"], ["Valor empresa", "Valor de mercado + Deuda neta + (Minoritario × P/VL)"], ["VE/EBITDA", "Valor de la empresa / EBITDA (solo mismo sector)"], ["WACC", "Ke × CAA/(CAA+D) + Kd × (1 − T) × D/(CAA+D) · (1 − T) = escudo fiscal"], ["VAFFD", "I₀ + Σ FFₜ / (1 + i)ᵗ"], ["MACD", "EMA 12 y EMA 26, señal EMA 9"], ["RSI", "14 sesiones · 0 a 100 · sobreventa 30 / sobrecompra 70"], ["Bollinger", "Media 21 ± 2 desviaciones · >50 → 2.5 · ~10 → 1.5"], ["Dow", "Primaria = marea (6 m–1 a+) · secundaria = olas (3 sem–3 m) · terciaria = ondas (<3 sem)"], ["Ciclo", "Auge → recesión → depresión → recuperación"]];

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return "q" + (h >>> 0).toString(36); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const MIN = 60e3, DAY = 864e5;
// Caja 0 = nueva; 1 = reaprender (10 min); 2 = 1 día; 3 = 3 días (dominada); 4 = 7 días; 5 = 21 días
const INTERVAL = [0, 10 * MIN, DAY, 3 * DAY, 7 * DAY, 21 * DAY];
const MASTER = 3;

const Q = RAW.map(r => ({ id: hash(r[0] + "|" + r[1]), t: r[0], m: r[0].split(".")[0], q: r[1], a: r[2], d: r[3], e: r[4], s: r[5], f: r[6] }));
const KEY = "ordinario.v1";
let S = load();
function load() {
  try { const x = JSON.parse(localStorage.getItem(KEY)); if (x && x.q) return Object.assign({ sims: [], size: 20, mat: "all" }, x); } catch (e) {}
  return { q: {}, sims: [], size: 20, mat: "all" };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function st(id) { return S.q[id] || (S.q[id] = { b: 0, due: 0, s: 0, ok: 0, ko: 0 }); }
const seen = q => !!(S.q[q.id] && S.q[q.id].s > 0);
const scope = () => S.mat === "all" ? Q : Q.filter(q => q.m === S.mat);
const matName = m => m === "all" ? "Todas las materias" : MATERIAS[m][0];

function counts(pool) {
  const now = Date.now(); let n = 0, l = 0, d = 0, due = 0;
  pool.forEach(q => {
    const x = S.q[q.id];
    if (!x || x.s === 0) n++; else if (x.b >= MASTER) d++; else l++;
    if (x && x.s > 0 && x.due <= now) due++;
  });
  return { n, l, d, due, total: pool.length };
}

// ---------- Selección de reactivos ----------
function buildSession(pool, size) {
  const now = Date.now();
  const due = pool.filter(q => seen(q) && S.q[q.id].due <= now).sort((a, b) => S.q[a.id].b - S.q[b.id].b || S.q[a.id].due - S.q[b.id].due);
  const fresh = shuffle(pool.filter(q => !seen(q)));
  const later = pool.filter(q => seen(q) && S.q[q.id].due > now).sort((a, b) => S.q[a.id].b - S.q[b.id].b || S.q[a.id].due - S.q[b.id].due);
  const cap = fresh.length ? Math.ceil(size * 0.6) : size;
  let pick = due.slice(0, cap);
  pick = pick.concat(fresh.slice(0, size - pick.length));
  if (pick.length < size) pick = pick.concat(due.slice(cap, cap + size - pick.length));
  if (pick.length < size) pick = pick.concat(later.slice(0, size - pick.length));
  return shuffle(pick);
}
function proportional(pool, n) {
  const by = {}; pool.forEach(q => (by[q.t] = by[q.t] || []).push(q));
  let pick = [];
  Object.values(by).forEach(arr => pick = pick.concat(shuffle(arr).slice(0, Math.max(1, Math.round(n * arr.length / pool.length)))));
  pick = shuffle(pick);
  if (pick.length > n) pick = pick.slice(0, n);
  if (pick.length < n) pick = pick.concat(shuffle(pool.filter(q => !pick.includes(q))).slice(0, n - pick.length));
  return pick;
}
function buildSim(n) {
  if (S.mat !== "all") return shuffle(proportional(scope(), n));
  // Examen global: el mismo peso para cada materia
  const mats = Object.keys(MATERIAS), per = Math.floor(n / mats.length);
  let pick = [];
  mats.forEach((m, i) => pick = pick.concat(proportional(Q.filter(q => q.m === m), per + (i < n % mats.length ? 1 : 0))));
  return shuffle(pick);
}
const item = (q, failed) => ({ q, opts: q.f ? q.f.slice() : shuffle([q.a, ...q.d]), failed: !!failed, retry: !!failed });

// ---------- Estado de la sesión ----------
let R = null;
let timerId = null;

function startSession(mode, opts = {}) {
  let pool = scope(), list, title;
  if (mode === "topic") { pool = Q.filter(q => q.t === opts.topic); title = TOPICS[opts.topic][0]; list = buildSession(pool, Math.min(S.size, pool.length)); }
  else if (mode === "errors") {
    pool = pool.filter(q => S.q[q.id] && S.q[q.id].ko > 0 && S.q[q.id].b < MASTER);
    title = "Mis errores"; list = shuffle(pool).slice(0, S.size);
  }
  else if (mode === "sim") { title = "Simulacro · " + matName(S.mat); list = buildSim(40); }
  else { title = "Sesión inteligente · " + matName(S.mat); list = buildSession(pool, S.size); }
  if (!list.length) return;
  R = { mode, topic: opts.topic, title, queue: list.map(q => item(q)), i: 0, answered: null, firstOk: 0, firstTotal: list.length, wrongIds: new Set(), simAns: [], end: mode === "sim" ? Date.now() + 60 * MIN : 0, advanced: 0, newDone: 0 };
  if (mode === "sim") { clearInterval(timerId); timerId = setInterval(tick, 1000); }
  renderQuiz();
  window.scrollTo(0, 0);
}

function answer(k) {
  if (!R || R.answered !== null) return;
  const it = R.queue[R.i], ok = it.opts[k] === it.q.a;
  if (R.mode === "sim") { R.simAns.push({ q: it.q, pick: it.opts[k], ok }); R.answered = k; nextQ(); return; }
  R.answered = k; it.ok = ok;
  const x = st(it.q.id);
  if (!ok) {
    x.ko++; x.s++; x.b = 1; x.due = Date.now() + INTERVAL[1];
    if (!it.retry) R.wrongIds.add(it.q.id);
    it.failed = true;
    const at = Math.min(R.i + 4, R.queue.length);
    R.queue.splice(at, 0, item(it.q, true));
    save();
  }
  renderQuiz();
}

function nextQ() {
  if (!R) return;
  const it = R.queue[R.i];
  if (R.mode !== "sim" && it.ok) {
    const x = st(it.q.id), guessed = $("#guess") && $("#guess").checked;
    if (it.retry) { x.s++; x.b = 1; x.due = Date.now() + INTERVAL[1]; }
    else {
      const wasNew = x.s === 0;
      x.s++; x.ok++; R.firstOk++;
      if (guessed) { x.b = 1; x.due = Date.now() + INTERVAL[1]; }
      else { x.b = wasNew ? 2 : Math.min(x.b + 1, 5); x.due = Date.now() + INTERVAL[x.b]; if (x.b >= MASTER) R.advanced++; }
      if (wasNew) R.newDone++;
    }
    save();
  }
  R.i++; R.answered = null;
  if (R.i >= R.queue.length) return finish();
  renderQuiz();
  const top = $("#qtop"); if (top) top.scrollIntoView({ block: "start" });
}

function finish() {
  clearInterval(timerId);
  if (R.mode === "sim") {
    const now = Date.now();
    R.simAns.forEach(a => { const x = st(a.q.id); x.s++; if (!a.ok) { x.ko++; x.b = 1; x.due = now; } });
    R.queue.slice(R.simAns.length).forEach(it => { R.simAns.push({ q: it.q, pick: null, ok: false }); const x = st(it.q.id); x.s++; x.ko++; x.b = 1; x.due = now; });
    const score = R.simAns.filter(a => a.ok).length;
    S.sims.push({ at: now, score, n: R.simAns.length, mat: S.mat });
    save();
  }
  renderEnd();
}

function tick() {
  if (!R || R.mode !== "sim") return clearInterval(timerId);
  const left = R.end - Date.now();
  const el = $("#timer");
  if (left <= 0) return finish();
  if (el) { const m = Math.floor(left / MIN), s = Math.floor((left % MIN) / 1000); el.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; el.classList.toggle("low", left < 5 * MIN); }
}

// ---------- Vistas ----------
function ring(p) {
  const r = 46, c = 2 * Math.PI * r;
  return `<div class="ring" aria-label="Dominio ${p}%"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" style="stroke:var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}"/></svg><div class="lbl"><b>${p}%</b><span>dominado</span></div></div>`;
}
const bar = k => { const pd = 100 * k.d / k.total, pl = 100 * k.l / k.total; return `<div class="bar" role="img" aria-label="${Math.round(pd)}% dominado"><i class="d" style="width:${pd}%"></i><i class="l" style="width:${pl}%"></i></div>`; };

function renderHome() {
  R = null; clearInterval(timerId);

  const errN = pool.filter(q => S.q[q.id] && S.q[q.id].ko > 0 && S.q[q.id].b < MASTER).length;
  const sims = S.sims.filter(s => (s.mat || "all") === S.mat);
  const lastSim = sims.length ? sims[sims.length - 1] : null;
  const tabs = ["all", ...Object.keys(MATERIAS)].map(m => `<button data-mat="${m}" aria-pressed="${S.mat === m}">${esc(m === "all" ? "Todas" : MATERIAS[m][1])}</button>`).join("");
  const mats = S.mat === "all" ? `<section class="mats">${Object.keys(MATERIAS).map(m => {
      const k = counts(Q.filter(q => q.m === m));
      return `<button class="mat" data-mat="${m}"><b>${esc(MATERIAS[m][0])}${m === "ae" ? `<span class="badge">Nuevo</span>` : ""}</b><span>${esc(MATERIAS[m][2])} · ${k.total} reactivos · ${Math.round(100 * k.d / k.total)} % dominado</span>${bar(k)}</button>`;
    }).join("")}</section>` : "";
  const topics = S.mat === "all" ? "" : Object.keys(TOPICS).filter(t => TOPICS[t][2] === S.mat).map(t => {
    const k = counts(Q.filter(q => q.t === t));
    return `<div class="topic"><div class="name">${esc(TOPICS[t][0])}<small>${esc(TOPICS[t][1])} · ${k.total} reactivos</small></div>
      <button class="btn small act" data-topic="${t}">Practicar</button>${bar(k)}<span class="pct">${Math.round(100 * k.d / k.total)}%</span></div>`;
  }).join("");
  const sizes = [10, 20, 40].map(n => `<button data-size="${n}" aria-pressed="${S.size === n}">${n}</button>`).join("");
  const showF = S.mat === "all" || S.mat === "ae", showN = S.mat === "all" || S.mat === "mn";
  $("#app").innerHTML = `
  <header class="hero">
    <div><div class="eyebrow">Ordinario final · Serie 210 · Libro Laura Garza cap. 9</div>

    ${ring(pct)}
  </header>
  <nav class="tabs" aria-label="Materia">${tabs}</nav>
  <section class="stats" aria-label="Avance">
    <div class="stat k-due"><b>${c.due}</b><span>para repasar hoy</span></div>
    <div class="stat k-new"><b>${c.n}</b><span>sin ver</span></div>
    <div class="stat k-learn"><b>${c.l}</b><span>aprendiendo</span></div>
    <div class="stat k-done"><b>${c.d}</b><span>dominados</span></div>
  </section>
  <section class="card start">
    <div><h2>Sesión inteligente</h2><p class="muted" style="margin:6px 0 0">Mezcla lo que toca repasar hoy con reactivos nuevos de ${S.mat === "all" ? "las cuatro materias" : "todos los temas de esta materia"}. Lo que falles vuelve unas preguntas después hasta que lo contestes bien.</p></div>
    <div class="row"><button class="btn primary" id="go">Empezar ${S.size} reactivos</button>
      <span class="muted" style="font-size:14px">Tamaño</span><div class="seg" role="group" aria-label="Reactivos por sesión">${sizes}</div></div>
  </section>
  <section class="modes">
    <button class="mode" id="sim"><b>Simulacro de examen</b><span>40 reactivos ${S.mat === "all" ? "(10 por materia)" : "de esta materia"} · 60 min · sin pistas · meta 70 %${lastSim ? ` · último: ${Math.round(100 * lastSim.score / lastSim.n)} %` : ""}</span></button>
    <button class="mode" id="err" ${errN ? "" : "disabled"}><b>Mis errores</b><span>${errN ? `${errN} reactivos que fallaste y aún no dominas` : "Aquí aparecerán los reactivos que falles"}</span></button>
  </section>

  ${topics ? `<section class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h2>Temas</h2>

    <div class="topics" style="margin-top:8px">${topics}</div>
  </section>` : ""}
  ${showF ? `<details class="card"${S.mat === "ae" ? " open" : ""}><summary>Formulario de Análisis Económico</summary>
    <div class="tbl-wrap"><table class="nums"><tbody>${FORMULAS.map(n => `<tr><td>${esc(n[0])}</td><td>${esc(n[1])}</td></tr>`).join("")}</tbody></table></div>
  </details>` : ""}
  ${showN ? `<details class="card"><summary>Cifras clave de Marco Normativo</summary>
    <div class="tbl-wrap"><table class="nums"><tbody>${NUMS.map(n => `<tr><td>${esc(n[0])}</td><td>${esc(n[1])}</td></tr>`).join("")}</tbody></table></div>
  </details>` : ""}
  <details class="card"><summary>Cómo funciona el repaso</summary>

    $("#resetYes").onclick = () => { S = { q: {}, sims: [], size: S.size, mat: S.mat }; save(); renderHome(); };
    $("#resetNo").onclick = renderHome;
  };
}

function renderQuiz() {
  const it = R.queue[R.i], sim = R.mode === "sim";
  const total = R.queue.length, letters = ["A", "B", "C", "D"];
  const answered = R.answered !== null && !sim;
  const opts = it.opts.map((o, k) => {
    let cls = "";
    if (answered) { if (o === it.q.a) cls = "right"; else if (k === R.answered) cls = "wrong"; }
    return `<button class="opt ${cls}" data-k="${k}" ${answered ? "disabled" : ""}><span class="k">${letters[k]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  let fb = "";
  if (answered) {
    const ok = it.ok;
    fb = `<div class="fb ${ok ? "ok" : "bad"}" role="status">
      <h3>${ok ? "Correcto" : "Incorrecto"}</h3>
      ${ok ? "" : `<p><b>Respuesta:</b> ${esc(it.q.a)}</p>`}
      <p>${esc(it.q.e)}</p>
      <span class="src">${esc(it.q.s)}</span>
      ${ok && !it.retry ? `<label class="guess"><input type="checkbox" id="guess"> Le atiné de suerte (repetir pronto)</label>` : ""}
      ${!ok ? `<span class="src">Volverá a aparecer en unas preguntas.</span>` : ""}
    </div>`;
  }
  $("#app").innerHTML = `
  <div class="qtop" id="qtop">
    <button class="btn small ghost" id="exit">← ${sim ? "Abandonar" : "Salir"}</button>
    <span class="eyebrow">${esc(R.title)}</span>
    ${sim ? `<span class="timer" id="timer">60:00</span>` : `<span class="mono muted" style="font-size:14px">${R.i + 1} / ${total}</span>`}
  </div>
  <div class="prog"><i style="width:${100 * R.i / total}%"></i></div>
  <article class="card qcard">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="chip mat-chip">${esc(MATERIAS[it.q.m][1])}</span>
      <span class="chip">${esc(TOPICS[it.q.t][0])}</span>
      ${it.retry ? `<span class="chip retry">Otra vez</span>` : ""}
      ${sim ? `<span class="chip">Reactivo ${R.i + 1} de ${total}</span>` : ""}
    </div>
    <p class="qtext">${esc(it.q.q)}</p>
    <div class="opts">${opts}</div>
    ${fb}
    <div class="qfoot"><span class="kbd">${answered ? "Enter para seguir" : "1–4 o A–D para contestar"}</span>
      ${answered ? `<button class="btn primary" id="next">${R.i + 1 >= total ? "Ver resultado" : "Siguiente"}</button>` : ""}</div>
  </article>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  $("#exit").onclick = () => { if (sim) clearInterval(timerId); renderHome(); };
  if ($("#next")) { $("#next").onclick = nextQ; $("#next").focus({ preventScroll: true }); }
  if (sim) tick();
}

function renderEnd() {
  const sim = R.mode === "sim";
  if (sim) {
    const score = R.simAns.filter(a => a.ok).length, n = R.simAns.length, p = Math.round(100 * score / n), pass = p >= 70;
    const key = S.mat === "all" ? (q => q.m) : (q => q.t);
    const label = S.mat === "all" ? (k => MATERIAS[k][0]) : (k => TOPICS[k][0]);
    const by = {};
    R.simAns.forEach(a => { const b = by[key(a.q)] = by[key(a.q)] || [0, 0]; b[1]++; if (a.ok) b[0]++; });
    const rows = Object.keys(by).sort((a, b) => by[a][0] / by[a][1] - by[b][0] / by[b][1]).map(t => `<tr><td>${by[t][0]}/${by[t][1]}</td><td>${esc(label(t))}</td></tr>`).join("");
    const wrong = R.simAns.filter(a => !a.ok).map(a => `<div class="res-item"><span>${esc(a.q.q)}</span><span class="ans">✓ ${esc(a.q.a)}</span>${a.pick ? `<span class="yours">Tu respuesta: ${esc(a.pick)}</span>` : `<span class="yours">Sin contestar</span>`}<span class="muted" style="font-size:15px">${esc(a.q.e)}</span></div>`).join("");
    $("#app").innerHTML = `
    <div class="eyebrow">Simulacro terminado · ${esc(matName(S.mat))}</div>
    <section class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="big ${pass ? "pass" : "fail"}">${p} %</div>
      <p style="margin:0">${score} de ${n} correctos. ${pass ? "Aprobado con la meta de 70 %." : "Debajo de la meta de 70 %. La tabla dice dónde reforzar."}</p>
      <p class="muted" style="margin:0;font-size:15px">Los reactivos que fallaste regresaron a “aprendiendo” y saldrán en tu próxima sesión inteligente.</p>
    </section>
    <section class="card"><h2>${S.mat === "all" ? "Por materia" : "Por tema"}</h2><div class="tbl-wrap"><table class="nums"><tbody>${rows}</tbody></table></div></section>
    ${wrong ? `<section class="card"><h2>Revisa tus errores</h2><div class="res-list" style="margin-top:8px">${wrong}</div></section>` : ""}
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="home">Volver al tablero</button><button class="btn" id="again">Otro simulacro</button></div>`;
    $("#again").onclick = () => startSession("sim");
  } else {
    const c = counts(scope()), pct = Math.round(100 * c.d / c.total);
    const wrong = [...R.wrongIds].map(id => Q.find(q => q.id === id));
    $("#app").innerHTML = `
    <div class="eyebrow">${esc(R.title)} terminada</div>
    <section class="card" style="display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center">
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="big">${R.firstOk}/${R.firstTotal}</div>
        <p style="margin:0">correctos al primer intento · ${R.newDone} reactivos nuevos vistos · ${R.advanced} pasaron a dominados.</p>
        <p class="muted" style="margin:0;font-size:15px">En ${esc(matName(S.mat).toLowerCase())} quedan ${c.n} sin ver y ${c.l} aprendiendo.</p>
      </div>${ring(pct)}
    </section>
    ${wrong.length ? `<section class="card"><h2>Lo que fallaste hoy</h2><div class="res-list" style="margin-top:8px">${wrong.map(q => `<div class="res-item"><span>${esc(q.q)}</span><span class="ans">✓ ${esc(q.a)}</span><span class="muted" style="font-size:15px">${esc(q.e)}</span></div>`).join("")}</div></section>` : ""}
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="again">Otra sesión</button><button class="btn" id="home">Volver al tablero</button></div>`;
    $("#again").onclick = () => startSession(R.mode === "topic" ? "topic" : R.mode === "errors" ? "errors" : "smart", { topic: R.topic });
  }
  $("#home").onclick = renderHome;
  window.scrollTo(0, 0);
}

document.addEventListener("keydown", e => {
  if (!R || e.target.tagName === "INPUT" && e.key !== "Enter") return;
  const k = e.key.toLowerCase();
  const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
  if (R.answered === null && k in map && R.i < R.queue.length) { e.preventDefault(); answer(map[k]); }
  else if (R.answered !== null && R.mode !== "sim" && (e.key === "Enter" || e.key === " ") && e.target.id !== "next") { e.preventDefault(); nextQ(); }
});

renderHome();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
// Pedir almacenamiento persistente para que el navegador no borre el avance
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
