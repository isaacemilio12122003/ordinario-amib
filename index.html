ra.", "Tema 2 · Fondos de Inversión · 1.2 Características como sociedad anónima de capital variable", null], ["fi.s1", "El capital mínimo totalmente pagado para fondos de renta variable, deuda y capitales es:", "$1,000,000", ["$500,000", "2,400,000 UDI", "200,000 UDI"], "El capital mínimo totalmente pagado es $1,000,000 para fondos de renta variable, deuda y capitales. Los montos en UDI (2,400,000 y 200,000) corresponden al capital de las operadoras, no de los fondos.", "Tema 2 · Fondos de Inversión · 1.2 Características como sociedad anónima de capital variable", null], ["fi.s1", "Respecto del capital fijo de un fondo de inversión, es correcto que:", "Es de una sola serie y clase, sin derecho a retiro, y sólo lo suscribe el socio fundador", ["Puede dividirse en varias series y clases", "Se coloca libremente entre el público inversionista", "Puede ser inferior al capital mínimo si lo autoriza la operadora"], "El capital fijo es de una sola serie y clase, sin derecho a retiro, sólo lo suscribe el socio fundador, y no puede ser inferior al capital mínimo aplicable.", "Tema 2 · Fondos de Inversión · 1.3 Capital social: parte fija y parte variable", null], ["fi.s1", "La transmisión, garantía o afectación en fideicomiso de las acciones del capital fijo requiere:", "Autorización de la CNBV", ["Acuerdo del consejo de la operadora", "Aviso a la CONDUSEF", "Registro ante la AMIB"], "La transmisión, garantía o fideicomiso de las acciones del capital fijo requiere autorización de la CNBV.", "Tema 2 · Fondos de Inversión · 1.3 Capital social: parte fija y parte variable", null], ["fi.s1", "Sobre el derecho de preferencia en aumentos de capital de un fondo de inversión:", "No existe, salvo pacto contrario revelado en el prospecto", ["Siempre existe, por tratarse de una sociedad anónima", "Existe sólo para el socio fundador", "Existe sólo para las series de capital variable"], "No existe derecho de preferencia en aumentos de capital, salvo pacto contrario revelado en el prospecto. Es una de las reglas especiales que los separan de una S.A. ordinaria.", "Tema 2 · Fondos de Inversión · 1.3 Capital social: parte fija y parte variable", null], ["fi.s1", "¿Los fondos de inversión deben constituir reserva legal?", "No están obligados a constituirla", ["Sí, el 5% de las utilidades hasta alcanzar el 20% del capital", "Sí, conforme a la Ley General de Sociedades Mercantiles", "Sólo los fondos de capitales"], "Los fondos de inversión no están obligados a constituir reserva legal, a diferencia de una sociedad anónima ordinaria.", "Tema 2 · Fondos de Inversión · 1.3 Capital social: parte fija y parte variable", null], ["fi.s1", "¿Con qué periodicidad mínima debe el consejo de la operadora evaluar a los prestadores de servicios del fondo?", "Al menos anualmente", ["Mensualmente", "Trimestralmente", "Cada dos años"], "LFI arts. 11 y 14: debe analizar la gestión y evaluar al menos anualmente a los prestadores de servicios, comunicar el resultado y, en su caso, sustituirlos.", "Tema 2 · Fondos de Inversión · 1.4 Deberes del consejo de la operadora respecto de cada fondo", null], ["fi.s1", "Los límites máximos de tenencia accionaria por inversionista los establece:", "El consejo de administración de la operadora", ["La asamblea de accionistas del fondo", "La CNBV mediante autorización individual", "La distribuidora que coloca las acciones"], "Corresponde al consejo de administración de la operadora establecer los límites máximos de tenencia accionaria por inversionista, y el prospecto debe revelarlos.", "Tema 2 · Fondos de Inversión · 1.4 Deberes del consejo de la operadora respecto de cada fondo", null], ["fi.s1", "Dentro del concepto de Activos Objeto de Inversión se incluyen:", "Valores, títulos y documentos sujetos a la LMV, otros valores, efectivo, bienes, derechos, créditos e instrumentos derivados, conforme al régimen de inversión aplicable", ["Únicamente valores inscritos en el Registro Nacional de Valores", "Sólo instrumentos de deuda gubernamental", "Exclusivamente acciones de otros fondos de inversión"], "LFI art. 2 fr. I: el concepto es amplio —incluye efectivo, bienes, derechos, créditos y derivados— pero siempre acotado por el régimen de inversión del tipo de fondo y las disposiciones de la CNBV.", "Tema 2 · Fondos de Inversión · 1.5 Activos Objeto de Inversión", null], ["fi.s1", "El concepto de Activos Objeto de Inversión queda acotado por:", "El régimen de inversión previsto en la LFI y las disposiciones de la CNBV para cada tipo de fondo", ["La decisión discrecional del gestor de cartera", "El monto del capital fijo", "La calificación del fondo"], "Aunque la definición es amplia, sólo forman parte del patrimonio los activos que el régimen de inversión y las disposiciones generales de la CNBV permiten para ese tipo de fondo.", "Tema 2 · Fondos de Inversión · 1.5 Activos Objeto de Inversión", null], ["fi.s1", "¿Cuál de los siguientes NO es, por sí solo, una categoría de activo elegible del artículo 5 de las Disposiciones?", "Bienes inmuebles adquiridos para arrendamiento", ["Depósitos bancarios a la vista en moneda nacional o extranjera", "Valores de organismos financieros internacionales de los que México sea miembro", "Instrumentos financieros derivados conforme a las reglas de Banco de México"], "Las categorías del art. 5 DCG comprenden valores nacionales y extranjeros elegibles, valores de fondos extranjeros elegibles, organismos internacionales, depósitos bancarios a la vista y derivados conforme a reglas de Banxico.", "Tema 2 · Fondos de Inversión · 1.6 Requisitos para que un valor sea objeto de inversión", null], ["fi.s1", "Los instrumentos financieros derivados que puede operar un fondo se sujetan a:", "Las reglas de Banco de México", ["Las reglas exclusivas de la AMIB", "Un régimen libre definido en el prospecto", "Autorización individual de la CNBV por operación"], "Los instrumentos financieros derivados se operan conforme a las reglas de Banco de México, además del régimen de inversión del fondo.", "Tema 2 · Fondos de Inversión · 1.6 Requisitos para que un valor sea objeto de inversión", null], ["fi.s1", "Los valores estructurados, los respaldados por activos y los certificados bursátiles fiduciarios:", "Sólo son elegibles cuando el tipo, categoría y régimen del fondo lo permitan", ["Están prohibidos para todo fondo de inversión", "Son elegibles para cualquier fondo de deuda", "Requieren autorización de Banco de México"], "Son instrumentos condicionados: sólo son elegibles cuando el tipo, la categoría y el régimen de inversión del fondo lo permiten.", "Tema 2 · Fondos de Inversión · 1.6 Requisitos para que un valor sea objeto de inversión", null], ["fi.s1", "Los porcentajes de la cartera respecto del activo neto se calculan:", "Diariamente", ["Mensualmente", "Trimestralmente", "Al cierre de cada ejercicio"], "DCG arts. 7 y 37–39: los porcentajes se calculan diariamente sobre el activo neto. La operadora verifica el cumplimiento con precios actualizados de los proveedores de precios.", "Tema 2 · Fondos de Inversión · 1.7 Cartera o portafolio del fondo", null], ["fi.s1", "¿Qué integra la cartera de un fondo de inversión?", "El conjunto de Activos Objeto de Inversión, efectivo, derechos y obligaciones que forman su patrimonio", ["Únicamente los valores inscritos en el RNV", "Sólo los activos que generan rendimiento", "Los activos menos las comisiones por pagar"], "La cartera es el conjunto de Activos Objeto de Inversión, efectivo, derechos y obligaciones que integran el patrimonio del fondo.", "Tema 2 · Fondos de Inversión · 1.7 Cartera o portafolio del fondo", null], ["fi.s1", "La diferencia esencial entre una acción de fondo de inversión y un Cete es que:", "La acción del fondo representa una parte del capital social del fondo, mientras el Cete es un título representativo de deuda de un emisor", ["Ambos representan deuda, sólo cambia el plazo", "La acción del fondo tiene rendimiento garantizado y el Cete no", "El Cete no puede formar parte de la cartera de un fondo"], "La acción del fondo representa una parte de su capital social y su precio deriva del valor neto de la cartera; el Cete es un título de deuda de un emisor con derechos propios.", "Tema 2 · Fondos de Inversión · 1.8 Acción de fondo frente a título de crédito (Cetes y pagarés)", null], ["fi.s1", "Adquirir una acción de un fondo de deuda cuya cartera tiene Cetes significa que el inversionista:", "Adquiere una parte del capital social del fondo, no los títulos individuales", ["Adquiere directamente los Cetes de la cartera", "Se convierte en acreedor del Gobierno Federal", "Recibe el rendimiento exacto de los Cetes"], "Adquirir una acción del fondo no equivale a adquirir directamente cada título de deuda de la cartera: se adquiere una participación en el capital social del fondo.", "Tema 2 · Fondos de Inversión · 1.8 Acción de fondo frente a título de crédito (Cetes y pagarés)", null], ["fi.s1", "Verificar que las operaciones se ajusten al régimen de inversión y celebrarlas en nombre y por cuenta del fondo corresponde a:", "La operadora", ["La distribuidora", "La valuadora", "El proveedor de precios"], "LFI art. 39: la operadora administra activos, celebra las operaciones permitidas en nombre y por cuenta del fondo y verifica el régimen de inversión.", "Tema 2 · Fondos de Inversión · 1.9 Operadoras y distribuidoras: qué hace cada una", null], ["fi.s1", "Promover y asesorar sobre las acciones del fondo e instruir su compra y venta corresponde a:", "La distribuidora", ["La operadora exclusivamente", "La calificadora", "La institución para el depósito de valores"], "LFI art. 40: la distribuidora promueve y asesora sobre las acciones del fondo e instruye su compra y venta por cuenta y orden del fondo o del cliente.", "Tema 2 · Fondos de Inversión · 1.9 Operadoras y distribuidoras: qué hace cada una", null], ["fi.s1", "Respecto de los ETFs, es correcto afirmar que:", "'ETF' no es uno de los cuatro tipos legales del artículo 6 de la LFI", ["Son el quinto tipo legal de fondo previsto en el artículo 6 de la LFI", "Son sinónimo de fondo indizado", "Están prohibidos en México"], "'ETF' no es uno de los cuatro tipos legales del art. 6 de la LFI. La diferencia operativa central es la negociación bursátil durante la sesión.", "Tema 2 · Fondos de Inversión · 1.10 Fondos de inversión frente a ETFs", null], ["fi.s1", "La diferencia entre 'indizado' y 'cotizado' es que:", "'Indizado' describe el objetivo de replicación y 'cotizado' el mecanismo de negociación", ["Son términos equivalentes", "'Indizado' aplica a deuda y 'cotizado' a renta variable", "'Cotizado' significa que replica un índice"], "No son sinónimos: 'indizado' describe el objetivo de replicación de una referencia; 'cotizado' describe el mecanismo de negociación bursátil.", "Tema 2 · Fondos de Inversión · 1.10 Fondos de inversión frente a ETFs", null], ["fi.s1", "¿Es correcto afirmar que ningún fondo de inversión cotiza en bolsa?", "No: la LFI prevé supuestos en que acciones de fondos pueden cotizar o estar listadas en bolsa", ["Sí, la LFI lo prohíbe expresamente", "Sí, sólo los ETFs cotizan", "Sólo pueden cotizar los fondos de cobertura"], "Es incorrecto ese absoluto. La propia LFI prevé supuestos en que acciones de fondos pueden cotizar o estar listadas en bolsa (por ejemplo, el régimen de recompra de los arts. 15-III y 18-IV).", "Tema 2 · Fondos de Inversión · 1.10 Fondos de inversión frente a ETFs", null], ["fi.s1", "Las Siefores están sujetas a la supervisión de:", "La CONSAR", ["La CNBV", "Banco de México", "La CONDUSEF"], "LFI art. 6, últimos párrafos: las Siefores están sujetas a supervisión de la CONSAR y se rigen por la Ley de los Sistemas de Ahorro para el Retiro. Los fondos de inversión, por la LFI y la CNBV.", "Tema 2 · Fondos de Inversión · 1.11 Fondos de inversión frente a Siefores", null], ["fi.s1", "La diferencia de fondo entre un fondo de inversión y una Siefore es que:", "La Siefore administra recursos destinados al retiro y se rige por la Ley de los SAR", ["La Siefore no puede invertir en deuda", "El fondo de inversión no requiere autorización", "Ambos se rigen por la LFI"], "Las Siefores administran recursos destinados al retiro, se rigen por la Ley de los Sistemas de Ahorro para el Retiro y las supervisa la CONSAR.", "Tema 2 · Fondos de Inversión · 1.11 Fondos de inversión frente a Siefores", null], ["fi.s1", "Un 'fondo de fondos' es:", "Una categoría regulatoria de renta variable o deuda cuyo régimen contempla inversión preponderante en acciones de otros fondos o mecanismos de inversión colectiva", ["Un quinto tipo legal de fondo", "Un fondo que sólo invierte en deuda gubernamental", "Una operadora que administra varios fondos"], "LFI art. 15-IV y DCG Anexo 1: es una categoría regulatoria de renta variable o deuda, no un tipo legal.", "Tema 2 · Fondos de Inversión · 1.12 Fondo de fondos", null], ["fi.s1", "La diversificación de un fondo de fondos:", "Depende de la composición subyacente y no elimina los riesgos de mercado, crédito, liquidez ni concentración", ["Elimina el riesgo de mercado por definición", "Garantiza menor volatilidad que cualquier fondo directo", "Está prohibida por las Disposiciones"], "La diversificación resultante depende de la composición subyacente y no elimina los riesgos de mercado, crédito, liquidez ni concentración.", "Tema 2 · Fondos de Inversión · 1.12 Fondo de fondos", null], ["fi.s1", "En operaciones de reporto y préstamo de valores, el fondo de inversión puede actuar como:", "Reportada, reportadora, prestataria o prestamista", ["Únicamente reportadora", "Únicamente prestamista", "No puede celebrar estas operaciones"], "LFI art. 15 fr. II: puede actuar, según el caso, como reportada, reportadora, prestataria o prestamista, con instituciones de crédito, casas de bolsa y entidades financieras del exterior.", "Tema 2 · Fondos de Inversión · 1.13 Operaciones permitidas I: activos, reportos y recompra", null], ["fi.s1", "Sobre la recompra de sus propias acciones por un fondo de inversión:", "Puede adquirir las acciones que emita, sin que aplique la prohibición del artículo 134 de la LGSM", ["Está prohibida en todos los casos por el artículo 134 de la LGSM", "Requiere autorización individual de la CNBV en cada caso", "Sólo la pueden hacer los fondos de capitales"], "LFI art. 15 fr. III: puede adquirir las acciones que emita sin que aplique la prohibición del art. 134 de la LGSM. No aplica a fondos de capitales ni cerrados, salvo que coticen en bolsa.", "Tema 2 · Fondos de Inversión · 1.13 Operaciones permitidas I: activos, reportos y recompra", null], ["fi.s1", "La facultad de recomprar sus propias acciones NO aplica, en principio, a:", "Fondos de capitales o cerrados, salvo que coticen en bolsa", ["Fondos de renta variable", "Fondos de deuda", "Fondos indizados"], "La recompra del art. 15-III no aplica a fondos de capitales ni cerrados, a menos que coticen en bolsa, caso en el que se ajustan al régimen de la LMV.", "Tema 2 · Fondos de Inversión · 1.13 Operaciones permitidas I: activos, reportos y recompra", null], ["fi.s1", "¿Puede un fondo de inversión obtener préstamos y créditos?", "Sí, de instituciones de crédito, intermediarios financieros no bancarios y entidades financieras del exterior", ["No, le está prohibido todo financiamiento", "Sólo de su sociedad operadora", "Sólo con autorización de Banco de México"], "LFI art. 15 fr. V: puede obtener préstamos y créditos de instituciones de crédito, intermediarios financieros no bancarios y entidades financieras del exterior. Debe revelarse en el prospecto y en el estado de cuenta.", "Tema 2 · Fondos de Inversión · 1.14 Operaciones permitidas II: otros fondos, crédito y deuda propia", null], ["fi.s1", "Respecto de la emisión de deuda propia, un fondo de inversión:", "Puede emitir valores representativos de una deuda a su cargo para el cumplimiento de su objeto", ["Tiene prohibido emitir cualquier valor distinto de sus acciones", "Sólo puede emitir certificados bursátiles fiduciarios", "Requiere ser un fondo de capitales"], "LFI art. 15 fr. VI: puede emitir valores representativos de una deuda a su cargo para el cumplimiento de su objeto social.", "Tema 2 · Fondos de Inversión · 1.14 Operaciones permitidas II: otros fondos, crédito y deuda propia", null], ["fi.s1", "¿Cuál de las siguientes está expresamente PROHIBIDA a los fondos de inversión?", "Recibir depósitos de dinero", ["Celebrar reportos sobre valores", "Comprar acciones de otros fondos de inversión", "Emitir deuda a su cargo"], "LFI art. 18 fr. I: recibir depósitos de dinero está prohibido. Las otras tres son operaciones permitidas del artículo 15.", "Tema 2 · Fondos de Inversión · 1.15 Prohibiciones a los fondos de inversión", null], ["fi.s1", "Un fondo de inversión puede dar en garantía sus activos:", "Sólo cuando tenga por objeto garantizar el cumplimiento de obligaciones a cargo del propio fondo", ["Nunca, bajo ninguna circunstancia", "Cuando lo autorice su distribuidora", "Para garantizar obligaciones de su operadora"], "La prohibición del art. 18 fr. II admite una excepción: cuando la garantía tenga por objeto garantizar el cumplimiento de obligaciones a cargo del propio fondo. Avalar obligaciones de un tercero está prohibido.", "Tema 2 · Fondos de Inversión · 1.15 Prohibiciones a los fondos de inversión", null], ["fi.s1", "Las operaciones activas de crédito están prohibidas a los fondos, excepto:", "Los préstamos y reportos sobre valores", ["Los créditos simples con garantía prendaria", "Los créditos a personas relacionadas", "Los créditos a su sociedad operadora"], "LFI art. 18: se prohíbe practicar operaciones activas de crédito, excepto préstamos y reportos sobre valores.", "Tema 2 · Fondos de Inversión · 1.15 Prohibiciones a los fondos de inversión", null], ["fi.s1", "El estado de cuenta debe presentar la posición de acciones valuada:", "Al último día del corte del período y la del corte del período anterior", ["Sólo al último día del corte del período", "Al inicio del ejercicio fiscal", "Al precio de adquisición histórico"], "LFI art. 61 Bis fr. I: la posición valuada al último día del corte del período que corresponda y la del corte del período anterior, para permitir la comparación.", "Tema 2 · Fondos de Inversión · 1.16 Estado de cuenta: contenido I", null], ["fi.s1", "Los avisos sobre modificaciones al prospecto de información:", "Deben incluirse, en su caso, en el estado de cuenta", ["Se publican sólo en el Diario Oficial", "Se comunican únicamente a la CNBV", "No requieren comunicación al cliente"], "LFI art. 61 Bis fr. III: en su caso, el estado de cuenta debe contener los avisos sobre las modificaciones a los prospectos de información al público inversionista.", "Tema 2 · Fondos de Inversión · 1.16 Estado de cuenta: contenido I", null], ["fi.s1", "El cálculo del rendimiento de las carteras que se incluye en el estado de cuenta se realiza conforme a:", "Las disposiciones de carácter general que establezca la CNBV", ["La metodología que libremente elija la distribuidora", "El criterio del proveedor de precios", "La metodología de la calificadora"], "LFI art. 61 Bis fr. VI: el resultado del cálculo del rendimiento se realiza conforme a las disposiciones de carácter general que establezca la CNBV.", "Tema 2 · Fondos de Inversión · 1.17 Estado de cuenta: contenido II", null], ["fi.s1", "¿Cuál de estos elementos debe contener el estado de cuenta?", "El plazo para la formulación de observaciones", ["La lista de emisoras de la cartera con su calificación individual", "El nombre del contralor normativo", "El acta de la última sesión del consejo"], "LFI art. 61 Bis fr. IV: debe contener el plazo para la formulación de observaciones, además de posición valuada, movimientos, avisos de prospecto, información sobre financiamiento del fondo y el cálculo del rendimiento.", "Tema 2 · Fondos de Inversión · 1.17 Estado de cuenta: contenido II", null], ["fi.s2", "Las series y clases del capital variable pueden tener:", "Derechos y obligaciones económicas distintos, revelados en el prospecto", ["Idénticos derechos en todos los casos", "Distinto derecho de voto en la asamblea", "Garantía de capital diferenciada"], "El capital variable puede dividirse en series y clases con derechos y obligaciones económicas distintos; el prospecto debe revelar características, derechos, montos mínimos, tipo de inversionista, régimen fiscal y comisiones.", "Tema 2 · Fondos de Inversión · 2.1 Series y clases accionarias: derechos y costos diferenciados", null], ["fi.s2", "La diferenciación entre series accionarias NO puede:", "Generar prácticas discriminatorias entre distribuidoras ni trato inequitativo entre inversionistas comparables", ["Considerar montos mínimos de inversión distintos", "Asignar comisiones distintas", "Reflejar costos directamente asignables"], "El límite expreso es que la diferenciación no puede generar prácticas discriminatorias entre distribuidoras ni trato inequitativo entre inversionistas comparables.", "Tema 2 · Fondos de Inversión · 2.1 Series y clases accionarias: derechos y costos diferenciados", null], ["fi.s2", "¿Cuáles son los cuatro tipos legales de fondo de inversión del artículo 6 de la LFI?", "Renta variable, instrumentos de deuda, capitales y cobertura", ["Renta variable, deuda, indizados y ETFs", "Deuda, capitales, fondo de fondos y discrecionales", "Abiertos, cerrados, indizados y de cobertura"], "LFI art. 6: renta variable, instrumentos de deuda, capitales y cobertura. 'Indizado', 'fondo de fondos', 'discrecional' y 'ETF' son categorías o mecanismos, no tipos legales.", "Tema 2 · Fondos de Inversión · 2.2 Los cuatro tipos legales de fondo", null], ["fi.s2", "Los fondos de inversión de cobertura están reservados a:", "Inversionistas calificados e institucionales", ["Cualquier inversionista que firme una advertencia de riesgo", "Inversionistas con horizonte mayor a tres años", "Personas morales exclusivamente"], "LFI arts. 30–31: el fondo de cobertura puede operar con cualquier Activo Objeto de Inversión definido en el prospecto, pero sólo está disponible para inversionistas calificados e institucionales.", "Tema 2 · Fondos de Inversión · 2.2 Los cuatro tipos legales de fondo", null], ["fi.s2", "Los fondos de inversión de capitales invierten preponderantemente en:", "Acciones, partes sociales, obligaciones y bonos de Empresas Promovidas", ["Deuda gubernamental de largo plazo", "Acciones listadas en la Bolsa Mexicana de Valores", "Instrumentos derivados"], "LFI art. 26: los fondos de capitales invierten preponderantemente en acciones, partes sociales, obligaciones y bonos de Empresas Promovidas.", "Tema 2 · Fondos de Inversión · 2.2 Los cuatro tipos legales de fondo", null], ["fi.s2", "Un fondo cuyo régimen le permite operar con cualquier Activo Objeto de Inversión definido en su prospecto corresponde al tipo:", "Cobertura", ["Renta variable", "Instrumentos de deuda", "Capitales"], "El fondo de cobertura (arts. 30–31) puede operar con cualquier Activo Objeto de Inversión definido en el prospecto, y por eso se restringe a inversionistas calificados e institucionales.", "Tema 2 · Fondos de Inversión · 2.2 Los cuatro tipos legales de fondo", null], ["fi.s2", "En un fondo indizado, el prospecto debe identificar:", "La base de referencia, su proveedor, la fuente pública de consulta y los riesgos de desviación o error de seguimiento", ["Únicamente el nombre del índice", "El rendimiento garantizado de la referencia", "La lista completa de emisoras con su peso exacto diario"], "DCG arts. 4 y 14 Bis-XVII: el prospecto debe identificar la base, su proveedor, la fuente pública de consulta y los riesgos de desviación o error de seguimiento.", "Tema 2 · Fondos de Inversión · 2.3 Fondos indizados", null], ["fi.s2", "Si cambia la composición del índice que replica un fondo indizado:", "Puede actualizarse el régimen y la política conforme a los supuestos y autorizaciones de las Disposiciones", ["El fondo debe liquidarse", "El fondo pierde su categoría automáticamente", "Debe convertirse en fondo discrecional"], "Si cambia la composición del índice, puede actualizarse el régimen y la política conforme a los supuestos y autorizaciones previstos en las Disposiciones.", "Tema 2 · Fondos de Inversión · 2.3 Fondos indizados", null], ["fi.s2", "La 'cobertura cambiaria' como categoría o estrategia:", "Es una categoría o estrategia de exposición a moneda prevista en el prospecto, distinta del tipo legal de fondo de cobertura", ["Es lo mismo que el tipo legal 'fondo de inversión de cobertura' de los artículos 30 y 30 Bis", "Garantiza el capital en dólares", "Sólo puede usarse en fondos de capitales"], "Es una trampa frecuente: la cobertura cambiaria es una categoría o estrategia de exposición a moneda; NO debe confundirse con el tipo legal 'fondo de inversión de cobertura' de los arts. 30 y 30 Bis.", "Tema 2 · Fondos de Inversión · 2.4 Cobertura cambiaria: exposición, no garantía", null], ["fi.s2", "En una exposición neta larga a moneda extranjera, una depreciación del peso:", "Tiende a elevar el valor en pesos de la posición", ["Tiende a reducir el valor en pesos de la posición", "No tiene efecto si el fondo es de deuda", "Genera una minusvalía automática"], "Con exposición neta larga a moneda extranjera, la depreciación del peso tiende a elevar el valor en pesos y la apreciación tiende a reducirlo.", "Tema 2 · Fondos de Inversión · 2.4 Cobertura cambiaria: exposición, no garantía", null], ["fi.s2", "El término 'cobertura' en la denominación o estrategia de un fondo:", "No garantiza capital ni rendimiento", ["Garantiza el capital invertido", "Garantiza un rendimiento mínimo en moneda extranjera", "Elimina el riesgo de tipo de cambio"], "El resultado depende de tasas, crédito, liquidez, costos, derivados y eficacia de la cobertura. El término no garantiza capital ni rendimiento.", "Tema 2 · Fondos de Inversión · 2.4 Cobertura cambiaria: exposición, no garantía", null], ["fi.s2", "La categoría de plazo de un fondo de deuda se determina por:", "La duración promedio ponderada de la cartera", ["El vencimiento del instrumento más largo de la cartera", "El horizonte de inversión sugerido en el prospecto", "El plazo de liquidación de las operaciones"], "DCG art. 4 y Anexo 1: la categoría se determina por la duración promedio ponderada de la cartera, no por el vencimiento individual de cada instrumento.", "Tema 2 · Fondos de Inversión · 2.5 Fondos de deuda: corto, mediano y largo plazo", null], ["fi.s2", "Un fondo de deuda de corto plazo tiene una duración:", "Menor o igual a un año", ["Menor o igual a seis meses", "Mayor a un año y menor o igual a tres años", "Mayor a tres años"], "Corto plazo: duración menor o igual a un año, con menor sensibilidad ante cambios en tasas.", "Tema 2 · Fondos de Inversión · 2.5 Fondos de deuda: corto, mediano y largo plazo", null], ["fi.s2", "Un fondo de deuda de mediano plazo tiene una duración:", "Mayor a un año y menor o igual a tres años", ["Menor o igual a un año", "Mayor a tres y menor o igual a cinco años", "Mayor a cinco años"], "Mediano plazo: duración mayor a un año y menor o igual a tres años, con sensibilidad intermedia.", "Tema 2 · Fondos de Inversión · 2.5 Fondos de deuda: corto, mediano y largo plazo", null], ["fi.s2", "¿Qué fondo de deuda es más sensible a movimientos de tasas de interés?", "El de largo plazo, con duración mayor a tres años", ["El de corto plazo", "El de mediano plazo", "Todos igual, la duración no influye"], "A mayor duración, mayor sensibilidad del precio ante movimientos de tasas. El de largo plazo (duración mayor a tres años) es el más sensible.", "Tema 2 · Fondos de Inversión · 2.5 Fondos de deuda: corto, mediano y largo plazo", null], ["fi.s2", "Los fondos de deuda invierten:", "Exclusivamente en valores, títulos o documentos representativos de una deuda a cargo de un tercero", ["En acciones y valores de deuda indistintamente", "Preponderantemente en Empresas Promovidas", "Sólo en deuda gubernamental"], "Los fondos de deuda invierten exclusivamente en valores, títulos o documentos representativos de una deuda a cargo de un tercero, y pueden ser de corto, mediano o largo plazo.", "Tema 2 · Fondos de Inversión · 2.6 Deuda, renta variable y fondo de fondos: en qué invierte cada uno", null], ["fi.s2", "Los fondos de renta variable invierten en:", "Acciones, obligaciones y demás valores, títulos o documentos representativos de una deuda a cargo de un tercero", ["Sólo acciones", "Sólo instrumentos derivados", "Acciones de otros fondos exclusivamente"], "LFI art. 24: los fondos de renta variable invierten en acciones, obligaciones y demás valores, títulos o documentos representativos de una deuda a cargo de un tercero.", "Tema 2 · Fondos de Inversión · 2.6 Deuda, renta variable y fondo de fondos: en qué invierte cada uno", null], ["fi.s2", "Para usar en su denominación o publicidad expresiones que aludan a una especialidad, el fondo debe mantener al menos:", "80% del activo neto en esos activos", ["51% del activo neto en esos activos", "70% del activo neto en esos activos", "100% del activo neto en esos activos"], "DCG arts. 6 Bis y 7: al menos 80% del activo neto en los activos de la especialidad, computado diariamente respecto del activo neto del día de valuación.", "Tema 2 · Fondos de Inversión · 2.7 Especialización: al menos 80% del activo neto", null], ["fi.s2", "El porcentaje de especialización del 80% se computa:", "Diariamente, con relación al activo neto del día de valuación", ["Al cierre de cada mes", "Trimestralmente", "Al cierre del ejercicio"], "Se computa diariamente con relación al activo neto del día de valuación.", "Tema 2 · Fondos de Inversión · 2.7 Especialización: al menos 80% del activo neto", null], ["fi.s2", "¿Qué tipos de fondo pueden especializarse conforme al Anexo 1?", "Los de renta variable y los de deuda", ["Únicamente los de renta variable", "Únicamente los de deuda", "Los cuatro tipos legales"], "Un fondo de renta variable o de deuda puede especializarse en los Activos Objeto de Inversión previstos en el Anexo 1.", "Tema 2 · Fondos de Inversión · 2.7 Especialización: al menos 80% del activo neto", null], ["fi.s2", "Un fondo discrecional se caracteriza porque:", "Su estrategia no se basa en una composición dominante de un tipo específico de activo", ["Puede ignorar los límites de diversificación", "No requiere prospecto", "Sólo invierte en derivados"], "DCG art. 4 y Anexo 1: la estrategia no se basa en una composición dominante de un tipo de activo; se gestiona frente a un objetivo de rendimiento o a límites de exposición al riesgo del prospecto.", "Tema 2 · Fondos de Inversión · 2.8 Fondo discrecional: manda la estrategia", null], ["fi.s2", "La discrecionalidad de un fondo discrecional:", "No elimina límites: debe respetar activos elegibles, diversificación, liquidez, derivados, contraparte y demás parámetros regulatorios", ["Lo exime de los límites de diversificación y liquidez", "Le permite operar sin régimen de inversión", "Le permite garantizar rendimientos"], "La discrecionalidad no elimina límites: debe respetar activos elegibles, diversificación, liquidez, derivados, contraparte y los demás parámetros regulatorios.", "Tema 2 · Fondos de Inversión · 2.8 Fondo discrecional: manda la estrategia", null], ["fi.s2", "El prospecto de información de un fondo de inversión:", "Requiere autorización previa de la CNBV", ["Se registra libremente y se avisa después a la CNBV", "Lo aprueba la AMIB", "Sólo se entrega a inversionistas calificados"], "LFI art. 9: el prospecto requiere autorización previa de la CNBV y contiene la información relevante para una decisión adecuada.", "Tema 2 · Fondos de Inversión · 2.9 El prospecto: contrato informativo de la inversión", null], ["fi.s2", "Ante cambios materiales al régimen de inversión o a la recompra, el accionista:", "Puede tener derecho de salida a precio de valuación sin diferencial, en los términos aplicables", ["Debe permanecer al menos seis meses más", "Pierde su derecho de recompra", "Debe pagar una comisión por salida anticipada"], "Ante cambios materiales al régimen o a la recompra, el accionista puede tener derecho de salida a precio de valuación sin diferencial, en los términos aplicables.", "Tema 2 · Fondos de Inversión · 2.9 El prospecto: contrato informativo de la inversión", null], ["fi.s2", "¿Cuál de estos apartados exige expresamente la LFI en el prospecto?", "El método de valuación de sus acciones", ["El currículum del gestor de cartera", "La lista de clientes del fondo", "El dictamen fiscal del ejercicio anterior"], "LFI art. 9 frs. IV–VII: políticas detalladas con límites por instrumento, advertencia de riesgos, método de valuación de las acciones y, en fondos abiertos, políticas de recompra.", "Tema 2 · Fondos de Inversión · 2.10 Contenido del prospecto", null], ["fi.s2", "Las políticas para la recompra de acciones deben incluirse en el prospecto de:", "Los fondos de inversión abiertos", ["Todos los fondos sin excepción", "Sólo los fondos de capitales", "Sólo los fondos que cotizan en bolsa"], "LFI art. 9 fr. VII: para los fondos de inversión abiertos, el prospecto debe contener las políticas para la recompra de las acciones.", "Tema 2 · Fondos de Inversión · 2.10 Contenido del prospecto", null], ["fi.s2", "Al describir el objeto del fondo, si se usan bases de referencia se debe señalar:", "Su composición y la fuente donde se puede consultar públicamente", ["Únicamente su nombre comercial", "El rendimiento que garantizan", "La calificación de la base"], "Debe indicarse si están relacionadas a modelos financieros, índices, tasas de interés o tipo de cambio, siempre que se señale su composición y la fuente donde se puede consultar públicamente.", "Tema 2 · Fondos de Inversión · 2.11 Objeto del fondo en el prospecto", null], ["fi.s2", "El horizonte de inversión que revela el prospecto es:", "El plazo en días, meses o años que se estima adecuado para que el inversionista mantenga su inversión", ["El plazo legal de vigencia del fondo", "El plazo máximo de liquidación", "La duración de la cartera"], "Debe revelarse el plazo en días, meses o años que se estima o considera adecuado para que el inversionista mantenga su inversión, considerando los objetivos de la sociedad.", "Tema 2 · Fondos de Inversión · 2.12 Horizonte de inversión y tipo de inversionista", null], ["fi.s2", "Respecto del tipo de inversionista, el prospecto debe señalar si el fondo está orientado a inversionistas:", "Pequeños, medianos o grandes, y si buscan riesgo alto, medio o bajo", ["Residentes o no residentes únicamente", "Personas físicas o morales", "Sofisticados o no sofisticados"], "Debe señalar si está orientado a inversionistas pequeños, medianos o grandes —considerando montos mínimos y nivel de complejidad o sofisticación— y si se dirige a quienes buscan riesgo alto, medio o bajo.", "Tema 2 · Fondos de Inversión · 2.12 Horizonte de inversión y tipo de inversionista", null], ["fi.s2", "Una administración activa de la cartera busca:", "Aprovechar oportunidades de mercado para incrementar el rendimiento esperado y superar su base de referencia", ["Un rendimiento similar al de su base de referencia sin riesgos adicionales", "Replicar exactamente un índice", "Mantener la cartera sin cambios"], "La administración activa toma riesgos buscando aprovechar oportunidades de mercado para tratar de incrementar su rendimiento esperado y superar su base de referencia. La pasiva o conservadora busca un rendimiento similar a la referencia.", "Tema 2 · Fondos de Inversión · 2.13 Política de inversión I: activa o pasiva", null], ["fi.s2", "El prospecto debe señalar si el fondo invertirá en activos emitidos por sociedades del mismo grupo empresarial de su operadora:", "Sí, indicando además en qué proporción", ["No, esa información es confidencial", "Sólo si supera el 50% de la cartera", "Sólo a solicitud de la CNBV"], "Debe mencionarse si el fondo invertirá, y en qué proporción, en activos emitidos por sociedades del mismo consorcio o grupo empresarial al que pertenezca su sociedad operadora.", "Tema 2 · Fondos de Inversión · 2.13 Política de inversión I: activa o pasiva", null], ["fi.s2", "Tratándose de valores representativos de deuda, la política de inversión debe revelar:", "La duración de la cartera en su conjunto, si es de corto, mediano o largo plazo, el tipo de emisor y su calificación de riesgo de crédito", ["Sólo el plazo del instrumento más largo", "Únicamente la calificación del fondo", "El rendimiento histórico por instrumento"], "Debe revelarse la duración de la cartera en su conjunto —corto, mediano o largo plazo—, si los valores son gubernamentales, estatales, municipales, bancarios o corporativos o una mezcla, incluyendo su calificación de riesgo de crédito.", "Tema 2 · Fondos de Inversión · 2.14 Política de inversión II: deuda, indizados y cobertura", null], ["fi.s2", "En fondos indizados o de cobertura, la política de inversión debe indicar:", "Las distintas alternativas o instrumentos que se utilizarán", ["El rendimiento objetivo garantizado", "El nombre del proveedor de precios", "La comisión máxima del administrador"], "Tratándose de fondos indizados o de cobertura, deben indicarse las distintas alternativas o instrumentos que se utilizarán.", "Tema 2 · Fondos de Inversión · 2.14 Política de inversión II: deuda, indizados y cobertura", null], ["fi.s2", "El régimen de inversión del prospecto debe presentarse:", "En una tabla con los parámetros de inversión, tipos de valor y porcentajes respecto del activo total, capital social del emisor, de la emisión o serie", ["En texto libre, sin formato específico", "Sólo en la información mensual de costos", "Únicamente ante la CNBV"], "Debe incluirse en una tabla que indique los parámetros de inversión determinados por el fondo, incluyendo préstamo de valores y derivados, señalando tipos de valor y porcentaje respecto del activo total, capital social del emisor, de la emisión o serie.", "Tema 2 · Fondos de Inversión · 2.15 Régimen de inversión y riesgos en el prospecto", null], ["fi.s2", "La advertencia de riesgos del prospecto debe considerar:", "Las inversiones, liquidez, adquisición, selección y, en su caso, diversificación o especialización de activos", ["Sólo el riesgo de mercado", "Únicamente el riesgo de crédito de los emisores", "Sólo los riesgos no cuantificables"], "LFI art. 9 fr. V: la advertencia debe tomar en cuenta las inversiones, liquidez, adquisición, selección y, en su caso, diversificación o especialización de activos.", "Tema 2 · Fondos de Inversión · 2.15 Régimen de inversión y riesgos en el prospecto", null], ["fi.s2", "El rendimiento histórico del fondo se calcula con la metodología establecida por:", "El organismo autorregulatorio autorizado por la CNBV", ["La propia sociedad operadora", "El proveedor de precios", "La calificadora del fondo"], "La información sobre rendimientos se calcula con base en la metodología establecida por el organismo autorregulatorio autorizado por la CNBV.", "Tema 2 · Fondos de Inversión · 2.16 Rendimientos en el prospecto", null], ["fi.s2", "Si el fondo no cuenta con la información de rendimientos requerida, se usa la histórica disponible desde el inicio de operaciones siempre que sea superior a:", "Seis meses", ["Tres meses", "Un año", "Dos años"], "Se utiliza la información histórica disponible a partir de la fecha de inicio de operaciones del fondo, siempre que ésta sea superior a seis meses.", "Tema 2 · Fondos de Inversión · 2.16 Rendimientos en el prospecto", null], ["fi.s2", "Si el fondo sufrió una transformación que cambió significativamente su régimen de inversión, la información de rendimientos:", "Inicia a partir de que surta efectos dicho cambio", ["Se mantiene desde el inicio de operaciones original", "Se elimina definitivamente", "Se presenta sólo para la serie más antigua"], "La información de rendimientos inicia a partir de que surta efectos el cambio, y aplica a todas las series accionarias con las que cuente el fondo.", "Tema 2 · Fondos de Inversión · 2.16 Rendimientos en el prospecto", null], ["fi.s2", "Respecto de los límites máximos de tenencia accionaria, el prospecto debe señalar:", "Los límites por inversionista y las acciones a seguir en caso de incumplirlos", ["Sólo el porcentaje máximo", "Únicamente las políticas del consejo", "El número de accionistas del fondo"], "Deben señalarse los límites de tenencia accionaria máxima por inversionista, las acciones a seguir en caso de incumplirlos y, en su caso, las políticas establecidas por el consejo de administración.", "Tema 2 · Fondos de Inversión · 2.17 Límites de tenencia y operación del fondo", null], ["fi.s2", "Ante cambios en el régimen de inversión o de recompra, el fondo está obligado a:", "Adquirir el 100% de las acciones de los inversionistas, en los plazos especificados", ["Suspender operaciones seis meses", "Cobrar una comisión por permanencia", "Modificar su denominación"], "Las políticas de recompra deben mencionar la obligación de la sociedad de adquirir el 100% de las acciones de los inversionistas con motivo de cambios en el régimen de inversión o de recompra, especificando los plazos.", "Tema 2 · Fondos de Inversión · 2.18 Políticas de recompra", null], ["fi.s2", "Las políticas de recompra deben especificar:", "El procedimiento de recepción y asignación de órdenes, los términos para hacer líquida la participación y los límites de recompra", ["Sólo el precio de recompra", "Únicamente el horario de operación", "La comisión del distribuidor"], "Deben mencionar los términos y condiciones de la compraventa, el procedimiento de recepción y asignación de órdenes, los términos para hacer líquida la totalidad de la participación y los límites de recompra.", "Tema 2 · Fondos de Inversión · 2.18 Políticas de recompra", null], ["fi.s2", "En el apartado de administración, el prospecto debe identificar:", "El consejo de administración de la sociedad operadora que administra al fondo", ["El consejo de administración propio del fondo", "El consejo de la distribuidora", "El comisario del fondo"], "El fondo no tiene consejo propio: el prospecto debe identificar el consejo de administración de la sociedad operadora que lo administra, con número de consejeros propietarios y suplentes, su carácter independiente y su perfil profesional.", "Tema 2 · Fondos de Inversión · 2.19 Administración: el consejo de la operadora en el prospecto", null], ["fi.s2", "Sobre los consejeros de la operadora, el prospecto debe revelar:", "Número de propietarios y suplentes, su carácter independiente o no independiente y su perfil profesional", ["Sólo sus nombres", "Su remuneración individual", "Su participación accionaria en el fondo"], "Debe revelarse el número de consejeros propietarios y suplentes, su carácter independiente o no independiente y su perfil profesional.", "Tema 2 · Fondos de Inversión · 2.19 Administración: el consejo de la operadora en el prospecto", null], ["fi.s2", "El prospecto debe mencionar que las acciones de la parte fija del capital:", "Son de una sola clase, sin derecho a retiro, y su transmisión requiere autorización previa de la CNBV", ["Son de varias clases y con derecho a retiro", "Se colocan libremente entre el público", "Son las únicas con derecho a dividendos"], "Debe mencionarse que las acciones de la parte fija son de una sola clase, sin derecho a retiro, y que su transmisión requiere autorización previa de la CNBV.", "Tema 2 · Fondos de Inversión · 2.20 Estructura de capital y derechos corporativos", null], ["fi.s2", "Al ejercer derechos corporativos de los valores de la cartera, el consejo debe:", "Maximizar en todo momento el valor de los activos del fondo y representar de la mejor manera posible a sus accionistas", ["Abstenerse siempre de votar", "Votar conforme a las instrucciones de la distribuidora", "Seguir el criterio del proveedor de precios"], "El prospecto debe revelar los criterios para el ejercicio de derechos corporativos y asistencia a asambleas, señalando la obligación de maximizar el valor de los activos del fondo y representar de la mejor manera posible a sus accionistas.", "Tema 2 · Fondos de Inversión · 2.20 Estructura de capital y derechos corporativos", null], ["fi.s2", "El apartado de régimen fiscal del prospecto debe incluir el régimen aplicable a:", "El fondo en general, la serie accionaria y tipo de accionista en particular, y los inversionistas no residentes", ["Sólo al fondo en general", "Únicamente a personas morales", "Sólo a operaciones derivadas"], "LFI art. 9-X: el régimen fiscal aplicable al fondo en general, a la serie accionaria y tipo de accionista en lo particular, a los no residentes y, en su caso, a valores extranjeros, derivados y préstamo de valores.", "Tema 2 · Fondos de Inversión · 2.21 Régimen fiscal en el prospecto", null], ["fi.s2", "La comisión por incumplimiento del saldo mínimo de inversión:", "No procede si la insuficiencia deriva de una baja en el precio", ["Procede en todos los casos de insuficiencia", "Sólo procede para inversionistas institucionales", "Está prohibida"], "DCG arts. 106-I–II: la comisión por incumplimiento del saldo mínimo no procede si la insuficiencia deriva de una baja en el precio. Es un dato que se pregunta con frecuencia.", "Tema 2 · Fondos de Inversión · 2.22 Comisiones a cargo del cliente", null], ["fi.s2", "¿Cuál de estas comisiones puede quedar a cargo del titular?", "La comisión por incumplimiento del plazo mínimo de permanencia", ["La comisión por valuación de las acciones del fondo", "La comisión por auditoría externa del fondo", "La comisión por proveeduría de precios"], "A cargo del cliente: incumplimiento del plazo mínimo de permanencia, incumplimiento del saldo mínimo, adquisición o enajenación de acciones, depósito/administración/custodia y otros servicios pactados. Valuación, auditoría y precios los paga el fondo.", "Tema 2 · Fondos de Inversión · 2.22 Comisiones a cargo del cliente", null], ["fi.s2", "Para cobrar al cliente 'otros servicios permitidos' se requiere que:", "El concepto y monto consten en el contrato y cumplan las disposiciones aplicables", ["Lo apruebe el contralor normativo", "Se informe sólo en el estado de cuenta", "Lo autorice la CNBV caso por caso"], "Sólo pueden cobrarse si concepto y monto constan en el contrato y cumplen las disposiciones aplicables; el prospecto debe explicar concepto, cálculo, periodicidad y aviso previo de cambios.", "Tema 2 · Fondos de Inversión · 2.22 Comisiones a cargo del cliente", null], ["fi.s2", "¿Cuál de los siguientes es un servicio cuya remuneración paga el fondo?", "La valuación de acciones, la calificación del fondo y la proveeduría de precios", ["El incumplimiento del plazo mínimo de permanencia", "La adquisición de acciones por el cliente", "El saldo mínimo de inversión"], "DCG art. 106-III: el fondo paga administración de activos, desempeño, distribución, valuación, calificación, proveeduría de precios, contabilidad, depósito y custodia, servicios administrativos, divulgación, auditoría externa y asesoría.", "Tema 2 · Fondos de Inversión · 2.23 Comisiones que paga el fondo por los servicios que usa", null], ["fi.s2", "Las comisiones que el fondo paga a sus proveedores deben:", "Sujetarse a equidad y transparencia y revelarse en el prospecto y en la información mensual de costos", ["Mantenerse confidenciales", "Aprobarse por la asamblea de accionistas del fondo", "Fijarse por la CNBV"], "Deben sujetarse a equidad y transparencia y revelarse en el prospecto y en la información mensual de costos.", "Tema 2 · Fondos de Inversión · 2.23 Comisiones que paga el fondo por los servicios que usa", null], ["fi.s2", "El plazo de liquidación de las operaciones con acciones de fondos no puede exceder:", "Diez días hábiles desde la operación", ["Dos días hábiles", "Cinco días hábiles", "Un mes"], "DCG art. 40: el plazo no puede ser superior a diez días hábiles desde la operación, salvo suspensión de negociación conforme a la Ley.", "Tema 2 · Fondos de Inversión · 2.24 Liquidación: plazo máximo de diez días hábiles", null], ["fi.s2", "Los fondos de deuda que operan el mismo día liquidan:", "Al precio determinado el día hábil previo y registrado el día de la operación", ["Al precio del día de la operación publicado el día hábil siguiente", "Al precio promedio del mes", "Al precio de cierre del ejercicio"], "Los fondos de deuda que operan el mismo día liquidan al precio determinado el día hábil previo y registrado el día de la operación. Los de otros plazos, al precio del día de la operación publicado el día hábil siguiente.", "Tema 2 · Fondos de Inversión · 2.24 Liquidación: plazo máximo de diez días hábiles", null], ["fi.s2", "El plazo de liquidación que fije el prospecto debe ser acorde con:", "Las condiciones operativas de los activos preponderantes de la cartera", ["La preferencia comercial de la distribuidora", "El horizonte de inversión del cliente", "La calificación del fondo"], "El prospecto debe fijar plazos acordes con las condiciones operativas de los activos preponderantes, y el inversionista debe distinguir recepción de orden, ejecución, determinación del precio y liquidación.", "Tema 2 · Fondos de Inversión · 2.24 Liquidación: plazo máximo de diez días hábiles", null], ["fi.s2", "Para usar expresiones como 'sustentable', 'ASG' o 'ESG', el fondo debe mantener al menos:", "80% del activo neto en activos ASG", ["51% del activo neto en activos ASG", "70% del activo neto en activos ASG", "100% del activo neto en activos ASG"], "Reforma vigente desde el 08-08-2026: al menos 80% del activo neto en Activos Objeto de Inversión ASG para usar esas expresiones en denominación, clave, publicidad o propaganda.", "Tema 2 · Fondos de Inversión · 2.25 Fondos ASG/ESG: especialización regulada desde agosto de 2026", null], ["fi.s2", "¿Cuál de estos criterios NO sirve para acreditar que un activo es ASG?", "La declaración unilateral de la sociedad operadora", ["La Taxonomía Sostenible de México", "Una taxonomía extranjera elegible", "Una calificación ASG independiente o un etiquetado sostenible reconocido"], "Un activo ASG debe cumplir al menos uno de estos criterios: Taxonomía Sostenible de México, taxonomía extranjera elegible, calificación ASG independiente o etiquetado sostenible reconocido.", "Tema 2 · Fondos de Inversión · 2.25 Fondos ASG/ESG: especialización regulada desde agosto de 2026", null], ["fi.s2", "Dentro de la clasificación de riesgos, los riesgos ASG son:", "Riesgos cuantificables NO discrecionales", ["Riesgos no cuantificables", "Riesgos cuantificables discrecionales", "No están clasificados en las Disposiciones"], "Es una trampa habitual: los riesgos ASG son riesgos cuantificables NO discrecionales (DCG art. 119-I-b-4), junto con el operativo, tecnológico y legal.", "Tema 2 · Fondos de Inversión · 2.25 Fondos ASG/ESG: especialización regulada desde agosto de 2026", null], ["fi.s3", "Para organizarse y funcionar como sociedad operadora de fondos de inversión se requiere:", "Autorización de la CNBV", ["Registro ante la AMIB", "Concesión de la Secretaría de Hacienda", "Aviso a Banco de México"], "LFI art. 33: se requiere autorización de la CNBV. Todo fondo debe ser administrado por una sociedad operadora autorizada.", "Tema 2 · Fondos de Inversión · 3.1 Administradoras de activos: la operadora es indispensable", null], ["fi.s3", "Entre las funciones de la operadora está el manejo de carteras de valores:", "En favor de fondos de inversión y de terceros", ["Únicamente en favor de los fondos que administra", "Sólo en favor de inversionistas institucionales", "No puede manejar carteras de terceros"], "LFI art. 39: la operadora realiza las operaciones permitidas a los fondos a nombre y por cuenta del fondo, y maneja carteras de valores en favor de fondos de inversión y de terceros.", "Tema 2 · Fondos de Inversión · 3.1 Administradoras de activos: la operadora es indispensable", null], ["fi.s3", "La calificación de un fondo de inversión debe obtenerse:", "Cuando lo determine la CNBV, de una institución calificadora de valores autorizada", ["Siempre, en todos los casos", "Sólo si el fondo cotiza en bolsa", "Sólo a solicitud de un inversionista"], "LFI arts. 17 y 48: cuando lo determine la CNBV, el fondo debe obtener una calificación emitida por una institución calificadora de valores autorizada.", "Tema 2 · Fondos de Inversión · 3.2 Calificadoras", null], ["fi.s3", "La calificación de un fondo refleja:", "Los riesgos de los activos y operaciones, así como la calidad de la administración del fondo", ["Únicamente la calidad crediticia de los emisores de la cartera", "El rendimiento esperado para los próximos doce meses", "La solvencia de la sociedad operadora"], "Refleja los riesgos de los activos y operaciones y la calidad de la administración del fondo. Es una opinión de apoyo: no garantiza pago, liquidez ni rendimiento futuro.", "Tema 2 · Fondos de Inversión · 3.2 Calificadoras", null], ["fi.s3", "La periodicidad, términos de difusión y categorías de la calificación los determina:", "La CNBV mediante disposiciones generales", ["La propia calificadora", "El consejo de la operadora", "El organismo autorregulatorio"], "La Comisión determina periodicidad, términos de difusión y categorías aplicables mediante disposiciones de carácter general.", "Tema 2 · Fondos de Inversión · 3.2 Calificadoras", null], ["fi.s3", "Los proveedores de precios:", "Calculan, determinan y suministran precios actualizados para valuar valores, documentos e instrumentos financieros", ["Determinan el precio por acción del fondo", "Custodian los valores de la cartera", "Califican la calidad crediticia del fondo"], "El proveedor de precios suministra los precios actualizados; la VALUADORA es quien determina el precio por acción a partir de ellos. No confundir las dos funciones.", "Tema 2 · Fondos de Inversión · 3.3 Proveedores de precios", null], ["fi.s3", "La contratación del proveedor de precios para los fondos administrados la aprueba:", "El consejo de administración de la operadora", ["La asamblea de accionistas del fondo", "La distribuidora", "El contralor normativo"], "El consejo de administración de la operadora aprueba la contratación de prestadores de servicios, incluido el proveedor de precios. La operadora y el fondo deben notificar a la CNBV.", "Tema 2 · Fondos de Inversión · 3.3 Proveedores de precios", null], ["fi.s3", "Los precios suministrados por el proveedor se reconocen en la contabilidad del fondo:", "A valor razonable", ["A costo histórico", "Al valor nominal del instrumento", "Al precio de adquisición ajustado por inflación"], "El fondo reconoce los precios actualizados en contabilidad a valor razonable.", "Tema 2 · Fondos de Inversión · 3.3 Proveedores de precios", null], ["fi.s3", "¿Quién calcula el precio por acción del fondo?", "La valuadora", ["El proveedor de precios", "La operadora", "La distribuidora integral"], "LFI arts. 44–47: la valuadora valúa diariamente los activos con precios de un proveedor de precios y calcula el precio por acción.", "Tema 2 · Fondos de Inversión · 3.4 Valuadora: convierte la cartera neta en precio por acción", null], ["fi.s3", "La valuadora proporciona el precio a:", "La CNBV, la operadora, los distribuidores y los mecanismos de divulgación aplicables", ["Únicamente a la CNBV", "Sólo a la sociedad operadora", "Sólo a los accionistas del capital fijo"], "Proporciona el precio a la CNBV, a la operadora, a distribuidores y a los mecanismos de divulgación aplicables.", "Tema 2 · Fondos de Inversión · 3.4 Valuadora: convierte la cartera neta en precio por acción", null], ["fi.s3", "Los valores inscritos en el Registro Nacional que integran el activo del fondo deben depositarse en:", "Una cuenta individual del fondo en una institución para el depósito de valores concesionada", ["La bóveda de la sociedad operadora", "Una cuenta global de la distribuidora", "Un fideicomiso de garantía"], "LFI arts. 16 y 51: deben depositarse en una cuenta individual del fondo en una institución para el depósito de valores concesionada.", "Tema 2 · Fondos de Inversión · 3.5 Depósito y custodia", null], ["fi.s3", "El custodio de los activos del fondo:", "Ejecuta guarda, traspasos y liquidación conforme a la Ley, las Disposiciones y el prospecto, sin decidir la política de inversión", ["Decide la política de inversión junto con la operadora", "Calcula el precio por acción", "Aprueba el régimen de inversión"], "El custodio ejecuta guarda, traspasos y liquidación; NO decide la política de inversión. Es una distinción de funciones que se pregunta.", "Tema 2 · Fondos de Inversión · 3.5 Depósito y custodia", null], ["fi.s3", "La sociedad operadora administra al fondo con el carácter de:", "Apoderado general, sujeta al prospecto y obligada a salvaguardar los intereses de los accionistas", ["Mandatario especial para cada operación", "Fiduciario del patrimonio", "Comisionista mercantil"], "LFI art. 39: administra como apoderado general, sujeta al prospecto y obligada a salvaguardar los intereses de los accionistas.", "Tema 2 · Fondos de Inversión · 3.6 Sociedad operadora: funciones y deberes", null], ["fi.s3", "Las operaciones del fondo que lo requieran se realizan con intermediación de:", "Casas de bolsa o instituciones de crédito", ["La propia operadora", "La institución para el depósito de valores", "El proveedor de precios"], "Las operaciones que lo requieran se realizan con intermediación de casas de bolsa o instituciones de crédito.", "Tema 2 · Fondos de Inversión · 3.6 Sociedad operadora: funciones y deberes", null], ["fi.s3", "Antes de celebrar una operación, la operadora debe:", "Verificar previamente el régimen de inversión", ["Consultar a la distribuidora", "Obtener autorización de la CNBV", "Solicitar opinión de la calificadora"], "La operadora celebra operaciones autorizadas, verifica previamente el régimen de inversión y actúa en interés del fondo.", "Tema 2 · Fondos de Inversión · 3.6 Sociedad operadora: funciones y deberes", null], ["fi.s3", "Una sociedad operadora limitada de fondos de inversión:", "Presta exclusivamente los servicios administrativos del artículo 39, fracción IV", ["Administra la cartera con límites reducidos", "Sólo puede administrar fondos de deuda", "Distribuye acciones sin promoverlas"], "LFI art. 39 fr. IV: está autorizada para prestar exclusivamente los servicios administrativos de esa fracción. No administra cartera, no decide inversiones y no distribuye acciones.", "Tema 2 · Fondos de Inversión · 3.7 Operadora limitada: sólo servicios administrativos", null], ["fi.s3", "La operadora limitada NO puede:", "Recibir recursos derivados de servicios de administración de activos ni de distribución", ["Incluir 'limitada' en su denominación", "Prestar servicios administrativos", "Ser autorizada por la CNBV"], "No puede recibir recursos derivados de servicios de administración de activos ni de distribución, y debe incluir en su denominación 'sociedad operadora limitada de fondos de inversión'.", "Tema 2 · Fondos de Inversión · 3.7 Operadora limitada: sólo servicios administrativos", null], ["fi.s3", "El consejo de administración de una sociedad operadora se integra por:", "Un mínimo de cinco y un máximo de quince consejeros", ["Un mínimo de tres y un máximo de diez consejeros", "Un mínimo de siete y un máximo de veinte consejeros", "El número que libremente determinen los estatutos"], "LFI art. 34 Bis: mínimo de cinco y máximo de quince consejeros.", "Tema 2 · Fondos de Inversión · 3.8 Consejo de administración de la operadora", null], ["fi.s3", "El porcentaje mínimo de consejeros independientes en el consejo de la operadora es:", "40%", ["25%", "33%", "50%"], "LFI art. 34 Bis: al menos el cuarenta por ciento de consejeros independientes.", "Tema 2 · Fondos de Inversión · 3.8 Consejo de administración de la operadora", null], ["fi.s3", "El capital mínimo de una operadora de fondos de renta variable y deuda es:", "2,400,000 UDI", ["200,000 UDI", "1,000,000 de pesos", "30,000 UDI"], "DCG arts. 28–30: 2,400,000 UDI para operadoras de fondos de renta variable y deuda; 200,000 UDI si son exclusivas de fondos de capitales.", "Tema 2 · Fondos de Inversión · 3.9 Capital mínimo de las sociedades operadoras", null], ["fi.s3", "Para una operadora perteneciente a un grupo financiero que administra fondos de renta variable y deuda, el capital mínimo es:", "200,000 UDI", ["2,400,000 UDI", "30,000 UDI", "No requiere capital mínimo"], "Excepción para operadoras de grupo financiero: 200,000 UDI para renta variable y deuda, y 30,000 UDI para capitales.", "Tema 2 · Fondos de Inversión · 3.9 Capital mínimo de las sociedades operadoras", null], ["fi.s3", "El incumplimiento del capital mínimo de una operadora debe restituirse en un plazo máximo de:", "Seis meses", ["Treinta días", "Tres meses", "Un año"], "El incumplimiento debe restituirse en un plazo máximo de seis meses. La equivalencia en pesos usa el valor de la UDI al último día del mes.", "Tema 2 · Fondos de Inversión · 3.9 Capital mínimo de las sociedades operadoras", null], ["fi.s3", "El capital mínimo de la operadora debe estar:", "Íntegramente suscrito y pagado en efectivo, y el capital contable no puede ser inferior al mínimo pagado", ["Suscrito, aunque se pague en parcialidades", "Pagado en efectivo o en especie", "Garantizado con valores gubernamentales"], "Debe estar íntegramente suscrito y pagado en efectivo; el capital contable no puede ser inferior al mínimo pagado.", "Tema 2 · Fondos de Inversión · 3.9 Capital mínimo de las sociedades operadoras", null], ["fi.s3", "El contralor normativo de la operadora puede asistir a las sesiones del consejo:", "Con voz y sin voto", ["Con voz y voto", "Sin voz ni voto, sólo como observador", "No puede asistir"], "LFI art. 34 Bis 1: podrá asistir a las sesiones del consejo con voz y sin voto.", "Tema 2 · Fondos de Inversión · 3.10 Contralor normativo de la operadora", null], ["fi.s3", "¿Cuál de estas funciones corresponde al contralor normativo?", "Establecer procedimientos para asegurar el cumplimiento de la normatividad y la observancia del prospecto", ["Determinar el precio por acción del fondo", "Aprobar el régimen de inversión", "Custodiar los valores de la cartera"], "Establece procedimientos de cumplimiento normativo y de observancia del prospecto, propone medidas contra conflictos de interés, recibe informes del comisario y dictámenes de auditores externos, y documenta e informa irregularidades al consejo.", "Tema 2 · Fondos de Inversión · 3.10 Contralor normativo de la operadora", null], ["fi.s3", "El contralor normativo recibe:", "Los informes del comisario y los dictámenes de los auditores externos", ["Las instrucciones de inversión de los clientes", "Los precios del proveedor de precios", "Las órdenes de compraventa de la distribuidora"], "Entre sus funciones está recibir informes del comisario y los dictámenes de los auditores externos.", "Tema 2 · Fondos de Inversión · 3.10 Contralor normativo de la operadora", null], ["fi.s3", "El contralor normativo, el director general y los funcionarios de jerarquía inmediata inferior NO pueden ocupar otro cargo en:", "Controladoras de grupos financieros, bancos, casas de bolsa, seguros, fianzas, organizaciones auxiliares, casas de cambio y sofomes reguladas", ["Cualquier sociedad mercantil", "Únicamente en casas de bolsa", "Sólo en otras operadoras de fondos"], "LFI art. 34 Bis 4 enumera esas entidades. La única excepción es que el contralor de una operadora puede ser también contralor del banco o casa de bolsa del mismo grupo financiero.", "Tema 2 · Fondos de Inversión · 3.11 Incompatibilidades del contralor y de los directivos", null], ["fi.s3", "La única excepción a las incompatibilidades del contralor normativo es:", "Puede ser contralor de la institución de crédito o casa de bolsa del mismo grupo financiero", ["Puede ser consejero de cualquier emisora", "Puede dirigir una distribuidora referenciadora", "Puede ser comisario del fondo"], "La excepción expresa: el contralor de una operadora puede ser también contralor de la institución de crédito o casa de bolsa del mismo grupo financiero.", "Tema 2 · Fondos de Inversión · 3.11 Incompatibilidades del contralor y de los directivos", null], ["fi.s3", "El servicio de distribución de acciones de fondos comprende:", "La promoción y asesoría a terceros e instruir la compra y venta por cuenta y orden del fondo o del cliente", ["Únicamente la promoción", "Sólo la custodia de las acciones", "La valuación y el cálculo del precio"], "LFI art. 40: comprende la promoción y asesoría a terceros e instruir la compra y venta de las acciones por cuenta y orden del fondo o del cliente.", "Tema 2 · Fondos de Inversión · 3.12 Sociedad distribuidora: en qué consiste el servicio", null], ["fi.s3", "El servicio de distribución puede proporcionarse por:", "Operadoras y distribuidoras de fondos de inversión", ["Únicamente sociedades distribuidoras", "Sólo instituciones de crédito", "Sólo casas de bolsa"], "El servicio de distribución podrá proporcionarse por operadoras y distribuidoras de fondos de inversión, además de las entidades del quinto párrafo del art. 40.", "Tema 2 · Fondos de Inversión · 3.12 Sociedad distribuidora: en qué consiste el servicio", null], ["fi.s3", "La diferencia crítica entre una distribuidora integral y una referenciadora es que la referenciadora:", "No puede recibir recursos de terceros; la liquidación se hace por una integral o entidad facultada", ["No puede promover las acciones del fondo", "No puede transmitir órdenes", "No requiere autorización de la CNBV"], "La referenciadora sólo puede realizar las fracciones I y VI del art. 40 Bis: transmite órdenes por cuenta y orden de terceros y realiza actividades análogas autorizadas, pero NO puede recibir recursos de terceros.", "Tema 2 · Fondos de Inversión · 3.13 Distribuidora integral y distribuidora referenciadora", null], ["fi.s3", "¿Cuál de estas actividades corresponde exclusivamente a la distribuidora integral?", "Solicitar, recibir y transferir recursos para la liquidación y elaborar estados de cuenta", ["Transmitir órdenes de compra y venta", "Realizar actividades análogas autorizadas por la CNBV", "Entregar informe de transacciones"], "La integral puede realizar todas las actividades del art. 40 Bis: transmitir órdenes, manejar recursos para liquidación, elaborar estados de cuenta, operar en mercados del exterior, actuar como comisionista y prestar depósito y custodia.", "Tema 2 · Fondos de Inversión · 3.13 Distribuidora integral y distribuidora referenciadora", null], ["fi.s3", "Una distribuidora referenciadora debe entregar al cliente:", "Informe de transacciones", ["Estado de cuenta mensual", "El prospecto autorizado de cada fondo", "La calificación del fondo"], "La referenciadora debe entregar informe de transacciones; los estados de cuenta corresponden a la distribuidora integral o a la entidad facultada que liquida.", "Tema 2 · Fondos de Inversión · 3.13 Distribuidora integral y distribuidora referenciadora", null], ["fi.s3", "¿Cuál de las siguientes entidades PUEDE proporcionar servicios de distribución de acciones de fondos?", "Las uniones de crédito y las sociedades financieras populares", ["Las sociedades de inversión especializadas en fondos para el retiro", "Las instituciones calificadoras de valores", "Los proveedores de precios"], "LFI art. 40, quinto párrafo: bancos, casas de bolsa, seguros, organizaciones auxiliares del crédito, uniones de crédito, sociedades financieras populares, cooperativas de ahorro y préstamo, sofomes reguladas y casas de cambio.", "Tema 2 · Fondos de Inversión · 3.14 Quiénes más pueden distribuir acciones de fondos", null], ["fi.s3", "Las entidades que distribuyen acciones de fondos quedan sujetas a la supervisión de:", "La CNBV", ["La CONDUSEF", "Banco de México", "La CONSAR"], "Quedan en todo caso sujetas a la supervisión de la CNBV.", "Tema 2 · Fondos de Inversión · 3.14 Quiénes más pueden distribuir acciones de fondos", null], ["fi.s4", "La fórmula de la tasa nominal anual del rendimiento de un fondo es:", "(Precio final / Precio inicial − 1) × (360 / días) × 100", ["(Precio final − Precio inicial) × días / 360", "(Precio final / Precio inicial) × (días / 365) × 100", "(Precio final − Precio inicial) / Precio final × 100"], "TNOM = (Precio final / Precio inicial − 1) × (360 / días transcurridos) × 100. Se usa base 360 y se divide entre el precio INICIAL.", "Tema 2 · Fondos de Inversión · 4.1 Cálculo del rendimiento: tasa nominal anual", null], ["fi.s4", "Un inversionista entra a $5.428694 y sale a $5.748441 tras 304 días. ¿Cuál es la tasa nominal anual?", "6.97%", ["5.89%", "7.07%", "6.59%"], "Rendimiento del periodo = 5.748441/5.428694 − 1 = 5.8898%. Anualizado: 5.8898% × 360/304 = 6.97%. El 5.89% es olvidar anualizar y el 7.07% es usar base 365.", "Tema 2 · Fondos de Inversión · 4.1 Cálculo del rendimiento: tasa nominal anual", null], ["fi.s4", "En el cálculo de la tasa nominal del rendimiento, el monto invertido:", "No entra en la fórmula de la tasa: sólo sirve para calcular acciones y valor final de la posición", ["Se multiplica por el número de días", "Se divide entre el precio final", "Determina la base de días a utilizar"], "La tasa se calcula con los precios por acción. El monto invertido sólo sirve para saber cuántas acciones se compraron y cuánto vale la posición al final.", "Tema 2 · Fondos de Inversión · 4.1 Cálculo del rendimiento: tasa nominal anual", null], ["fi.s4", "Si al calcular el rendimiento anualizado se usa 365 días en lugar de 360, el resultado:", "Queda sobreestimado", ["No cambia", "Queda subestimado", "Se vuelve negativo"], "Multiplicar por 365/días en lugar de 360/días arroja un factor de anualización mayor y sobreestima la tasa. En el ejercicio de la guía daría 7.07% en lugar de 6.97%.", "Tema 2 · Fondos de Inversión · 4.1 Cálculo del rendimiento: tasa nominal anual", null], ["fi.s4", "El precio por acción de un fondo se obtiene de:", "(Activos valuados − pasivos) / acciones en circulación", ["Activos totales / acciones emitidas", "Activos valuados / capital social", "(Activos − comisiones) / capital fijo"], "Precio por acción = (activos valuados − pasivos) / acciones en circulación, ajustado por los derechos y costos de cada serie.", "Tema 2 · Fondos de Inversión · 4.2 Valuación diaria", null], ["fi.s4", "Para fondos de renta variable y deuda, el precio actualizado se determina:", "Diariamente", ["Semanalmente", "Al cierre de cada mes", "Cada vez que hay una operación"], "Para renta variable y deuda, el precio actualizado se determina diariamente.", "Tema 2 · Fondos de Inversión · 4.2 Valuación diaria", null], ["fi.s4", "La valuación diaria permite:", "Asignar de manera equitativa entradas, salidas, utilidades, pérdidas y gastos entre inversionistas", ["Garantizar la liquidez de la inversión", "Eliminar los movimientos de mercado", "Fijar un rendimiento mínimo"], "Permite la asignación equitativa entre inversionistas, pero no elimina movimientos de mercado ni garantiza liquidez.", "Tema 2 · Fondos de Inversión · 4.2 Valuación diaria", null], ["fi.s4", "El precio actualizado del fondo se da a conocer:", "En las páginas de la operadora y la distribuidora, o mediante bolsas y mecanismos electrónicos autorizados", ["Sólo a los accionistas registrados", "Únicamente en el Diario Oficial", "Sólo en el estado de cuenta mensual"], "LFI art. 45 y DCG art. 41: se publica en las páginas de la operadora y la distribuidora, o mediante bolsas y mecanismos electrónicos autorizados, junto con el precio con diferencial en su caso.", "Tema 2 · Fondos de Inversión · 4.3 Publicación diaria del precio", null], ["fi.s4", "El precio publicado puede variar entre series del mismo fondo porque:", "Difieren sus derechos económicos, costos y comisiones", ["Cada serie tiene una cartera distinta", "Se valúan en días distintos", "Cada serie tiene su propio proveedor de precios"], "El precio publicado puede variar entre series por sus derechos económicos, costos y comisiones, aunque la cartera del fondo sea la misma.", "Tema 2 · Fondos de Inversión · 4.3 Publicación diaria del precio", null], ["fi.s4", "Cuando las tasas de referencia del mercado de deuda SUBEN, el precio de las acciones de un fondo de deuda:", "Disminuye", ["Aumenta", "No se modifica", "Depende del tipo de cambio"], "Relación inversa: si las tasas suben, el precio de las acciones de los fondos de deuda disminuye; si bajan, aumenta.", "Tema 2 · Fondos de Inversión · 4.4 Efecto de las tasas de interés", null], ["fi.s4", "Cuando las tasas de referencia del mercado de deuda BAJAN, el precio de las acciones de un fondo de deuda:", "Aumenta", ["Disminuye", "Permanece constante", "Se vuelve independiente de la cartera"], "Si las tasas de referencia bajan, el precio de las acciones de los fondos de deuda aumenta.", "Tema 2 · Fondos de Inversión · 4.4 Efecto de las tasas de interés", null], ["fi.s4", "Cuando se DEPRECIA el peso frente al dólar, el precio de las acciones de un fondo de cobertura cambiaria:", "Sube", ["Baja", "No cambia", "Depende de los índices accionarios"], "Cuando sube el tipo de cambio o se deprecia el peso frente al dólar, se genera un alza en el precio de las acciones de los fondos de cobertura cambiaria.", "Tema 2 · Fondos de Inversión · 4.5 Efecto del tipo de cambio", null], ["fi.s4", "Cuando se APRECIA el peso frente al dólar, el precio de las acciones de un fondo de cobertura cambiaria:", "Baja", ["Sube", "No cambia", "Sube sólo si hay derivados"], "Cuando baja el tipo de cambio o se aprecia el peso frente al dólar, se genera una baja en el precio de las acciones de los fondos de cobertura cambiaria.", "Tema 2 · Fondos de Inversión · 4.5 Efecto del tipo de cambio", null], ["fi.s4", "Un aumento en los índices accionarios de la Bolsa de Valores genera:", "Un incremento en el precio de las acciones del fondo de renta variable", ["Una baja en el precio de las acciones del fondo de renta variable", "Un efecto nulo sobre el fondo", "Un alza sólo en fondos de deuda"], "Relación directa: un aumento en los índices accionarios genera un incremento en el precio de las acciones del fondo de inversión de renta variable.", "Tema 2 · Fondos de Inversión · 4.6 Efecto de los mercados e índices accionarios", null], ["fi.s4", "Una disminución en el nivel del índice accionario se reflejará en:", "Una baja en el valor de la acción del fondo de renta variable", ["Un alza en el valor de la acción del fondo", "Un aumento de las comisiones", "Una suspensión de la valuación"], "Una disminución del índice reflejará una baja en el valor de la acción del fondo de inversión de renta variable.", "Tema 2 · Fondos de Inversión · 4.6 Efecto de los mercados e índices accionarios", null], ["fi.s4", "El diferencial de precio se aplica:", "Ante compras o ventas significativas e inusuales, si el prospecto lo prevé", ["A todas las operaciones del día, siempre", "Sólo a inversionistas institucionales", "Cuando lo solicita el cliente"], "DCG art. 15: ante compras o ventas significativas e inusuales, el fondo puede aplicar un diferencial al precio si el prospecto lo prevé, de forma general y consistente el mismo día.", "Tema 2 · Fondos de Inversión · 4.7 Diferencial de precio", ["A todas las operaciones del día, siempre", "Ante compras o ventas significativas e inusuales, si el prospecto lo prevé", "Sólo a inversionistas institucionales", "Cuando lo solicita el cliente"]], ["fi.s4", "El importe que resulta de aplicar un diferencial de precio:", "Se queda en el fondo, en beneficio de los accionistas que permanecen", ["Se entrega a la sociedad operadora", "Se reparte entre las distribuidoras", "Se entrega al inversionista que sale"], "El importe queda en el fondo, en beneficio de los accionistas que permanecen. Por eso el mecanismo protege a quienes no operaron.", "Tema 2 · Fondos de Inversión · 4.7 Diferencial de precio", null], ["fi.s4", "La metodología del diferencial de precio requiere aprobación de:", "La mayoría independiente del consejo de la operadora, con visto bueno del contralor normativo y del responsable de riesgos", ["La asamblea de accionistas del fondo", "La CNBV en cada aplicación", "El proveedor de precios"], "Debe derivar de políticas, procedimientos y metodología aprobados por la mayoría independiente del consejo de la operadora, con visto bueno del contralor normativo y del responsable de riesgos.", "Tema 2 · Fondos de Inversión · 4.7 Diferencial de precio", null], ["fi.s4", "El precio de valuación de las acciones se divulga:", "En medios impresos o electrónicos de amplia circulación, y en la página de la operadora y de la distribuidora o mediante bolsa o mecanismo autorizado", ["Sólo ante la CNBV", "Únicamente en el prospecto", "Sólo a través de la calificadora"], "LFI arts. 44–45 y DCG art. 41: se divulga en medios impresos o electrónicos de amplia circulación; las Disposiciones exigen publicarlo en la página de la operadora y de la distribuidora, o mediante bolsa o mecanismo autorizado.", "Tema 2 · Fondos de Inversión · 4.8 Precio de las acciones", null], ["fi.s4", "La dimensión de MERCADO de la calificación de un fondo refleja:", "La sensibilidad a tasas, precios, tipo de cambio y liquidez", ["La capacidad de pago de los emisores", "La calidad de la administración", "El cumplimiento del prospecto"], "La dimensión crediticia estima capacidad de pago de emisores y contrapartes; la de mercado refleja sensibilidad a tasas, precios, tipo de cambio y liquidez.", "Tema 2 · Fondos de Inversión · 4.9 Calificación del fondo", null], ["fi.s4", "La calificación de un fondo de inversión:", "No equivale a una recomendación, seguro, garantía de capital ni promesa de rendimiento", ["Equivale a una recomendación de compra", "Garantiza el pago del capital", "Sustituye al documento con información clave"], "Es un insumo que debe leerse junto con horizonte, régimen, cartera, concentración y documento con información clave. No es recomendación, seguro, garantía ni promesa.", "Tema 2 · Fondos de Inversión · 4.9 Calificación del fondo", null], ["fi.s4", "En la escala homogénea de riesgo, la calidad crediticia se expresa con:", "Letras de AAA a B", ["Números del 1 al 7", "Letras de A a E", "Porcentajes"], "DCG Anexos 1 y 3: las letras (AAA, AA, A, BBB, BB, B) califican la calidad crediticia; los números (1 a 7) califican el riesgo de mercado.", "Tema 2 · Fondos de Inversión · 4.10 Escala homogénea de riesgo", null], ["fi.s4", "En la escala homogénea de riesgo, el nivel de mercado '7' corresponde a:", "Muy alta", ["Extremadamente baja", "Moderada", "Alta"], "La escala de riesgo de mercado va de 1 (extremadamente baja) a 7 (muy alta). El 6 es alta y el 7 muy alta.", "Tema 2 · Fondos de Inversión · 4.10 Escala homogénea de riesgo", null], ["fi.s4", "En la escala de calidad crediticia, 'AAA' significa:", "Sobresaliente", ["Alto", "Bueno", "Aceptable"], "AAA = sobresaliente; AA = alto; A = bueno; BBB = aceptable; BB = bajo; B = mínimo.", "Tema 2 · Fondos de Inversión · 4.10 Escala homogénea de riesgo", null], ["fi.s4", "La escala de riesgo de mercado tiene:", "Siete niveles", ["Cinco niveles", "Seis niveles", "Diez niveles"], "La escala de riesgo de mercado tiene siete niveles (1 a 7) y la de calidad crediticia seis (AAA a B).", "Tema 2 · Fondos de Inversión · 4.10 Escala homogénea de riesgo", null], ["fi.s5", "Los riesgos cuantificables son aquellos para los cuales:", "Es posible conformar bases estadísticas que permitan medir sus pérdidas potenciales", ["Existe cobertura obligatoria con derivados", "La CNBV fija un límite máximo", "No se requiere medición"], "DCG art. 119-I: son aquellos para los cuales es posible conformar bases estadísticas que permitan medir sus pérdidas potenciales. Se clasifican en discrecionales y no discrecionales.", "Tema 2 · Fondos de Inversión · 5.1 Riesgos cuantificables", null], ["fi.s5", "Los riesgos cuantificables se subdividen en:", "Discrecionales y no discrecionales", ["De mercado y de crédito", "Internos y externos", "Sistémicos y específicos"], "Se clasifican en discrecionales (crédito, liqui
