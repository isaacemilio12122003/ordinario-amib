<style>
/* Layout: una columna de estudio (máx. 760px); tablero arriba, reactivo como hoja de examen. */
:root{
  --paper:#EEF2F0; --card:#FFFFFF; --ink:#13221E; --muted:#56665F; --line:#D3DCD8;
  --accent:#0F6B57; --accent-soft:#DDEDE7; --amber:#A8670F; --amber-soft:#F6EBD8;
  --ok:#1C7A4A; --ok-soft:#DFF1E6; --bad:#B3261E; --bad-soft:#F8E1DF; --new:#B9C4C0;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1513; --card:#16201D; --ink:#E4ECE9; --muted:#93A39D; --line:#2A3632;
  --accent:#4FC3A1; --accent-soft:#173A31; --amber:#E2AA4E; --amber-soft:#3A2D16;
  --ok:#5CCB8F; --ok-soft:#173826; --bad:#F2867E; --bad-soft:#41201D; --new:#3D4A46; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1513; --card:#16201D; --ink:#E4ECE9; --muted:#93A39D; --line:#2A3632;
  --accent:#4FC3A1; --accent-soft:#173A31; --amber:#E2AA4E; --amber-soft:#3A2D16;
  --ok:#5CCB8F; --ok-soft:#173826; --bad:#F2867E; --bad-soft:#41201D; --new:#3D4A46; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.small{padding:6px 12px;font-size:15px}
.btn.ghost{background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}

/* Tablero */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.ring{width:112px;height:112px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lbl b{font-family:var(--f-display);font-size:28px;line-height:1}
.ring .lbl span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.stat.k-new b{color:var(--muted)} .stat.k-learn b{color:var(--amber)} .stat.k-done b{color:var(--ok)} .stat.k-due b{color:var(--accent)}
.start{display:flex;flex-direction:column;gap:14px;border-color:var(--accent);background:linear-gradient(0deg,var(--card),var(--card))}
.start .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-family:var(--f-mono);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px}
.mode:hover{border-color:var(--accent)}
.mode b{font-family:var(--f-display);font-weight:600;font-size:18px}
.mode span{font-size:14px;color:var(--muted)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.topics{display:flex;flex-direction:column}
.topic{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic .name{font-weight:600;min-width:0}
.topic .name small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.bar{grid-column:1/2;height:8px;border-radius:5px;background:var(--new);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .d{background:var(--ok)} .bar .l{background:var(--amber)}
.topic .pct{font-family:var(--f-mono);font-size:14px;color:var(--muted);text-align:right}
.topic .act{grid-row:1/3;grid-column:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
details.card summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:19px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.card summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.card[open] summary::after{content:"–"}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table.nums{width:100%;border-collapse:collapse;font-size:15px}
table.nums td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.nums td:first-child{font-family:var(--f-mono);font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.how{font-size:15px;color:var(--muted);margin:0;display:flex;flex-direction:column;gap:6px}
.how b{color:var(--ink)}

/* Reactivo */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.retry{background:var(--amber-soft);color:var(--amber)}
.qcard{display:flex;flex-direction:column;gap:16px}
.qtext{font-size:20px;font-weight:600;line-height:1.4;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:700;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:var(--card)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb h3{font-size:18px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb p{margin:0}
.src{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.guess{display:flex;gap:8px;align-items:center;font-size:15px}
.guess input{width:18px;height:18px;accent-color:var(--amber)}
.qfoot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.timer{font-family:var(--f-mono);font-size:18px;font-weight:700}
.timer.low{color:var(--bad)}

/* Resultados */
.big{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1}
.res-list{display:flex;flex-direction:column;gap:12px}
.res-item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.res-item .ans{color:var(--ok);font-weight:600}
.res-item .yours{color:var(--bad);font-size:15px}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .modes{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .ring{width:96px;height:96px}
  .qtext{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* Materias: pestañas arriba y tarjetas de avance por materia */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.mats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mat{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px}
.mat:hover{border-color:var(--accent)}
.mat b{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2}
.mat span{font-size:13px;color:var(--muted)}
.mat .bar{height:8px}
.badge{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--amber-soft);color:var(--amber);margin-left:6px;vertical-align:2px}
.chip.mat-chip{background:var(--paper);color:var(--muted)}
@media (max-width:560px){.mats{grid-template-columns:1fr}}
</style>

 de recomendaciones generalizadas sobre valores autorizados", "La administración discrecional de la cartera del cliente", "La recepción y transmisión de instrucciones exactas del cliente"], "Asesoría de Inversiones = recomendaciones, consejos o sugerencias PERSONALIZADAS de manera individualizada. Si es generalizada, es comercialización; si es discrecional, es gestión.", "Servicios de Inversión AMIB · 1.2 Glosario I: analistas, áreas de negocio, asesoría y sofisticados", null], ["si.s1", "Un Analista, conforme a las Disposiciones, es la persona física que:", "Elabora reportes de análisis sobre emisoras, valores, derivados o mercados, difundidos al público de forma habitual y profesional", ["Ejecuta órdenes en la mesa de dinero", "Aprueba el perfil de los productos financieros", "Supervisa el cumplimiento normativo de la entidad"], "El analista elabora Reportes de Análisis difundidos al público general de forma habitual y profesional. Sus reglas de independencia están en los Artículos 46 a 48 y el Anexo 15.", "Servicios de Inversión AMIB · 1.2 Glosario I: analistas, áreas de negocio, asesoría y sofisticados", null], ["si.s1", "Se consideran Áreas de Negocio, entre otras, las encargadas de:", "Ofertas públicas, servicios de inversión, intermediación por cuenta propia, fusiones, adquisiciones y estructuración de financiamiento", ["Auditoría interna y contraloría normativa", "Recursos humanos y capacitación", "Únicamente la mesa de dinero"], "La definición de Áreas de Negocio abarca ofertas públicas, prestación de servicios de inversión, intermediación por cuenta propia, fusiones y adquisiciones y estructuración de financiamiento. Es clave para las barreras de información frente a análisis.", "Servicios de Inversión AMIB · 1.2 Glosario I: analistas, áreas de negocio, asesoría y sofisticados", null], ["si.s1", "El umbral de activos financieros promedio anuales para ser Cliente Sofisticado es:", "3,000,000 de UDIs", ["1,000,000 de UDIs", "1,500,000 de UDIs", "5,000,000 de UDIs"], "Cliente Sofisticado: activos financieros promedio ≥ 3,000,000 UDIs, o ingresos brutos anuales ≥ 1,000,000 UDIs en los últimos 2 años.", "Servicios de Inversión AMIB · 1.2 Glosario I: analistas, áreas de negocio, asesoría y sofisticados", null], ["si.s1", "La Comercialización o Promoción se caracteriza porque:", "Se emiten recomendaciones generalizadas sin tomar en cuenta el perfil particular del cliente", ["Se administra discrecionalmente la cartera del cliente", "Se ejecuta exactamente la orden del cliente sin recomendar", "Se emiten recomendaciones individualizadas con evaluación de razonabilidad"], "Comercialización o Promoción = distribución y difusión de recomendaciones GENERALIZADAS sobre valores o instrumentos autorizados, sin considerar el perfil particular del cliente.", "Servicios de Inversión AMIB · 1.3 Glosario II: comercialización, ejecución, entidad financiera y gestión", null], ["si.s1", "En la Ejecución de Operaciones, la entidad financiera:", "Se limita a recibir, transmitir y ejecutar la instrucción exacta del cliente", ["Debe emitir un juicio de razonabilidad antes de operar", "Decide por cuenta del cliente al amparo de un mandato", "Debe recomendar el instrumento más conveniente"], "En Ejecución de Operaciones la entidad recibe, transmite y ejecuta instrucciones exactas del cliente y se limita a cumplirlas, SIN emitir juicio de razonabilidad.", "Servicios de Inversión AMIB · 1.3 Glosario II: comercialización, ejecución, entidad financiera y gestión", null], ["si.s1", "La Gestión de Inversiones consiste en:", "La administración discrecional de carteras, tomando decisiones por cuenta del cliente al amparo de mandatos o fideicomisos", ["Recomendar valores caso por caso al cliente", "Difundir reportes de análisis a la clientela", "Ejecutar las órdenes que gira un asesor externo"], "Gestión de Inversiones = administración discrecional de carteras. La entidad decide por cuenta del cliente al amparo de mandatos, comisiones o fideicomisos autorizados.", "Servicios de Inversión AMIB · 1.3 Glosario II: comercialización, ejecución, entidad financiera y gestión", null], ["si.s1", "¿Cuál de estas NO es una Entidad Financiera para efectos de estas Disposiciones?", "Asesor en inversiones independiente persona física", ["Institución de crédito", "Casa de bolsa", "Operadora de fondos de inversión"], "Entidad Financiera comprende instituciones de crédito, casas de bolsa, operadoras de fondos y distribuidoras de acciones de fondos. El asesor independiente es una figura distinta, no financiera.", "Servicios de Inversión AMIB · 1.3 Glosario II: comercialización, ejecución, entidad financiera y gestión", null], ["si.s1", "El concepto de Productos Financieros incluye:", "Valores, instrumentos derivados, estrategias de inversión o la composición estructurada de un portafolio", ["Solo valores de renta variable listados", "Únicamente los instrumentos del Anexo 6", "Solo los fondos de inversión"], "Productos Financieros abarca valores, instrumentos financieros derivados, estrategias de inversión y la composición estructurada de un portafolio de inversión.", "Servicios de Inversión AMIB · 1.4 Glosario III: productos, reclamación y los dos tipos de servicio", null], ["si.s1", "La Reclamación se define como:", "La manifestación formal de queja o inconformidad POR ESCRITO presentada por el cliente respecto de la prestación de los servicios de inversión", ["Cualquier queja verbal del cliente en ventanilla", "La solicitud de cambio de perfil del cliente", "El aviso de la CNBV sobre un incumplimiento"], "Reclamación = manifestación formal de queja o inconformidad presentada POR ESCRITO por el cliente respecto de los servicios de inversión.", "Servicios de Inversión AMIB · 1.4 Glosario III: productos, reclamación y los dos tipos de servicio", null], ["si.s1", "Los Servicios de Inversión Asesorados comprenden de forma exclusiva:", "Asesoría de inversiones y gestión de inversiones", ["Asesoría de inversiones y comercialización", "Gestión de inversiones y ejecución de operaciones", "Comercialización y ejecución de operaciones"], "Asesorados = Asesoría de Inversiones + Gestión de Inversiones. No asesorados = Comercialización o Promoción + Ejecución de Operaciones.", "Servicios de Inversión AMIB · 1.4 Glosario III: productos, reclamación y los dos tipos de servicio", null], ["si.s1", "La Estrategia de Inversión es:", "El conjunto de orientaciones elaboradas por la entidad o el asesor para proporcionar servicios asesorados, con base en las características y condiciones de los mercados e instrumentos", ["La orden concreta de compra que gira el cliente", "El documento donde el cliente declara ser sofisticado", "La política de comisiones aprobada por el consejo"], "Estrategia de Inversión: conjunto de orientaciones elaboradas por la entidad financiera o el asesor para proporcionar servicios de inversión asesorados, considerando las condiciones de mercados, valores y derivados.", "Servicios de Inversión AMIB · 1.5 Glosario IV: estrategia, reportes de análisis y servicios de inversión", null], ["si.s1", "Para que exista 'Servicios de Inversión' conforme al glosario, la prestación debe ser:", "Habitual y profesional a favor de clientes", ["Ocasional y gratuita", "Exclusivamente escrita", "Exclusivamente a clientes sofisticados"], "Servicios de Inversión: prestación HABITUAL y PROFESIONAL a favor de clientes de servicios de inversión asesorados y no asesorados.", "Servicios de Inversión AMIB · 1.5 Glosario IV: estrategia, reportes de análisis y servicios de inversión", null], ["si.s1", "Los Reportes de Análisis se dirigen a:", "El público o la clientela en general de una entidad financiera o asesor en inversiones", ["Un cliente en particular, de forma individualizada", "Exclusivamente al Comité de Análisis de Productos", "Únicamente a la CNBV"], "Los Reportes de Análisis son información dirigida al público o a la clientela EN GENERAL, con análisis financieros y opiniones. Por eso no constituyen asesoría personalizada.", "Servicios de Inversión AMIB · 1.5 Glosario IV: estrategia, reportes de análisis y servicios de inversión", null], ["si.s1", "¿Cuál es la consecuencia práctica de clasificar un servicio como asesorado o no asesorado?", "Determina el perfilamiento exigible, la documentación y la responsabilidad de la entidad", ["Determina únicamente el monto de las comisiones", "Solo afecta la periodicidad del estado de cuenta", "No tiene efectos prácticos, es una distinción académica"], "La categoría determina el perfilamiento exigible, la documentación de soporte y el alcance de la responsabilidad de la entidad frente al cliente.", "Servicios de Inversión AMIB · 1.6 Clasificación de los Servicios de Inversión", null], ["si.s1", "Sobre la contratación del servicio, la regla es que:", "El servicio contratado debe constar por escrito y coincidir con la conducta real del promotor", ["Basta el acuerdo verbal entre promotor y cliente", "Puede pactarse después de la primera operación", "Solo se documenta si el cliente es sofisticado"], "El servicio debe constar por escrito y, sobre todo, la conducta real del promotor debe coincidir con el servicio contratado; si diverge, se incurre en incumplimiento.", "Servicios de Inversión AMIB · 1.6 Clasificación de los Servicios de Inversión", null], ["si.s1", "Ante un cliente nuevo del que no se tiene información, la entidad financiera debe:", "Asumir que NO es sofisticado", ["Asumir que es sofisticado hasta que demuestre lo contrario", "Clasificarlo como institucional", "Abstenerse de prestarle servicios"], "Principio de asunción general: la entidad DEBE asumir que todo cliente no es sofisticado. La carga de la declaración recae en el cliente y su formalización en la entidad.", "Servicios de Inversión AMIB · 1.7 Obligaciones Previas con Clientes Sofisticados", null], ["si.s1", "El Formato A del Anexo 1 sirve para:", "Clasificar formalmente a un cliente como sofisticado, con firma autógrafa en documento separado del contrato", ["Documentar que el cliente asume el riesgo de operar con un asesor externo", "Registrar la bitácora de instrucciones", "Aprobar el perfil del producto financiero"], "Formato A (Anexo 1) = declaración firmada autógrafamente por el cliente para ser clasificado como sofisticado. Debe suscribirse en documento TOTALMENTE SEPARADO del contrato de intermediación.", "Servicios de Inversión AMIB · 1.7 Obligaciones Previas con Clientes Sofisticados", null], ["si.s1", "Que un cliente sea clasificado como sofisticado:", "No exime a la entidad de la evaluación periódica de perfilamiento cuando se presten servicios asesorados", ["Lo exime de todo perfilamiento en cualquier servicio", "Impide contratar servicios no asesorados", "Obliga a revisar su perfil cada 5 años"], "La clasificación como sofisticado NO exime de la evaluación periódica de perfilamiento cuando se prestan servicios de inversión asesorados.", "Servicios de Inversión AMIB · 1.7 Obligaciones Previas con Clientes Sofisticados", null], ["si.s1", "Las disposiciones de servicios de inversión NO aplican cuando el cliente es:", "Inversionista institucional (banco, casa de bolsa, afore, aseguradora)", ["Persona física con altos ingresos", "Cliente sofisticado", "Persona moral no financiera"], "Existe exención normativa para inversionistas institucionales: bancos, casas de bolsa, afores y aseguradoras.", "Servicios de Inversión AMIB · 1.7 Obligaciones Previas con Clientes Sofisticados", null], ["si.s1", "El criterio de ingresos brutos anuales para Cliente Sofisticado exige haberlos obtenido:", "En cada uno de los últimos 2 años, por al menos 1,000,000 de UDIs", ["En cualquiera de los últimos 5 años", "Como promedio de los últimos 12 meses, por 500,000 UDIs", "Una sola vez, por 3,000,000 de UDIs"], "Se requieren ingresos brutos anuales ≥ 1,000,000 UDIs en CADA UNO de los últimos 2 años. El criterio alternativo es el saldo promedio de inversiones ≥ 3,000,000 UDIs en los últimos 12 meses.", "Servicios de Inversión AMIB · 1.8 Requisitos Cuantitativos del Cliente Sofisticado", null], ["si.s1", "El saldo promedio de inversiones en valores para ser Cliente Sofisticado se mide durante:", "Los últimos 12 meses", ["Los últimos 6 meses", "Los últimos 24 meses", "El último trimestre"], "Saldo promedio de inversiones en valores durante los últimos 12 meses ≥ 3,000,000 UDIs, en una o varias entidades.", "Servicios de Inversión AMIB · 1.8 Requisitos Cuantitativos del Cliente Sofisticado", null], ["si.s1", "Para el Inversionista Calificado Básico (mesa de operación), los parámetros son:", "1,500,000 UDIs de inversiones o 500,000 UDIs de ingresos, con operación activa mínima de 1,250,000 UDIs en 12 meses", ["3,000,000 UDIs de inversiones o 1,000,000 UDIs de ingresos", "500,000 UDIs de inversiones y 1,250,000 UDIs de ingresos", "1,000,000 UDIs de inversiones y 1,500,000 UDIs de operación"], "Inversionista Calificado Básico: inversiones promedio de 1,500,000 UDIs o ingresos de 500,000 UDIs, con operación activa mínima de 1,250,000 UDIs en los últimos 12 meses.", "Servicios de Inversión AMIB · 1.8 Requisitos Cuantitativos del Cliente Sofisticado", null], ["si.s1", "El saldo promedio de inversiones para cliente sofisticado puede acumularse:", "En una o varias entidades", ["Solo en la entidad donde se firma el Formato A", "Solo en instituciones de crédito", "Solo en casas de bolsa"], "El criterio admite el saldo mantenido en una o varias entidades, siempre que el promedio de los últimos 12 meses alcance 3,000,000 de UDIs.", "Servicios de Inversión AMIB · 1.8 Requisitos Cuantitativos del Cliente Sofisticado", null], ["si.s1", "El perfil del cliente debe actualizarse obligatoriamente:", "Al menos una vez al año", ["Cada vez que opera", "Cada 6 meses", "Cada 5 años"], "El perfil del cliente debe ser evaluado y actualizado de forma obligatoria al menos una vez al año (Art. 4 y Anexo 3).", "Servicios de Inversión AMIB · 1.9 Determinación del Perfil del Cliente", null], ["si.s1", "¿Cuál de estos elementos NO forma parte de la determinación del perfil del cliente?", "La calificación crediticia del emisor del instrumento", ["Conocimientos y experiencia en mercados financieros", "Situación y capacidad financiera", "Objetivos de inversión y tolerancia al riesgo"], "La calificación del emisor pertenece al perfil del PRODUCTO (Anexo 4). El perfil del cliente se compone de conocimientos y experiencia, situación y capacidad financiera y objetivos de inversión.", "Servicios de Inversión AMIB · 1.9 Determinación del Perfil del Cliente", null], ["si.s1", "Dentro de 'situación y capacidad financiera' del cliente se evalúa:", "Origen y nivel de ingresos, estructura de activos líquidos e ilíquidos, pasivos exigibles y capacidad de asumir pérdidas", ["Únicamente su ingreso mensual neto", "Solo el saldo en la cuenta de intermediación", "El historial de rendimientos de su portafolio anterior"], "Comprende origen y nivel de ingresos periódicos, estructura de activos (líquidos e ilíquidos), pasivos exigibles y la capacidad de asumir pérdidas financieras.", "Servicios de Inversión AMIB · 1.9 Determinación del Perfil del Cliente", null], ["si.s1", "Los objetivos de inversión del cliente incluyen:", "Horizonte temporal, tolerancia al riesgo y límites máximos de pérdida tolerables", ["El rendimiento mínimo garantizado por la entidad", "La comisión máxima que acepta pagar", "El número de operaciones mensuales pactadas"], "Objetivos de inversión = horizonte de inversión temporal, tolerancia al riesgo declarada y límites máximos de pérdida tolerables. Ningún servicio de inversión garantiza rendimientos.", "Servicios de Inversión AMIB · 1.9 Determinación del Perfil del Cliente", null], ["si.s1", "Para prestar servicios de inversión, la persona física debe contar con:", "Apoderamiento vigente otorgado por la CNBV y certificación vigente ante un organismo autorregulatorio", ["Solo la certificación AMIB", "Solo el apoderamiento de la entidad", "Únicamente el registro ante CONDUSEF"], "Se exigen ambos: apoderamiento vigente otorgado por la CNBV y certificación técnica vigente (por ejemplo Serie 210) ante un organismo autorregulatorio como AMIB.", "Servicios de Inversión AMIB · 1.10 Requisitos del Personal Representante", null], ["si.s1", "El requisito de honorabilidad y calidad técnica implica:", "Historial crediticio satisfactorio y no tener antecedentes de sanciones graves por violaciones a las leyes financieras", ["Contar con posgrado en finanzas", "Tener al menos 10 años de experiencia", "Ser socio de la entidad"], "Honorabilidad: historial crediticio satisfactorio y ausencia de antecedentes de sanciones graves por violaciones a leyes financieras, inhabilitaciones o antecedentes penales patrimoniales.", "Servicios de Inversión AMIB · 1.10 Requisitos del Personal Representante", null], ["si.s1", "La vigencia de la certificación del personal se conserva mediante:", "Capacitación y recertificación en los plazos previstos", ["El pago anual de una cuota", "La antigüedad en la entidad", "La aprobación del Comité de Análisis"], "La certificación debe mantenerse vigente y actualizada mediante capacitación continua y recertificación en los plazos previstos por la normativa autorregulatoria.", "Servicios de Inversión AMIB · 1.11 Certificación y Registro del Personal", null], ["si.s1", "El perfil del producto financiero debe ser aprobado por:", "El Comité de Análisis de Productos Financieros", ["El promotor que lo va a recomendar", "La CONDUSEF", "El cliente sofisticado"], "La metodología para determinar el perfil del producto es aprobada por el Comité responsable del análisis de productos financieros (Art. 4 y Anexo 4).", "Servicios de Inversión AMIB · 1.12 Determinación del Perfil del Producto Financiero", null], ["si.s1", "Ningún producto financiero puede ser recomendado en servicios asesorados si:", "No cuenta con ficha técnica y perfil de producto autorizado por el Comité", ["No está listado en la Bolsa Mexicana de Valores", "No tiene calificación AAA", "El cliente no lo ha operado antes"], "Se requiere aprobación previa: ficha técnica y perfil del producto autorizado por el Comité antes de promoverlo o recomendarlo en servicios asesorados.", "Servicios de Inversión AMIB · 1.12 Determinación del Perfil del Producto Financiero", null], ["si.s1", "El 'mercado objetivo' dentro del perfil del producto consiste en:", "La definición del perfil de inversionista ideal: conocimientos mínimos y tolerancia al riesgo compatible", ["La bolsa donde cotiza el instrumento", "El volumen operado diariamente", "La lista de clientes que ya lo compraron"], "Mercado objetivo = definición del perfil de inversionista ideal para ese producto (conocimientos mínimos requeridos y tolerancia al riesgo compatible).", "Servicios de Inversión AMIB · 1.12 Determinación del Perfil del Producto Financiero", null], ["si.s1", "Los riesgos implícitos que deben evaluarse en el perfil del producto son:", "Riesgo de mercado, de crédito, de liquidez y de contraparte", ["Solo el riesgo de mercado", "Solo el riesgo de crédito del emisor", "Riesgo operativo y reputacional exclusivamente"], "Se evalúan cuantitativa y cualitativamente: riesgo de mercado (volatilidad), de crédito (calificación del emisor), de liquidez y de contraparte.", "Servicios de Inversión AMIB · 1.12 Determinación del Perfil del Producto Financiero", null], ["si.s1", "La 'triple validación' de la razonabilidad exige contrastar la recomendación contra:", "El perfil del cliente, el perfil del producto y la política de diversificación de carteras", ["El rendimiento histórico, la comisión y la liquidez", "La opinión del analista, la del comité y la del cliente", "El prospecto, el estado de cuenta y el contrato"], "Art. 5: la recomendación se valida contra 1) el perfil del cliente, 2) el perfil del producto financiero y 3) la política de diversificación de carteras aprobada.", "Servicios de Inversión AMIB · 1.13 Principio de Razonabilidad de las Recomendaciones", null], ["si.s1", "La evaluación de razonabilidad:", "Busca la idoneidad y la protección frente a riesgos, pero NO garantiza rendimientos ni éxito futuro", ["Garantiza que el cliente obtenga rendimientos positivos", "Traslada la responsabilidad del riesgo al cliente", "Sustituye la necesidad de perfilar al cliente"], "La razonabilidad es una obligación prudencial de idoneidad. La norma aclara expresamente que no garantiza rendimientos ni éxito futuro.", "Servicios de Inversión AMIB · 1.13 Principio de Razonabilidad de las Recomendaciones", null], ["si.s1", "Un cliente conservador de corto plazo pide un derivado apalancado. El promotor de asesoría debe:", "Abstenerse de recomendarlo por no ser razonable para el perfil del cliente", ["Ejecutarlo porque el cliente lo pidió expresamente", "Cambiar el perfil del cliente para que encaje", "Recomendarlo advirtiendo verbalmente el riesgo"], "Bajo asesoría, la recomendación debe ser congruente con el perfil. Recomendar un producto no razonable, o inducir al cliente a modificar su perfil, son conductas prohibidas.", "Servicios de Inversión AMIB · 1.13 Principio de Razonabilidad de las Recomendaciones", null], ["si.s1", "¿Cuál de estos valores del Anexo 6 puede comercializarse a clientes no sofisticados sin evaluación previa de razonabilidad?", "Cetes, Bondes y Udibonos", ["Notas estructuradas con capital en riesgo", "Acciones de empresas de alta volatilidad", "Contratos de futuros sobre divisas"], "El Anexo 6 comprende instrumentos de deuda gubernamentales (Cetes, Bondes, Udibonos), deuda de la más alta calificación crediticia de entidades financieras locales y fondos de deuda que inviertan exclusivamente en ellos.", "Servicios de Inversión AMIB · 1.14 Valores de Comercialización para Clientes No Sofisticados", null], ["si.s1", "Los fondos de inversión que pueden comercializarse bajo el régimen del Anexo 6 son aquellos que:", "Invierten exclusivamente en los instrumentos gubernamentales de bajo riesgo mencionados", ["Invierten mayoritariamente en renta variable nacional", "Tienen rendimiento garantizado", "Están dirigidos a clientes sofisticados"], "Solo las acciones de fondos de inversión que inviertan EXCLUSIVAMENTE en los instrumentos gubernamentales de bajo riesgo señalados.", "Servicios de Inversión AMIB · 1.14 Valores de Comercialización para Clientes No Sofisticados", null], ["si.s1", "Un instrumento estructurado o apalancado:", "Requiere obligatoriamente perfilamiento y evaluación de razonabilidad", ["Puede promoverse libremente por ser de alto rendimiento", "Solo requiere la firma del estado de cuenta", "Está incluido en el Anexo 6"], "Cualquier instrumento estructurado, apalancado o de renta variable complejo queda fuera del Anexo 6 y exige perfilamiento y evaluación de razonabilidad.", "Servicios de Inversión AMIB · 1.14 Valores de Comercialización para Clientes No Sofisticados", null], ["si.s1", "Los límites máximos de diversificación que fija el Comité de Análisis se establecen por:", "Un mismo emisor; un mismo valor, instrumento o contraparte; y un mismo grupo empresarial", ["Únicamente por emisor", "Por sector económico y por país exclusivamente", "Por antigüedad del cliente"], "Art. 6: límites máximos de exposición recomendada por 1) un mismo emisor, 2) un mismo valor, instrumento o contraparte y 3) un mismo grupo empresarial.", "Servicios de Inversión AMIB · 1.15 Políticas para la Diversificación de Carteras", null], ["si.s1", "Un desvío temporal de los límites de diversificación es admisible cuando:", "Se presentan condiciones extraordinarias de volatilidad de mercado o retiros forzados, con justificación escrita y plan de reajuste", ["El cliente lo solicita por escrito", "La entidad obtiene mayor comisión", "Nunca es admisible bajo ninguna circunstancia"], "Se permite el incumplimiento temporal y justificado únicamente por condiciones extraordinarias de volatilidad o retiros forzados. Debe justificarse por escrito, notificarse al cliente y acompañarse de un plan de reajuste progresivo.", "Servicios de Inversión AMIB · 1.15 Políticas para la Diversificación de Carteras", null], ["si.s1", "La justificación escrita de razonabilidad (Art. 7) se debe entregar a:", "Clientes que no son sofisticados ni institucionales", ["Todos los clientes, incluidos institucionales", "Solo a clientes sofisticados", "Solo a clientes de ejecución de operaciones"], "El Artículo 7 impone la obligación de transparencia formal frente a clientes que no son sofisticados ni institucionales.", "Servicios de Inversión AMIB · 1.16 Criterios de la Justificación de Razonabilidad", null], ["si.s1", "El documento de justificación de razonabilidad debe desglosar:", "Los porcentajes máximos por clase de activo, los límites máximos conforme al Anexo 4 y las características de los instrumentos", ["El rendimiento esperado garantizado y la fecha de venta sugerida", "El historial de operaciones del cliente de los últimos 5 años", "La remuneración del promotor"], "Contenido: 1) porcentajes máximos asignados por clase de activo, 2) límites máximos sugeridos conforme al Anexo 4 y 3) características de los instrumentos.", "Servicios de Inversión AMIB · 1.16 Criterios de la Justificación de Razonabilidad", null], ["si.s1", "Si se recomiendan valores individuales y no solo una estrategia, la entidad debe:", "Emitir una justificación específica que asocie las características del valor con los objetivos y límites del portafolio del cliente", ["Bastar con la justificación general de la estrategia", "Obtener autorización de la CNBV para cada valor", "Solicitar al cliente que firme el Formato A"], "Para operaciones específicas se requiere justificación específica que vincule las características del valor con los objetivos y límites del portafolio del cliente.", "Servicios de Inversión AMIB · 1.16 Criterios de la Justificación de Razonabilidad", null], ["si.s1", "Al recibir una cuenta transferida con valores preexistentes, la entidad debe:", "Identificarla y marcarla en sus sistemas, diagnosticar la cartera contra el perfil y establecer un ajuste progresivo", ["Vender de inmediato toda la cartera", "Ignorar los valores heredados porque no los recomendó", "Recomendar duplicar las posiciones existentes"], "Art. 8: identificación obligatoria en sistemas, diagnóstico comparativo perfil vs. cartera, procedimientos calendarizados de ajuste progresivo y evidencia de que los valores heredados no fueron recomendados por el promotor actual.", "Servicios de Inversión AMIB · 1.17 Cuentas Transferidas o Sin Asesoría Previa", null], ["si.s1", "La evidencia documental en cuentas transferidas sirve principalmente para:", "Acreditar que los valores heredados no fueron recomendados por el promotor actual", ["Cobrar una comisión adicional por diagnóstico", "Sustituir el perfilamiento del cliente", "Justificar exceder los límites de diversificación de forma permanente"], "Se debe mantener registro de que los valores preexistentes no fueron recomendados por el promotor actual, deslindando responsabilidad sobre su razonabilidad original.", "Servicios de Inversión AMIB · 1.17 Cuentas Transferidas o Sin Asesoría Previa", null], ["si.s1", "Antes de recomendar un producto, el promotor debe conocer con precisión:", "Prospectos de información, suplementos, folletos y fichas técnicas del producto", ["Solo el rendimiento histórico a 12 meses", "Únicamente la comisión que genera", "El nombre del analista que lo cubre"], "Art. 9: dominio del portafolio, es decir, conocimiento preciso de prospectos, suplementos, folletos y fichas técnicas de cada producto que recomiende.", "Servicios de Inversión AMIB · 1.18 Conocimiento del Personal sobre Productos y Clientes", null], ["si.s1", "El 'entendimiento del riesgo' exigido al promotor implica poder explicar:", "Escenarios de pérdida potencial, costos transaccionales, comisiones y liquidez del producto", ["La estrategia de la tesorería de la entidad", "El modelo econométrico del analista", "La política salarial del área"], "El promotor debe poder explicar con claridad escenarios de pérdida potencial, costos transaccionales, comisiones y liquidez del producto.", "Servicios de Inversión AMIB · 1.18 Conocimiento del Personal sobre Productos y Clientes", null], ["si.s1", "La capacitación del personal de promoción en servicios asesorados debe darse:", "ANTES de que comience a prestar servicios de inversión asesorados", ["Dentro de los 6 meses posteriores al inicio de labores", "Solo cuando la CNBV lo requiera", "Únicamente al momento de la recertificación"], "Existe obligación de capacitación PREVIA: se capacita formalmente antes de que el personal comience a prestar servicios de inversión asesorados.", "Servicios de Inversión AMIB · 1.19 Capacitación y Comunicación Interna Obligatoria", null], ["si.s1", "Las listas y bitácoras de asistencia a la capacitación interna se conservan para:", "La auditoría de la CNBV", ["Calcular bonos del personal", "Entregarlas al cliente", "Publicarlas en la Guía de Servicios"], "El registro de participación en la capacitación interna debe conservarse para efectos de auditoría de la CNBV.", "Servicios de Inversión AMIB · 1.19 Capacitación y Comunicación Interna Obligatoria", null], ["si.s1", "El Marco General de Actuación (MGA) se caracteriza porque:", "Debe suscribirse en documento separado del contrato principal, firmado por el cliente", ["Es una cláusula dentro del contrato de intermediación", "Lo firma solo el gestor de cartera", "Es opcional para cuentas discrecionales"], "Art. 10 y Anexo 5: el MGA es un documento independiente, suscrito de forma separada del contrato principal y firmado obligatoriamente por el cliente.", "Servicios de Inversión AMIB · 1.20 Marco General de Actuación en Gestión de Inversiones", null], ["si.s1", "El MGA no puede modificarse antes de que transcurran:", "6 meses", ["3 meses", "12 meses", "24 meses"], "El MGA no puede modificarse antes de 6 meses desde su última firma, salvo situaciones extraordinarias predeterminadas y justificadas por escrito.", "Servicios de Inversión AMIB · 1.20 Marco General de Actuación en Gestión de Inversiones", null], ["si.s1", "¿Cuál de los siguientes NO es contenido obligatorio del MGA?", "El rendimiento mínimo que la entidad se obliga a entregar", ["Las estrategias de inversión autorizadas", "Los límites de inversión por tipo de valor, emisor y sector", "Los mercados autorizados y la periodicidad de informes"], "El MGA fija estrategias autorizadas, límites por tipo de valor/emisor/sector, mercados autorizados y periodicidad de informes. Ningún servicio de inversión puede garantizar rendimientos.", "Servicios de Inversión AMIB · 1.20 Marco General de Actuación en Gestión de Inversiones", null], ["si.s1", "En la gestión discrecional, la evaluación de razonabilidad se aplica:", "A cada operación individual y colectiva ejecutada en la cuenta del cliente", ["Solo al abrir la cuenta", "Solo cuando el cliente lo solicite", "Una vez al año, junto con el perfilamiento"], "Arts. 11 y 12: la entidad es responsable de que cada operación individual y colectiva ejecutada en la cuenta sea razonable para el perfil del cliente.", "Servicios de Inversión AMIB · 1.21 Obligaciones en la Gestión de Inversiones (manejo discrecional)", null], ["si.s1", "En la gestión de inversiones, la evidencia de la razonabilidad de cada decisión discrecional:", "Debe guardarse en forma documental, electrónica o física", ["No es necesaria por tratarse de manejo discrecional", "Solo se guarda si el cliente reclama", "La conserva el cliente, no la entidad"], "Debe guardarse evidencia documental, electrónica o física de la razonabilidad de cada decisión de inversión discrecional tomada por la mesa.", "Servicios de Inversión AMIB · 1.21 Obligaciones en la Gestión de Inversiones (manejo discrecional)", null], ["si.s1", "Las estrategias estandarizadas se permiten siempre que:", "Las operaciones o reajustes de un cliente no afecten de ninguna manera las carteras del resto de los clientes del grupo", ["Todos los clientes del grupo sean sofisticados", "La entidad cobre la misma comisión a todos", "El cliente firme el Formato B"], "Art. 13: condición de autonomía de cuentas. Los reajustes u operaciones individuales de un cliente no pueden afectar las carteras de los demás clientes de la misma estrategia.", "Servicios de Inversión AMIB · 1.22 Estrategias Estandarizadas", null], ["si.s1", "Respecto a directivos, empleados o consejeros de la propia entidad:", "Puede aplicárseles una estrategia estandarizada con manejo discrecional pactado por escrito", ["Tienen prohibido participar en estrategias estandarizadas", "Solo pueden operar bajo ejecución de operaciones", "Requieren autorización previa de la CNBV para cada operación"], "Es posible aplicar estrategias estandarizadas a cuentas de relacionados (directivos, empleados o consejeros) con manejo discrecional pactado por escrito, bajo supervisión que evite favoritismos de asignación.", "Servicios de Inversión AMIB · 1.22 Estrategias Estandarizadas", null], ["si.s1", "En la comercialización o promoción, el promotor debe declarar:", "De forma verbal y escrita que NO constituye una recomendación personalizada", ["Que la recomendación fue evaluada conforme al perfil del cliente", "Que la entidad garantiza el capital", "Que el cliente es sofisticado"], "Debe indicarse verbal y por escrito, en toda la documentación entregada, que no constituye una recomendación personalizada, porque no se evaluó el perfil particular del cliente.", "Servicios de Inversión AMIB · 1.23 Comercialización o Promoción de Valores (no asesorado)", null], ["si.s1", "Los valores complejos solo pueden promoverse a:", "Clientes Sofisticados", ["Cualquier cliente que firme una advertencia de riesgo", "Clientes con contrato de ejecución de operaciones", "Clientes con más de un año de antigüedad"], "En comercialización, los valores complejos solo pueden promoverse a Clientes Sofisticados.", "Servicios de Inversión AMIB · 1.23 Comercialización o Promoción de Valores (no asesorado)", null], ["si.s1", "El folleto o ficha técnica que se entrega en comercialización debe listar:", "Beneficios potenciales, riesgos de pérdida, costos y comisiones, y advertencias de volatilidad", ["Únicamente el rendimiento histórico", "Solo la calificación crediticia", "El perfil del cliente que lo recibe"], "Conforme al Anexo 7 deben detallarse los beneficios potenciales, los riesgos de pérdida, los costos y comisiones y las advertencias de volatilidad.", "Servicios de Inversión AMIB · 1.23 Comercialización o Promoción de Valores (no asesorado)", null], ["si.s1", "El material entregado al comercializar un producto debe basarse en:", "Información previamente autorizada por el comité responsable del análisis de productos financieros o conforme a sus políticas", ["La opinión personal del promotor", "Reportes de análisis de terceros sin revisar", "Los comentarios de otros clientes"], "El material debe basarse en información previamente autorizada por el comité responsable del análisis de productos financieros, o cumplir sus políticas y lineamientos.", "Servicios de Inversión AMIB · 1.24 Perfil del Producto en Comercialización o Promoción", null], ["si.s1", "Respecto al prospecto de información o colocación en la comercialización:", "Debe incluirse, o señalarse dónde puede consultarlo el cliente", ["No es necesario mencionarlo", "Solo se entrega a clientes sofisticados", "Lo sustituye la grabación telefónica"], "Debe incluirse el prospecto de información o colocación u otro documento autorizado por la CNBV, o bien señalarse dónde puede consultarlo el cliente.", "Servicios de Inversión AMIB · 1.24 Perfil del Producto en Comercialización o Promoción", null], ["si.s1", "Antes de ejecutar una orden en el servicio de ejecución de operaciones, la entidad debe advertir que:", "La operación no proviene de una recomendación de razonabilidad, el cliente asume la totalidad del riesgo y es su responsabilidad evaluar la idoneidad", ["El rendimiento será conforme al perfil del cliente", "La entidad responderá por las pérdidas", "El Comité de Análisis aprobó la operación"], "Art. 15: advertencia por escrito con tres contenidos: no hay recomendación de razonabilidad, el cliente asume todo el riesgo y es su responsabilidad evaluar la idoneidad de la operación.", "Servicios de Inversión AMIB · 1.25 Requisitos para el Servicio de Ejecución de Operaciones", null], ["si.s1", "La advertencia previa a ejecutar la orden NO se requiere cuando se trata de:", "Instrumentos simples del Anexo 6", ["Notas estructuradas", "Derivados listados", "Acciones de empresas medianas"], "La advertencia se exige antes de ejecutar la orden, salvo tratándose de los instrumentos simples del Anexo 6 (deuda gubernamental y equivalentes de bajo riesgo).", "Servicios de Inversión AMIB · 1.25 Requisitos para el Servicio de Ejecución de Operaciones", null], ["si.s1", "La aceptación del riesgo por parte del cliente en ejecución de operaciones puede constar mediante:", "Firma de conformidad, grabaciones de voz autorizadas o firma electrónica, por cada operación", ["Solo firma autógrafa en papel", "Un correo del promotor al cliente", "La ausencia de reclamación en 30 días"], "El cliente debe firmar de conformidad o aceptar explícitamente mediante grabaciones de voz autorizadas o firma electrónica, por cada operación.", "Servicios de Inversión AMIB · 1.25 Requisitos para el Servicio de Ejecución de Operaciones", null], ["si.s1", "Cuando el cliente opera con base en las recomendaciones de un asesor externo independiente, la entidad debe recabar:", "El Formato B del Anexo 1, firmado por separado", ["El Formato A del Anexo 1", "El Marco General de Actuación", "El cuestionario del Anexo 3 firmado por el asesor"], "Art. 16: se requiere el Formato B del Anexo 1, firmado por separado, donde el cliente asume formalmente el riesgo derivado de las recomendaciones del asesor externo.", "Servicios de Inversión AMIB · 1.26 Ejecución de Operaciones con Asesor Externo", null], ["si.s1", "Al ejecutar órdenes originadas por un asesor externo, el intermediario financiero:", "Debe advertir expresamente que no asume responsabilidad alguna por dichas recomendaciones", ["Asume solidariamente la responsabilidad por las recomendaciones del asesor", "Debe evaluar la razonabilidad de cada recomendación del asesor", "Debe rechazar la operación si no está en el Anexo 6"], "El intermediario debe advertir expresamente al cliente que no asume responsabilidad por las recomendaciones del asesor independiente. Ello no exime al asesor externo de sus propias obligaciones de razonabilidad.", "Servicios de Inversión AMIB · 1.26 Ejecución de Operaciones con Asesor Externo", null], ["si.s1", "Un cliente contratado solo para ejecución de operaciones empieza a pedir opiniones personalizadas de forma reiterada. El promotor debe:", "Detener la recomendación e informarle que debe contratar formalmente el servicio de Asesoría de Inversiones", ["Darle la opinión solicitada, dejando constancia en la bitácora", "Cambiarle el perfil para poder recomendarle", "Referirlo a un asesor externo sin más trámite"], "Art. 17: emitir recomendaciones personalizadas bajo un esquema de mera ejecución es una violación regulatoria grave. Debe detenerse la recomendación y formalizarse la contratación de asesoría, previo perfilamiento del Anexo 3.", "Servicios de Inversión AMIB · 1.27 Transición de Servicios No Asesorados a Asesorados", null], ["si.s1", "Antes de emitir la primera recomendación formal en una cuenta que migra a asesoría, se debe:", "Completar la evaluación de perfilamiento del Anexo 3", ["Firmar el Formato B", "Esperar 6 meses", "Obtener autorización de la CNBV"], "Se exige completar la evaluación del Anexo 3 (perfil del cliente) antes de emitir la primera recomendación formal de la cuenta.", "Servicios de Inversión AMIB · 1.27 Transición de Servicios No Asesorados a Asesorados", null], ["si.s1", "En un contrato con servicios combinados, ante la CNBV se presume que:", "TODAS las operaciones fueron recomendadas por la entidad, salvo prueba firmada de instrucción directa previa", ["Todas las operaciones fueron instruidas directamente por el cliente", "Solo las de renta variable fueron asesoradas", "No existe presunción alguna"], "Art. 18: presunción de asesoría. Se presume que todas las operaciones fueron recomendadas por la entidad, salvo que exista prueba física o digital firmada por el cliente que acredite la instrucción directa previa.", "Servicios de Inversión AMIB · 1.28 Contratos con Servicios Combinados", ["Todas las operaciones fueron instruidas directamente por el cliente", "TODAS las operaciones fueron recomendadas por la entidad, salvo prueba firmada de instrucción directa previa", "Solo las de renta variable fueron asesoradas", "No existe presunción alguna"]], ["si.s1", "¿Es legal un contrato que incluya simultáneamente asesoría y ejecución de operaciones?", "Sí, pero la entidad debe identificar en sus bitácoras el origen exacto de cada operación", ["No, son incompatibles", "Sí, y no requiere control alguno", "Solo si el cliente es sofisticado"], "Es legal celebrar contratos combinados, pero la entidad debe identificar en sus bitácoras tecnológicas el origen exacto de cada operación ejecutada.", "Servicios de Inversión AMIB · 1.28 Contratos con Servicios Combinados", null], ["si.s2", "¿Cuál de estas funciones corresponde al Consejo de Administración?", "Aprobar las políticas y lineamientos para determinar los perfiles de clientes y el análisis de productos", ["Ejecutar las órdenes de los clientes sofisticados", "Elaborar los reportes de análisis", "Firmar el Formato A con el cliente"], "Arts. 19 y 20: el Consejo aprueba políticas y lineamientos de perfilamiento y análisis de productos, los códigos de ética y manuales de conflictos de interés, fija los parámetros del Anexo 13 y designa al responsable de cumplimiento.", "Servicios de Inversión AMIB · 2.1 Funciones del Consejo de Administración", null], ["si.s2", "Los códigos de ética y los manuales para prevenir y resolver conflictos de interés son aprobados por:", "El Consejo de Administración", ["El Comité de Análisis de Productos", "El área de promoción", "La CONDUSEF"], "Es una responsabilidad indelegable del Consejo de Administración aprobar los códigos de ética y los manuales de prevención y solución de conflictos de interés.", "Servicios de Inversión AMIB · 2.1 Funciones del Consejo de Administración", null], ["si.s2", "Los parámetros de actuación que fija el Consejo incluyen:", "Los límites cuantitativos de compra y venta de valores del Anexo 13 y la relación de plazos de vencimiento con necesidades de liquidez", ["Las comisiones por operación de cada promotor", "Los horarios de la mesa de operación", "El calendario de capacitación PLD"], "El Consejo fija los límites cuantitativos de compra y venta de valores del Anexo 13 y la relación entre plazos de vencimiento y necesidades de liquidez del cliente.", "Servicios de Inversión AMIB · 2.1 Funciones del Consejo de Administración", null], ["si.s2", "Las políticas y lineamientos de servicios de inversión, así como sus modificaciones, se presentan a la CNBV en un plazo de:", "10 días hábiles", ["5 días naturales", "20 días hábiles", "30 días naturales"], "Las políticas y sus modificaciones deben presentarse a la Comisión dentro de los 10 días hábiles.", "Servicios de Inversión AMIB · 2.2 Políticas y Lineamientos en Servicios de Inversión", null], ["si.s2", "El análisis de los productos a ofrecer, conforme a las políticas aprobadas, debe considerar:", "Su complejidad y el servicio asesorado a proporcionar", ["Solo la comisión que genera a la entidad", "La antigüedad del emisor en el mercado", "El número de clientes potenciales"], "Las políticas deben permitir analizar los productos para determinar su perfil, considerando su complejidad y el tipo de servicio asesorado que se vaya a proporcionar.", "Servicios de Inversión AMIB · 2.2 Políticas y Lineamientos en Servicios de Inversión", null], ["si.s2", "La compensación del Responsable de Supervisión del Cumplimiento:", "No puede depender del volumen de venta de productos", ["Debe estar ligada al volumen de venta de productos para alinear incentivos", "La fija el área de promoción", "Depende de los resultados de la mesa de dinero"], "Art. 21 y Anexo 9: independencia absoluta. Es designado por el Consejo y sus compensaciones no pueden depender del volumen de venta de productos.", "Servicios de Inversión AMIB · 2.3 El Responsable de Supervisión del Cumplimiento", null], ["si.s2", "El Responsable de Supervisión tiene estrictamente prohibido:", "Participar en la estructuración de productos financieros o en la promoción de servicios de inversión", ["Revisar grabaciones telefónicas", "Informar al Comité de Auditoría", "Solicitar expedientes de clientes"], "Existe incompatibilidad de funciones: no puede participar en la estructuración de productos ni en la promoción de servicios de inversión.", "Servicios de Inversión AMIB · 2.3 El Responsable de Supervisión del Cumplimiento", null], ["si.s2", "El Responsable de Supervisión reporta directamente a:", "El Consejo de Administración o el Comité de Auditoría", ["El director de promoción", "La AMIB", "El Comité de Análisis de Productos"], "Su deber de reporte es directo hacia el Consejo de Administración o el Comité de Auditoría, sobre anomalías y cumplimiento. Además tiene acceso completo a expedientes, bitácoras y grabaciones.", "Servicios de Inversión AMIB · 2.3 El Responsable de Supervisión del Cumplimiento", null], ["si.s3", "La difusión de reportes de análisis o recomendaciones debe hacerse:", "Simultáneamente a todos los clientes de una misma lista, mediante controles informáticos", ["Primero a los clientes sofisticados y después al resto", "Cuando el promotor considere oportuno", "Solo por escrito y en papel"], "Art. 25: procedimientos de difusión simultánea, con controles informáticos que aseguren la entrega al mismo tiempo a todos los clientes de una lista.", "Servicios de Inversión AMIB · 3.1 Obligaciones Generales de Difusión e Información", null], ["si.s3", "Las listas de clientes a disposición de la CNBV deben desglosar:", "Nombre y número de cuenta, tipo de cliente (sofisticado o no) y tipo de servicio contratado por cuenta", ["Solo el saldo de cada cuenta", "El rendimiento obtenido por cada cliente", "Las comisiones cobradas por promotor"], "La base de datos dinámica debe desglosar nombre y número de cuenta, tipo de cliente (sofisticado o no) y tipo de servicio contratado por cuenta.", "Servicios de Inversión AMIB · 3.1 Obligaciones Generales de Difusión e Información", null], ["si.s3", "Respecto de los clientes referidos a entidades financieras del exterior, la entidad debe:", "Llevar un registro estricto y auditable de dichos referidos", ["Abstenerse de referirlos", "Solicitar autorización previa de Banxico", "Cobrarles una comisión adicional"], "Debe llevarse un registro estricto y auditable de los clientes referidos a entidades financieras del exterior para apertura de cuentas internacionales.", "Servicios de Inversión AMIB · 3.1 Obligaciones Generales de Difusión e Información", null], ["si.s3", "La Guía de Servicios de Inversión es un documento:", "Precontractual obligatorio, entregado físicamente o puesto a disposición vía internet a clientes potenciales", ["Contractual, que se firma junto con el contrato", "Interno, para uso exclusivo del personal", "Que solo se entrega si el cliente lo solicita"], "Art. 24 y Anexo 10: documento PRECONTRACTUAL obligatorio, entregado físicamente o puesto a disposición vía internet a los clientes potenciales, con constancia de entrega firmada antes de operar.", "Servicios de Inversión AMIB · 3.2 La Guía de Servicios de Inversión", null], ["si.s3", "¿Cuál de estos NO es contenido mínimo de la Guía de Servicios de Inversión?", "El perfil de inversión del cliente ya evaluado", ["Desglose detallado de los servicios ofrecidos", "Diferencias de riesgos entre ejecución y asesoría", "Catálogo de costos y tarifas máximas y folios de registro CNBV"], "El Anexo 10 exige servicios ofrecidos, diferencias de riesgo entre ejecución y asesoría, catálogo de costos y tarifas máximas y folios de registro CNBV. El perfil del cliente es un documento distinto (Anexo 3).", "Servicios de Inversión AMIB · 3.2 La Guía de Servicios de Inversión", null], ["si.s3", "Sobre los asesores externos, la Guía debe señalar de forma destacada que:", "La inscripción del asesor NO garantiza la exactitud de sus análisis ni el cumplimiento de las leyes", ["La inscripción del asesor garantiza la calidad de sus análisis", "Los asesores externos están prohibidos", "La entidad responde por sus recomendaciones"], "La Guía debe advertir de forma destacada que la inscripción del asesor no garantiza la exactitud de sus análisis ni el cumplimiento de las leyes.", "Servicios de Inversión AMIB · 3.2 La Guía de Servicios de Inversión", null], ["si.s3", "El plazo mínimo de conservación de archivos de voz, correos, documentos firmados y registros de órdenes es de:", "5 años", ["2 años", "3 años", "10 años"], "Art. 26 y Anexo 11: todos esos registros deben conservarse por un plazo mínimo de 5 años y forman parte de la contabilidad legal del intermediario.", "Servicios de Inversión AMIB · 3.3 Registro de Recomendaciones e Instrucciones (Bitácora)", null], ["si.s3", "Para grabar las conversaciones telefónicas de toma de instrucciones se requiere:", "Autorización expresa y firmada del cliente", ["Nada, es potestativo de la entidad", "Autorización previa de la CNBV", "Solo un aviso verbal al inicio de la llamada"], "La grabación de las llamadas de toma de instrucciones es obligatoria, y requiere autorización expresa y firmada del cliente para grabar su voz.", "Servicios de Inversión AMIB · 3.3 Registro de Recomendaciones e Instrucciones (Bitácora)", null], ["si.s3", "La bitácora de recomendaciones e instrucciones:", "Forma parte de la contabilidad legal del intermediario", ["Es un registro opcional de control interno", "Solo se integra para clientes sofisticados", "Se destruye al cierre de la cuenta"], "Los registros de la bitácora se integran a la contabilidad legal del intermediario, por lo que quedan sujetos a las reglas de conservación y revisión.", "Servicios de Inversión AMIB · 3.3 Registro de Recomendaciones e Instrucciones (Bitácora)", null], ["si.s3", "Respecto de las cuentas de sus clientes, los promotores y apoderados:", "Tienen estrictamente prohibido ser cotitulares", ["Pueden ser cotitulares si el cliente lo autoriza por escrito", "Pueden serlo solo en cuentas discrecionales", "Pueden serlo si son familiares del cliente"], "Arts. 32, 33 y 40: prohibición de cotitularidad. Promotores, apoderados, operadores y asesores externos no pueden ser cotitulares de las cuentas de intermediación de sus clientes.", "Servicios de Inversión AMIB · 3.4 Prohibiciones de las Entidades y Asesores de Inversión", null], ["si.s3", "Emitir juicios de valor u opiniones que inviten a decidir, a un cliente que solo contrató ejecución o comercialización:", "Está prohibido", ["Está permitido si se advierte que es opinión personal", "Está permitido si se registra en la bitácora", "Está permitido si el cliente es sofisticado"], "Está prohibido emitir juicios de valor, opiniones o expresiones que inviten a tomar decisiones a clientes de ejecución o comercialización: eso sería asesoría no contratada.", "Servicios de Inversión AMIB · 3.4 Prohibiciones de las Entidades y Asesores de Inversión", null], ["si.s3", "Inducir al cliente a modificar sus respuestas del cuestionario de perfilamiento para que 'encaje' con un producto:", "Está prohibido: es manipulación del perfil", ["Es una práctica comercial aceptada", "Es válido si el cliente firma", "Es válido si mejora el rendimiento esperado"], "Está prohibido manipular o inducir artificialmente al cliente a modificar sus respuestas del cuestionario de perfilamiento.", "Servicios de Inversión AMIB · 3.4 Prohibiciones de las Entidades y Asesores de Inversión", null], ["si.s3", "Existe conflicto de interés cuando:", "La entidad, sus directivos o empleados pueden obtener un beneficio financiero o evitar una pérdida en detrimento del cliente", ["El cliente pierde dinero en una operación", "El promotor recomienda un fondo de deuda", "El cliente reclama ante CONDUSEF"], "Art. 36: conflicto de interés es toda circunstancia en que la entidad, sus directivos o empleados puedan obtener un beneficio financiero o evitar una pérdida en detrimento del cliente.", "Servicios de Inversión AMIB · 3.5 Concepto de Conflicto de Interés y Presunciones", null], ["si.s3", "Se presume conflicto de interés, salvo prueba en contrario, cuando la entidad:", "Obtiene ingresos de terceros por la distribución de valores complejos sin revelarlo previamente por escrito al cliente", ["Cobra comisiones al cliente", "Recomienda valores gubernamentales", "Publica reportes de análisis"], "La presunción opera si la entidad obtiene ingresos de terceros por distribuir valores complejos sin haberlo revelado por escrito al cliente ANTES de la operación.", "Servicios de Inversión AMIB · 3.5 Concepto de Conflicto de Interés y Presunciones", null], ["si.s3", "Ante un conflicto de interés no resuelto, la obligación es:", "Abstenerse de realizar la operación u ofrecer la recomendación", ["Revelarlo después de la operación", "Cobrar una comisión menor", "Solicitar autorización a la CNBV"], "Deber de abstención: obligación ética y legal de abstenerse de realizar operaciones u ofrecer recomendaciones bajo un conflicto de interés no resuelto.", "Servicios de Inversión AMIB · 3.5 Concepto de Conflicto de Interés y Presunciones", null], ["si.s3", "El límite de tenencia de instrumentos emitidos por la propia entidad o su grupo, entre todos los clientes no sofisticados, es:", "20% del total de la emisión", ["10% del total de la emisión", "30% del total de la emisión", "No existe límite si se revela el conflicto"], "Arts. 37 y 38: la tenencia acumulada entre todos los clientes no sofisticados no puede exceder el 20% del total de la emisión.", "Servicios de Inversión AMIB · 3.6 Obligaciones en Casos de No Independencia", null], ["si.s3", "Antes de recomendar papel propio o del mismo grupo financiero, la entidad debe:", "Informar expresamente al cliente su carácter de 'No Independiente'", ["Obtener la firma del Formato A", "Esperar 6 meses desde la colocación", "Reducir la comisión a la mitad"], "Deber de revelación: debe informarse expresamente al cliente el carácter de No Independiente antes de formular cualquier recomendación sobre papel propio.", "Servicios de Inversión AMIB · 3.6 Obligaciones en Casos de No Independencia", null], ["si.s3", "¿Cuál de estas conductas es contraria a los sanos usos bursátiles?", "Revelar información que induzca al error sobre riesgos, comisiones o estimaciones de rendimientos futuros", ["Entregar el prospecto de colocación al cliente", "Actualizar el perfil del cliente cada año", "Grabar las instrucciones telefónicas"], "Arts. 40 y 41: la información engañosa sobre riesgos, comisiones, costos o rendimientos futuros es una falta administrativa sancionable con multas y suspensión de licencias.", "Servicios de Inversión AMIB · 3.7 Conductas Contrarias a los Sanos Usos Bursátiles", null], ["si.s3", "Realizar operaciones en cuentas discrecionales que violan sistemáticamente los límites de diversificación del Art. 6 o del MGA:", "Constituye una conducta contraria a los sanos usos bursátiles", ["Es admisible si mejora el rendimiento", "Solo requiere aviso posterior al cliente", "Es válido con autorización verbal del cliente"], "Las operaciones no razonables que violan sistemáticamente los límites de diversificación o del MGA son faltas administrativas sancionables.", "Servicios de Inversión AMIB · 3.7 Conductas Contrarias a los Sanos Usos Bursátiles", null], ["si.s3", "Omitir en un reporte de análisis la tenencia accionaria del analista o el cobro de comisiones del emisor:", "Constituye ocultación de conflictos y es sancionable", ["Es aceptable si el reporte es gratuito", "Solo se revela a clientes sofisticados", "Es facultativo según la política interna"], "La ocultación de conflictos —tenencia accionaria del analista o comisiones cobradas al emisor— es una conducta contraria a los sanos usos bursátiles.", "Servicios de Inversión AMIB · 3.7 Conductas Contrarias a los Sanos Usos Bursátiles", null], ["si.s3", "La información de operaciones y saldos del cliente solo puede revelarse a:", "El titular, sus representantes o la autoridad competente", ["Cualquier área de la entidad que la solicite", "Los analistas de la entidad", "Otros clientes con posiciones similares"], "Secreto bursátil: la información de operaciones y saldos es confidencial y solo puede revelarse al titular, sus representantes o a la autoridad competente.", "Servicios de Inversión AMIB · 3.8 Confidencialidad y Secreto Bursátil", null], ["si.s3", "Las barreras de información entre áreas de negocio y de análisis sirven para:", "Evitar filtraciones de información y conflictos de interés", ["Acelerar la difusión de recomendaciones", "Reducir costos operativos", "Cumplir con la Ley de Ingresos"], "Los controles internos establecen barreras de información (murallas chinas) entre áreas de negocio y de análisis, para evitar filtraciones y conflictos.", "Servicios de Inversión AMIB · 3.8 Confidencialidad y Secreto Bursátil", null], ["si.s3", "El uso de información privilegiada:", "Está prohibido: no puede usarse ni transmitirse información no pública relevante para obtener beneficios propios o de terceros", ["Está permitido para el analista que la generó", "Se permite si se revela después", "Solo aplica a emisoras extranjeras"], "Se prohíbe usar o transmitir información no pública relevante para obtener beneficios propios o de terceros.", "Servicios de Inversión AMIB · 3.8 Confidencialidad y Secreto Bursátil", null], ["si.s3", "En materia de PLD/FT, antes de operar con un cliente se debe:", "Integrar expediente, verificar identidad y determinar su grado de riesgo", ["Únicamente pedir una identificación oficial", "Reportar la apertura a la CNBV", "Solicitar una carta del contador del cliente"], "Identificación y conocimiento del cliente: integrar expediente, verificar identidad y determinar el grado de riesgo antes de operar.", "Servicios de Inversión AMIB · 3.9 Prevención de Lavado de Dinero", null], ["si.s3", "Al detectar una operación inusual, el intermediario debe:", "Informar a la autoridad a través del área de cumplimiento, en los plazos establecidos y sin alertar al cliente", ["Avisar al cliente para que la aclare", "Cancelar la cuenta de inmediato", "Esperar a la revisión anual"], "Los reportes se presentan a la autoridad a través del área de cumplimiento en los plazos establecidos, SIN alertar al cliente (prohibición de tipping-off).", "Servicios de Inversión AMIB · 3.9 Prevención de Lavado de Dinero", null], ["si.s3", "La capacitación del personal en materia de PLD/FT es:", "Anual y obligatoria", ["Voluntaria", "Cada tres años", "Solo para el área de cumplimiento"], "La capacitación en PLD/FT es anual y obligatoria para el personal, y deben conservarse los registros por el plazo legal.", "Servicios de Inversión AMIB · 3.9 Prevención de Lavado de Dinero", null], ["si.s3", "Ante el incumplimiento, la CNBV puede imponer:", "Multas, amonestaciones, suspensión o revocación del registro del personal y de la entidad", ["Únicamente amonestaciones privadas", "Solo sanciones penales", "Solo la devolución de comisiones"], "Las sanciones administrativas incluyen multas, amonestaciones, suspensión o revocación del registro del personal y de la entidad.", "Servicios de Inversión AMIB · 3.10 Sanciones, Responsabilidades y Reclamaciones", null], ["si.s3", "Las reclamaciones del cliente pueden presentarse:", "Ante la unidad especializada de la entidad o ante la CONDUSEF", ["Solo ante la entidad", "Solo ante la CNBV", "Solo ante un juez civil"], "La entidad debe contar con unidad especializada para atender quejas; el cliente también puede acudir a la CONDUSEF.", "Servicios de Inversión AMIB · 3.10 Sanciones, Responsabilidades y Reclamaciones", null], ["si.s3", "Ante una controversia con el cliente, la mejor defensa de la entidad es:", "La bitácora de recomendaciones, el perfilamiento y la documentación de soporte", ["La antigüedad de la relación comercial", "El rendimiento histórico del portafolio", "La opinión del Comité de Análisis"], "La evidencia —bitácora de recomendaciones, perfilamiento y documentación— es lo que soporta la actuación de la entidad ante una controversia.", "Servicios de Inversión AMIB · 3.10 Sanciones, Responsabilidades y Reclamaciones", null], ["si.s3", "El promotor responde personalmente por:", "Recomendaciones no razonables, operaciones no instruidas o registros incompletos", ["Las pérdidas de mercado del portafolio", "La calificación crediticia del emisor", "La volatilidad del tipo de cambio"], "La responsabilidad del personal se activa por recomendaciones no razonables, operaciones no instruidas por el cliente o registros incompletos.", "Servicios de Inversión AMIB · 3.10 Sanciones, Responsabilidades y Reclamaciones", null], ["si.s4", "Solo pueden cobrarse comisiones por:", "Los conceptos expresamente convenidos por escrito en el contrato y por servicios efectivamente prestados", ["Cualquier servicio que la entidad considere prestado", "Los conceptos publicados en la página de internet", "Los servicios que el promotor informe verbalmente"], "Arts. 42 a 44, criterio de efectividad: solo por conceptos expresamente convenidos por escrito en el contrato y por servicios efectivamente prestados.", "Servicios de Inversión AMIB · 4.1 Criterios para el Cobro de Comisiones", null], ["si.s4", "Las comisiones deben fijarse bajo condiciones objetivas tales como:", "Monto, perfil, volumen y frecuencia, prohibiendo la discriminación injustificada de precios", ["La rentabilidad obtenida por el cliente", "La antigüedad del promotor", "El sector de actividad del cliente"], "Basificación objetiva: monto, perfil, volumen y frecuencia. Queda prohibida la discriminación injustificada de precios entre clientes.", "Servicios de Inversión AMIB · 4.1 Criterios para el Cobro de Comisiones", null], ["si.s4", "La tarifa cobrada debe coincidir de forma idéntica con:", "El desglose del estado de cuenta mensual y los límites máximos informados en la Guía de Servicios", ["El promedio del mercado", "El presupuesto anual de la entidad", "La comisión de la bolsa"], "Consistencia informativa: la tarifa cobrada debe coincidir con el desglose del estado de cuenta mensual y con los límites máximos publicados en la Guía de Servicios.", "Servicios de Inversión AMIB · 4.1 Criterios para el Cobro de Comisiones", null], ["si.s4", "Un esquema de comisiones que premia al promotor por colocar el producto más caro sin importar la idoneidad:", "Vulnera el principio de no comprometer el interés del cliente", ["Es válido si el cliente firma el contrato", "Es válido si se revela en el estado de cuenta", "Requiere solo autorización del Comité de Análisis"], "Las comisiones no deben inducir al promotor a actuar contra el interés del cliente; ese es uno de los criterios expresos de los Arts. 42 a 44.", "Servicios de Inversión AMIB · 4.1 Criterios para el Cobro de Comisiones", null], ["si.s5", "Los analistas deben trabajar en áreas:", "Aisladas física y funcionalmente de intermediación por cuenta propia y finanzas corporativas", ["Integradas a la mesa de dinero para tener información oportuna", "Dentro del área de promoción", "Bajo la supervisión directa del área comercial"], "Arts. 46 a 48: separación física y funcional de los analistas respecto de las áreas de intermediación por cuenta propia y finanzas corporativas.", "Servicios de Inversión AMIB · 5.1 Independencia y Controles en los Reportes de Análisis", null], ["si.s5", "La remuneración variable del analista:", "No puede depender directamente de transacciones de colocación o banca de inversión específicas", ["Puede depender de las colocaciones que él impulse", "Debe fijarla el emisor cubierto", "Se determina por el volumen operado por los clientes"], "Se prohíbe que el sueldo o los bonos del analista dependan directamente de transacciones de colocación o de banca de inversión específicas.", "Servicios de Inversión AMIB · 5.1 Independencia y Controles en los Reportes de Análisis", null], ["si.s5", "Conforme al Anexo 15, cada reporte de análisis debe revelar de forma destacada:", "Si el analista tiene tenencia de acciones de la emisora o si el intermediario recibió comisiones del emisor en los últimos 12 meses", ["El rendimiento esperado garantizado", "La lista de clientes que lo recibirán", "El precio objetivo de los competidores"], "Revelación obligatoria del Anexo 15: tenencia accionaria del analista en la emisora y comisiones recibidas del emisor por el intermediario en los últimos 12 meses.", "Servicios de Inversión AMIB · 5.1 Independencia y Controles en los Reportes de Análisis", null], ["si.s5", "El periodo de revelación de comisiones recibidas del emisor en los reportes de análisis es de:", "12 meses", ["6 meses", "24 meses", "5 años"], "Debe revelarse si el intermediario financiero recibió comisiones del emisor en los últimos 12 meses.", "Servicios de Inversión AMIB · 5.1 Independencia y Controles en los Reportes de Análisis", null], ["fi.s1", "Jurídicamente, un fondo de inversión es:", "Una sociedad anónima de capital variable autorizada por la CNBV", ["Un fideicomiso de administración autorizado por Banco de México", "Una asociación en participación regulada por la LMV", "Un contrato de intermediación bursátil"], "LFI arts. 5 y 8: los fondos de inversión son sociedades anónimas de capital variable autorizadas por la CNBV.", "Tema 2 · Fondos de Inversión · 1.1 Fondo de inversión: definición y objeto exclusivo", null], ["fi.s1", "El objeto exclusivo del fondo de inversión consiste en:", "Adquirir y vender habitual y profesionalmente Activos Objeto de Inversión con recursos de la colocación de sus acciones a persona indeterminada", ["Recibir depósitos de dinero del público para invertirlos", "Otorgar créditos garantizados con valores", "Asesorar a terceros en la compra de valores"], "El objeto exclusivo es adquirir y vender habitual y profesionalmente Activos Objeto de Inversión con recursos provenientes de la colocación de sus acciones a persona indeterminada, mediante servicios de intermediación financiera. Recibir depósitos de dinero está prohibido (art. 18).", "Tema 2 · Fondos de Inversión · 1.1 Fondo de inversión: definición y objeto exclusivo", null], ["fi.s1", "La autorización de la CNBV a un fondo de inversión:", "No certifica solvencia, liquidez, calidad crediticia ni desempeño futuro", ["Certifica la calidad crediticia de su cartera", "Garantiza un rendimiento mínimo al inversionista", "Equivale a una calificación AAA"], "La ley es expresa: la autorización no certifica solvencia, liquidez, calidad crediticia ni desempeño futuro.", "Tema 2 · Fondos de Inversión · 1.1 Fondo de inversión: definición y objeto exclusivo", null], ["fi.s1", "El socio fundador de un fondo de inversión debe ser:", "Una sociedad operadora de fondos de inversión", ["Una institución de crédito", "Una casa de bolsa", "Cualquier persona moral con capital suficiente"], "LFI art. 8 Bis: el socio fundador debe ser una sociedad operadora de fondos de inversión, y es quien suscribe el capital fijo.", "Tema 2 · Fondos de Inversión · 1.2 Características como sociedad anónima de capital variable", null], ["fi.s1", "¿Cuál de estos órganos NO tienen los fondos de inversión?", "Asamblea de accionistas, consejo de administración y comisario", ["Únicamente el comisario", "Únicamente la asamblea de accionistas", "Tienen todos los órganos de una sociedad anónima ordinaria"], "Los fondos no cuentan con asamblea de accionistas, consejo de administración ni comisario. Sus decisiones las toma el consejo de administración de la operadora que los administ
