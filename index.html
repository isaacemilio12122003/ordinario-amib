dez y mercado) y no discrecionales (operativo, tecnológico, legal y ASG).", "Tema 2 · Fondos de Inversión · 5.1 Riesgos cuantificables", null], ["fi.s5", "¿Cuáles son los tres riesgos discrecionales?", "Crédito, liquidez y mercado", ["Operativo, tecnológico y legal", "Mercado, operativo y sistémico", "Crédito, legal y ASG"], "DCG art. 119-I-a: los riesgos discrecionales resultan de tomar una posición de riesgo y son crédito, liquidez y mercado.", "Tema 2 · Fondos de Inversión · 5.2 Riesgos discrecionales", null], ["fi.s5", "La pérdida potencial por la venta anticipada o forzosa de activos a descuentos inusuales corresponde al riesgo de:", "Liquidez", ["Crédito", "Mercado", "Operativo"], "Riesgo de liquidez: pérdida potencial por venta anticipada o forzosa a descuentos inusuales, o porque una posición no pueda ser oportunamente enajenada, adquirida o cubierta con una posición contraria equivalente.", "Tema 2 · Fondos de Inversión · 5.2 Riesgos discrecionales", null], ["fi.s5", "La pérdida potencial por falta de pago de un emisor o contraparte corresponde al riesgo de:", "Crédito", ["Mercado", "Liquidez", "Legal"], "Riesgo de crédito: pérdida potencial por la falta de pago de un emisor o contraparte, incluyendo las garantías reales o personales y cualquier otro mecanismo de mitigación.", "Tema 2 · Fondos de Inversión · 5.2 Riesgos discrecionales", null], ["fi.s5", "La pérdida potencial por movimientos de precios, tasas de interés, tipos de cambio o índices corresponde al riesgo de:", "Mercado", ["Crédito", "Liquidez", "Tecnológico"], "Riesgo de mercado: pérdida potencial ante cambios en los factores de riesgo que inciden en la valuación o los resultados esperados, como precios, tasas, tipos de cambio o índices de precios.", "Tema 2 · Fondos de Inversión · 5.2 Riesgos discrecionales", null], ["fi.s5", "¿Cuáles son los cuatro riesgos no discrecionales?", "Operativo, tecnológico, legal y ASG", ["Crédito, liquidez, mercado y sistémico", "Operativo, legal, sistémico y reputacional", "Mercado, operativo, legal y de contraparte"], "DCG art. 119-I-b: operativo, tecnológico, legal y ASG. No nacen de tomar una posición de inversión, pero pueden afectar el patrimonio y la operación del fondo.", "Tema 2 · Fondos de Inversión · 5.3 Riesgos no discrecionales", null], ["fi.s5", "Las fallas de controles, procesos o transmisión de información NO atribuibles a tecnología corresponden al riesgo:", "Operativo", ["Tecnológico", "Legal", "De mercado"], "Riesgo operativo: fallas de controles, procesos o transmisión de información no atribuibles a tecnología. Si el origen es hardware, software, redes o canales, es riesgo tecnológico.", "Tema 2 · Fondos de Inversión · 5.3 Riesgos no discrecionales", null], ["fi.s5", "Las resoluciones desfavorables y las sanciones por incumplimiento normativo corresponden al riesgo:", "Legal", ["Operativo", "Tecnológico", "No cuantificable"], "Riesgo legal: incumplimiento normativo, resoluciones desfavorables o sanciones. Es un riesgo cuantificable no discrecional.", "Tema 2 · Fondos de Inversión · 5.3 Riesgos no discrecionales", null], ["fi.s5", "Las afectaciones materiales por acontecimientos ambientales, sociales o de gobernanza corresponden al riesgo:", "ASG, clasificado como cuantificable no discrecional", ["Sistémico", "De mercado", "No cuantificable"], "El riesgo ASG es un riesgo cuantificable NO discrecional (art. 119-I-b-4), incorporado con la reforma vigente desde el 08-08-2026.", "Tema 2 · Fondos de Inversión · 5.3 Riesgos no discrecionales", null], ["fi.s5", "Los riesgos no cuantificables son aquellos:", "Derivados de eventos imprevistos para los cuales no se puede conformar una base estadística que permita medir las pérdidas potenciales", ["Que la CNBV exime de medición por su baja probabilidad", "Que sólo afectan a fondos de cobertura", "Que se cubren obligatoriamente con derivados"], "DCG art. 119-II: derivan de eventos imprevistos sin base estadística para medir pérdidas potenciales. El ejemplo típico es el riesgo sistémico.", "Tema 2 · Fondos de Inversión · 5.4 Riesgos no cuantificables", null], ["fi.s5", "El ejemplo típico de riesgo no cuantificable que da la norma es:", "El riesgo sistémico", ["El riesgo operativo", "El riesgo de contraparte", "El riesgo de liquidez"], "El ejemplo que menciona expresamente la disposición es el riesgo sistémico.", "Tema 2 · Fondos de Inversión · 5.4 Riesgos no cuantificables", null], ["fi.s5", "El responsable de la Administración Integral de Riesgos debe:", "Identificar, medir, vigilar e informar los riesgos cuantificables que enfrentan los fondos", ["Decidir la composición de la cartera", "Aprobar el prospecto", "Calcular el precio por acción"], "DCG art. 123: identificar, medir, vigilar e informar los riesgos CUANTIFICABLES que enfrentan los fondos de renta variable y de deuda a los que la operadora presta servicios de administración de activos.", "Tema 2 · Fondos de Inversión · 5.5 Responsable de la Administración Integral de Riesgos", null], ["fi.s5", "El responsable de la UAIR debe ser independiente de:", "Las unidades de negocios", ["El consejo de administración", "El contralor normativo", "La CNBV"], "Será independiente de las unidades de negocios, a fin de evitar conflictos de interés y asegurar una adecuada separación de responsabilidades.", "Tema 2 · Fondos de Inversión · 5.5 Responsable de la Administración Integral de Riesgos", null], ["fi.s5", "Los límites globales y específicos de exposición al riesgo son aprobados por:", "El consejo de administración de la sociedad operadora, a propuesta del responsable de la AIR", ["El responsable de la AIR", "La CNBV", "El contralor normativo"], "DCG art. 123: el responsable de la AIR los PROPONE y el consejo de administración de la operadora los APRUEBA, desglosados por fondo, tipo de activo, factor de riesgo, causa u origen.", "Tema 2 · Fondos de Inversión · 5.6 Propuestas del responsable de la AIR al consejo", null], ["fi.s5", "Entre las propuestas que el responsable de la AIR somete al consejo están:", "Los casos o circunstancias especiales en los cuales se puedan exceder los límites de exposición", ["Las órdenes de compraventa del día", "La designación del auditor externo", "El precio de valuación de cada serie"], "Propone objetivos, lineamientos y políticas de AIR; límites globales y específicos y niveles de tolerancia; mecanismos de acciones correctivas; los casos en que se puedan exceder los límites; y las metodologías, modelos y parámetros.", "Tema 2 · Fondos de Inversión · 5.6 Propuestas del responsable de la AIR al consejo", null], ["fi.s5", "El documento con información clave:", "Forma parte del prospecto y lo sintetiza, dirigiendo al inversionista a la información detallada", ["Sustituye al prospecto completo", "Es un documento interno de la operadora", "Sólo se entrega a inversionistas calificados"], "Forma parte del prospecto y resume los elementos esenciales. No lo sustituye: lo sintetiza y dirige al inversionista a la información detallada.", "Tema 2 · Fondos de Inversión · 5.7 Documento con información clave", null], ["fi.s5", "¿Cuál de estos elementos contiene el documento con información clave?", "El límite de valor en riesgo y las advertencias", ["El acta constitutiva del fondo", "La lista de accionistas", "El contrato con el proveedor de precios"], "Incluye datos generales, objetivo, horizonte, régimen y política de inversión, riesgos, límite de valor en riesgo, advertencias, rendimiento y desempeño histórico, composición de cartera, costos y comisiones y políticas de compra y venta.", "Tema 2 · Fondos de Inversión · 5.7 Documento con información clave", null], ["fi.s5", "La diversificación de una cartera:", "Puede reducir el riesgo específico, pero no elimina el riesgo de mercado, liquidez, crédito, operación ni eventos sistémicos", ["Elimina el riesgo de mercado", "Garantiza un rendimiento positivo", "Sustituye los límites de concentración"], "Puede reducir el riesgo específico cuando las exposiciones no se comportan de manera idéntica, pero no elimina mercado, liquidez, crédito, operación ni eventos sistémicos.", "Tema 2 · Fondos de Inversión · 5.8 Diversificación del riesgo", null], ["fi.s5", "Sobre la efectividad de la diversificación:", "Depende de correlaciones, concentraciones directas e indirectas y condiciones de mercado; añadir activos por sí solo no garantiza menor riesgo", ["Añadir más activos siempre reduce el riesgo", "Se mide únicamente por el número de emisores", "La determina la calificadora"], "La efectividad depende de correlaciones, concentraciones directas e indirectas y condiciones de mercado. Añadir activos por sí solo no garantiza menor riesgo.", "Tema 2 · Fondos de Inversión · 5.8 Diversificación del riesgo", null], ["fi.s5", "Al evaluar los riesgos de invertir en un fondo, la calificación debe leerse:", "Junto con cartera, categoría, horizonte, límites y documento con información clave", ["Como el único indicador relevante", "Sólo si el fondo es de deuda", "Después de la primera compra"], "La calificación es un insumo; debe leerse junto con cartera, categoría, horizonte, límites y documento con información clave.", "Tema 2 · Fondos de Inversión · 5.9 Riesgos de invertir en un fondo de inversión", null], ["fi.s5", "Una minusvalía refleja:", "Una pérdida potencial mientras no se venda, y realizada al enajenar", ["Una pérdida realizada en todos los casos", "Un cargo por comisiones", "Una baja de calificación del fondo"], "La minusvalía es la disminución del valor de la acción: refleja una pérdida potencial mientras no se venda y se realiza al enajenar.", "Tema 2 · Fondos de Inversión · 5.10 Plusvalía y minusvalía", null], ["fi.s5", "El efecto de una plusvalía o minusvalía para el cliente depende de:", "El precio y fecha de compra, la serie accionaria, las comisiones y el precio de venta", ["Únicamente del precio actual", "La calificación del fondo", "El plazo de liquidación"], "Depende del precio y fecha de compra, serie accionaria, comisiones y precio de venta. Por eso dos clientes del mismo fondo pueden tener resultados distintos.", "Tema 2 · Fondos de Inversión · 5.10 Plusvalía y minusvalía", null], ["fi.s5", "Una baja de calificación o el deterioro de un emisor de la cartera puede:", "Reducir el precio actualizado del instrumento y generar minusvalía en el fondo", ["Elevar el precio actualizado del instrumento", "No tener efecto alguno en el fondo", "Obligar a liquidar el fondo"], "Puede reducir el precio actualizado del instrumento y generar minusvalía. El impacto depende del peso del emisor, plazo, recuperación esperada, liquidez y concentración de la cartera.", "Tema 2 · Fondos de Inversión · 5.11 Evento de crédito y su efecto en el precio", null], ["fi.s5", "Una mejora crediticia de un emisor de la cartera:", "Puede reducir la prima de riesgo y elevar el valor, generando plusvalía, pero no es automática", ["Eleva el valor del instrumento de forma automática", "No afecta el precio del fondo", "Obliga a vender la posición"], "Puede reducir la prima de riesgo y elevar el valor del instrumento, generando plusvalía; la norma aclara que no es automática.", "Tema 2 · Fondos de Inversión · 5.11 Evento de crédito y su efecto en el precio", null], ["fi.s5", "Si las tasas suben, ¿por qué baja el precio de un instrumento de tasa fija?", "Porque los flujos existentes se descuentan a una tasa mayor", ["Porque el emisor deja de pagar cupones", "Porque se reduce el plazo del instrumento", "Porque aumenta la comisión de administración"], "Si las tasas suben, los flujos existentes se descuentan a una tasa mayor: baja el precio y puede surgir una minusvalía.", "Tema 2 · Fondos de Inversión · 5.12 Tasas de interés: por qué un fondo de deuda gana o pierde valor", null], ["fi.s5", "La magnitud del efecto de las tasas sobre el precio depende principalmente de:", "La duración, y además de plazo, cupón, crédito, liquidez, convexidad y costos", ["El número de accionistas del fondo", "La serie accionaria", "La calificación de la operadora"], "La magnitud depende de la duración y de otros factores: plazo, cupón, crédito, liquidez, convexidad y costos.", "Tema 2 · Fondos de Inversión · 5.12 Tasas de interés: por qué un fondo de deuda gana o pierde valor", null], ["fi.s5", "¿Por qué la variación de un fondo indizado puede no ser idéntica a la de su índice?", "Porque influyen efectivo, deuda, derivados, concentración, costos, comisiones y error de seguimiento", ["Porque el índice se calcula mensualmente", "Porque el fondo valúa cada semana", "Porque el índice no es público"], "Influyen efectivo, deuda, derivados, concentración, costos, comisiones y error de seguimiento. El resultado real surge de la valuación diaria de todos los activos y pasivos y de los derechos económicos de cada serie.", "Tema 2 · Fondos de Inversión · 5.13 Renta variable: el impacto depende de la exposición efectiva", null], ["fi.s5", "En una cartera con exposición neta larga a dólares, la apreciación del peso:", "Tiende a reducir el valor en pesos y puede generar minusvalía", ["Tiende a elevar el valor en pesos y genera plusvalía", "No produce efecto", "Elimina el riesgo de mercado"], "La apreciación del peso tiende a reducir el valor en pesos de la exposición en dólares y puede generar minusvalía; la depreciación tiende a elevarlo.", "Tema 2 · Fondos de Inversión · 5.14 Tipo de cambio: apreciación y depreciación del peso", null], ["fi.s5", "El efecto del tipo de cambio sobre la cartera puede cambiar si:", "La exposición está cubierta con derivados o existen pasivos en la misma moneda", ["El fondo es de renta variable", "El fondo tiene más de una serie", "La calificación del fondo mejora"], "El efecto puede cambiar si la exposición está cubierta con derivados o si existen pasivos en la misma moneda. También influyen tasas, crédito, liquidez, costos y la eficacia de la cobertura.", "Tema 2 · Fondos de Inversión · 5.14 Tipo de cambio: apreciación y depreciación del peso", null], ["mn.sup", "Conforme a la Ley del Mercado de Valores, ¿cuál es la PRIMERA fuente supletoria?", "La legislación mercantil", ["Los usos bursátiles y mercantiles", "La legislación civil federal", "Las disposiciones de carácter general de la CNBV"], "El art. 5 de la LMV fija el orden: 1) legislación mercantil, 2) usos bursátiles y mercantiles, 3) legislación civil federal.", "LMV art. 5 · láminas 2–3", null], ["mn.sup", "¿Cuál es el orden correcto de supletoriedad de la LMV?", "Legislación mercantil, usos bursátiles y mercantiles, legislación civil federal", ["Usos bursátiles y mercantiles, legislación mercantil, legislación civil federal", "Legislación civil federal, legislación mercantil, usos bursátiles y mercantiles", "Legislación mercantil, legislación civil federal, usos bursátiles y mercantiles"], "Truco: “Mercantil – Usos – Civil” (M-U-C). Los usos van en medio, antes que lo civil.", "LMV art. 5", null], ["mn.sup", "Los usos bursátiles y mercantiles se aplican supletoriamente a la LMV en:", "Segundo lugar", ["Primer lugar", "Tercer lugar", "Solo cuando lo autorice la CNBV"], "Primero la legislación mercantil, en segundo lugar los usos y en tercero la legislación civil federal.", "LMV art. 5", null], ["mn.sup", "La legislación civil federal se aplica supletoriamente a la LMV en:", "Tercer lugar", ["Primer lugar", "Segundo lugar", "No es fuente supletoria de la LMV"], "Es la última fuente supletoria, después de la mercantil y de los usos.", "LMV art. 5", null], ["mn.sup", "¿Quién interpreta, para efectos administrativos, la Ley del Mercado de Valores?", "El Ejecutivo Federal, por conducto de la SHCP", ["La CNBV", "El Banco de México", "La Bolsa Mexicana de Valores"], "La interpretación administrativa corresponde a la SHCP, no a la CNBV (que supervisa y regula).", "LMV art. 5 · lámina 24", null], ["mn.sup", "Son ejemplos de legislación mercantil que suple a la LMV:", "La Ley General de Títulos y Operaciones de Crédito y la Ley General de Sociedades Mercantiles", ["El Código Civil Federal y el Código Fiscal de la Federación", "La Ley de Fondos de Inversión y la Ley de la CNBV", "Los reglamentos interiores de las bolsas"], "La LGTOC y la LGSM son la legislación mercantil general que se aplica primero de forma supletoria.", "Lámina 3", null], ["mn.sup", "Dentro del marco normativo, la Ley del Mercado de Valores y la Ley de Fondos de Inversión se clasifican como:", "Leyes especiales", ["Leyes generales", "Disposiciones de carácter general", "Circulares de Banco de México"], "Leyes especiales: LMV, LFI, Ley de la CNBV y Ley de la CONDUSEF. Leyes generales: LGTOC y LGSM.", "Lámina 30", null], ["mn.sup", "La Circular Única para Casas de Bolsa y la Circular Única de Emisoras son:", "Disposiciones de carácter general emitidas por la CNBV", ["Leyes especiales aprobadas por el Congreso", "Circulares de la SHCP", "Reglamentos interiores de la BMV"], "Las circulares únicas son disposiciones de carácter general de la CNBV (casas de bolsa, emisoras, fondos, instituciones de crédito).", "Lámina 30", null], ["mn.sup", "Las disposiciones de carácter general aplicables a las bolsas de valores desarrollan principalmente:", "La organización y operación de las bolsas", ["La recepción y asignación de órdenes de las casas de bolsa", "Las penas por uso de información privilegiada", "La defensa del usuario ante la CONDUSEF"], "Las de casas de bolsa regulan órdenes, controles y riesgos; las de bolsas regulan la organización y operación de las bolsas.", "Lámina 30", null], ["mn.sup", "Las disposiciones de carácter general aplicables a las casas de bolsa desarrollan, entre otros temas:", "Recepción y asignación de órdenes, controles, riesgos y obligaciones prudenciales", ["Los requisitos de listado de cada bolsa", "El orden de supletoriedad de la LMV", "Las funciones de la CONSAR"], "Además remiten a disposiciones separadas de servicios de inversión, emisoras, SIC y PLD/FT.", "Disposiciones casas de bolsa art. 213 · lámina 30", null], ["mn.sup", "¿Qué regula la Ley del Mercado de Valores?", "Emisoras, ofertas, intermediarios, asesores, bolsas, depósitos, información, supervisión y sanciones", ["Únicamente a las casas de bolsa y a sus clientes", "Aseguradoras y afianzadoras", "Los sistemas de ahorro para el retiro"], "La LMV es amplia: abarca emisoras, intermediarios, bolsas, depósito, contrapartes, calificadoras, proveedores de precios, asesores y sanciones.", "LMV art. 1 · láminas 30–31", null], ["mn.sup", "Entre los objetos de la LMV se encuentra:", "Proteger los intereses del público inversionista y desarrollar un mercado equitativo, eficiente y transparente", ["Garantizar rendimientos mínimos a los inversionistas", "Fijar la política monetaria del país", "Regular a las aseguradoras"], "La protección al público inversionista y un mercado equitativo, eficiente y transparente son objetos expresos de la LMV.", "LMV art. 1 · lámina 10", null], ["mn.soc", "Una sociedad anónima puede adoptar la modalidad de SAPI por acuerdo de:", "Asamblea extraordinaria de accionistas", ["Asamblea ordinaria de accionistas", "Su consejo de administración", "Autorización previa de la CNBV"], "Constituirse o adoptar la modalidad SAPI requiere asamblea extraordinaria.", "LMV arts. 12–16 · lámina 4", null], ["mn.soc", "La denominación de una SAPI debe incluir:", "“Promotora de Inversión” o la abreviatura “P.I.”", ["“Bursátil” o la abreviatura “B”", "“Sociedad Anónima Bursátil” o “S.A.B.”", "“Inscrita en el RNV”"], "SAPI lleva “P.I.”; la SAPIB y la SAB agregan “Bursátil” o “B”.", "LMV arts. 12–16 · lámina 4", null], ["mn.soc", "¿Cuál de los siguientes puede pactarse en los estatutos de una SAPI?", "Restricciones a la transmisión de acciones, derechos de veto y mecanismos de salida", ["La garantía de rendimientos a los accionistas minoritarios", "Hacer oferta pública sin inscribir los valores en el RNV", "La eliminación de todos los derechos de minoría"], "La SAPI tiene flexibilidad societaria: restricciones de transmisión, derechos especiales, veto, salida y acuerdos entre accionistas, pero conserva derechos de minoría.", "LMV arts. 12–16 · lámina 4", null], ["mn.soc", "La administración de una SAPI corresponde a:", "Un consejo de administración, que puede adoptar voluntariamente el régimen de una SAB", ["Un administrador único de forma obligatoria", "Un director general sin consejo", "La CNBV mientras no se inscriba en el RNV"], "La SAPI se administra por consejo y puede adoptar voluntariamente el régimen de administración y vigilancia de una SAB.", "LMV arts. 12–16 · lámina 4", null], ["mn.soc", "Antes de inscribirse en el RNV, una SAPI que desea ser SAPIB debe:", "Incorporar “Bursátil” o “B” a su denominación y adecuar sus estatutos", ["Transformarse de inmediato en SAB", "Obtener autorización del Banco de México", "Tener al menos 25 % de consejeros independientes"], "La SAPIB es la transición al régimen bursátil: cambia denominación y estatutos antes de inscribirse.", "LMV arts. 19–20 · lámina 5", null], ["mn.soc", "Al momento de su inscripción en el RNV, la SAPIB debe contar al menos con:", "Un consejero independiente", ["25 % de consejeros independientes", "Tres consejeros independientes", "Un comisario designado por la minoría"], "La SAPIB necesita al menos un consejero independiente al inscribirse; el 25 % es requisito de la SAB.", "LMV arts. 19–20 · lámina 5", null], ["mn.soc", "El comité de prácticas societarias de una SAPIB debe estar:", "Integrado por consejeros y presidido por un consejero independiente", ["Integrado por accionistas y presidido por el director general", "Presidido por el auditor externo", "Integrado por funcionarios de la CNBV"], "Igual que en la SAB, el comité lo preside un independiente.", "LMV arts. 19–20 · lámina 5", null], ["mn.soc", "Una SAPIB puede colocar sus valores en bolsa:", "Con o sin oferta pública, revelando de forma notoria sus diferencias frente al régimen de una SAB", ["Solo mediante oferta pública restringida", "Solo después de diez años como SAPI", "Sin necesidad de revelar diferencias con una SAB"], "Puede colocar con o sin oferta pública, pero debe revelar de forma notoria en qué difiere de una SAB.", "LMV arts. 19–20 · lámina 5", null], ["mn.soc", "La Sociedad Anónima Bursátil (SAB) es aquella cuyas acciones o títulos que las representan:", "Están inscritos en el Registro Nacional de Valores", ["Se colocan solo mediante oferta privada", "Están registrados ante la CONDUSEF", "No pueden cotizar en bolsa"], "Lo que define a la SAB es la inscripción de sus acciones en el RNV.", "LMV art. 22 · lámina 6", null], ["mn.soc", "El consejo de administración de una SAB puede tener como máximo:", "21 consejeros", ["15 consejeros", "25 consejeros", "11 consejeros"], "Hasta 21 consejeros, de los cuales al menos 25 % deben ser independientes.", "LMV art. 24 · lámina 6", null], ["mn.soc", "¿Qué porcentaje mínimo de los consejeros de una SAB deben ser independientes?", "25 %", ["10 %", "20 %", "50 %"], "Mínimo 25 % independientes; los presidentes de los comités de prácticas societarias y auditoría también deben ser independientes.", "LMV art. 24 · lámina 6", null], ["mn.soc", "La denominación social de una SAB debe agregar:", "La palabra “Bursátil” o la abreviatura “B”", ["“Promotora de Inversión” o “P.I.”", "“de Capital Variable” obligatoriamente", "“Emisora Autorizada”"], "SAB = “Bursátil” o “B”.", "LMV art. 22 · lámina 7", null], ["mn.soc", "En una SAB, la conducción y ejecución de los negocios corresponde a:", "El director general, conforme a las estrategias y lineamientos aprobados por el consejo", ["El comité de auditoría", "El presidente del consejo de administración", "La asamblea ordinaria de accionistas"], "El consejo aprueba estrategias; el director general conduce y ejecuta. Son funciones diferenciadas.", "LMV arts. 44 y ss. · lámina 7", null], ["mn.soc", "Los presidentes de los comités de prácticas societarias y de auditoría de una SAB deben ser:", "Consejeros independientes", ["Accionistas de control", "El director general", "Representantes de la bolsa"], "Ambos comités apoyan al consejo y sus presidentes deben ser independientes.", "LMV arts. 41–43 · lámina 6", null], ["mn.soc", "Los requisitos concretos de listado y mantenimiento de una SAB se determinan en:", "El reglamento interior de la bolsa correspondiente", ["La Ley General de Sociedades Mercantiles", "Los estatutos de la propia emisora", "La Ley de la CONDUSEF"], "Listado y mantenimiento se rigen por el reglamento interior de la bolsa.", "LMV art. 247 · lámina 7", null], ["mn.soc", "El consejo de administración y los comités de una SAB deben actuar con:", "Diligencia y lealtad, sin favorecer intereses particulares contrarios a la sociedad", ["Total discrecionalidad, sin rendir cuentas", "Apego a las instrucciones del accionista de control", "Prioridad a los intereses del director general"], "Deberes de diligencia y lealtad hacia la sociedad.", "LMV arts. 29–40 · lámina 7", null], ["mn.soc", "Respecto de la inscripción de una SAB en el RNV, es correcto afirmar:", "Es declarativa: no certifica la bondad de los valores ni la solvencia de la emisora", ["Garantiza la calidad crediticia de la emisora", "Equivale a una recomendación de compra de la CNBV", "Certifica la liquidez de los valores"], "La inscripción no certifica bondad, solvencia, liquidez ni calidad crediticia.", "LMV art. 79 · lámina 6", null], ["mn.min", "Los accionistas de una SAB que en lo individual o en conjunto tengan 10 % de las acciones con derecho a voto pueden:", "Designar y revocar a un miembro del consejo de administración", ["Oponerse judicialmente a las resoluciones de asamblea", "Designar a un comisario", "Vetar cualquier resolución de la asamblea"], "Con 10 %: designar consejero, pedir convocatoria y pedir aplazamiento de votación. Con 20 %: oposición judicial.", "LMV arts. 50–51 · lámina 8", null], ["mn.min", "En una SAB, ¿qué porcentaje de acciones con voto se requiere para oponerse judicialmente a las resoluciones de asamblea?", "20 %", ["10 %", "25 %", "30 %"], "La oposición judicial es el único derecho de minoría de la SAB que pide 20 %.", "LMV art. 51 · lámina 8", null], ["mn.min", "Con 10 % de las acciones con voto en una SAB se puede solicitar el aplazamiento de la votación de un asunto insuficientemente informado por:", "Tres días naturales, por una sola vez", ["Cinco días hábiles, cada vez que se solicite", "Tres días hábiles, hasta en dos ocasiones", "Quince días naturales"], "Aplazamiento: una sola vez, tres días naturales (no hábiles).", "LMV art. 50 · lámina 8", null], ["mn.min", "Un accionista con el 10 % de las acciones con voto de una SAB puede ejercer todos los siguientes derechos, EXCEPTO:", "Oponerse judicialmente a las resoluciones de asamblea", ["Requerir la convocatoria de una asamblea general", "Designar a un consejero", "Pedir el aplazamiento de una votación"], "La oposición judicial exige 20 %.", "LMV arts. 50–51", null], ["mn.min", "¿Por qué la LMV no reconoce a la minoría de una SAB el derecho de designar comisario?", "Porque el régimen bursátil asigna la vigilancia al consejo, a los comités y al auditor externo", ["Porque la CNBV designa al comisario", "Porque solo el accionista de control puede designarlo", "Porque el comisario lo nombra la bolsa"], "La SAB no tiene comisario: la vigilancia está en consejo, comités y auditor externo.", "Lámina 8", null], ["mn.min", "Un inversionista tiene 12 % de las acciones con voto de una SAB. ¿Qué derechos puede ejercer? I. Designar un consejero. II. Requerir convocatoria de asamblea. III. Oponerse judicialmente a resoluciones.", "I y II", ["I, II y III", "Solo III", "II y III"], "12 % alcanza los derechos del 10 % (I y II), pero no la oposición judicial, que requiere 20 %.", "LMV arts. 50–51", null], ["mn.min", "Un grupo de accionistas tiene 22 % de las acciones con voto de una SAB. ¿Cuál de estos derechos NO tiene?", "Designar un comisario", ["Oponerse judicialmente a resoluciones de asamblea", "Designar un consejero", "Requerir la convocatoria de asamblea"], "Con 22 % tiene todos los derechos de minoría de la SAB; el de designar comisario no existe en la SAB.", "Lámina 8", null], ["mn.min", "Las políticas para el uso o goce de los bienes de la sociedad y las operaciones con personas relacionadas corresponden al comité de:", "Prácticas societarias", ["Auditoría", "Análisis de productos", "Riesgos"], "Prácticas societarias: uso de bienes y operaciones con personas relacionadas. Auditoría: auditor externo y estados financieros.", "Lámina 9", null], ["mn.min", "Evaluar al auditor externo y analizar su dictamen corresponde al comité de:", "Auditoría", ["Prácticas societarias", "Análisis de productos", "Remuneraciones"], "El comité de auditoría evalúa al auditor externo y discute los estados financieros.", "Lámina 9", null], ["mn.min", "El comité de auditoría, tras discutir los estados financieros con quienes los elaboraron:", "Recomienda o no al consejo su aprobación", ["Los aprueba de forma definitiva", "Los envía directamente a la CNBV para su autorización", "Los somete a la asamblea extraordinaria"], "El comité recomienda; el consejo decide.", "Lámina 9", null], ["mn.min", "Sobre los derechos de minoría, es correcto afirmar que:", "No deben mezclarse los regímenes de la SAPI y la SAB, porque porcentajes y derechos son distintos", ["La SAPI y la SAB tienen exactamente los mismos derechos", "En la SAB la minoría del 10 % puede designar comisario", "En la SAPI no existen derechos de minoría"], "La SAPI tiene derechos de minoría adicionales y propios (incluso comisario si conserva esa figura).", "LMV arts. 16, 50–51 · lámina 97", null], ["mn.min", "En la SAPI, la LMV reconoce derechos reforzados de minoría como:", "Designación de consejero, convocatoria o aplazamiento, acciones de responsabilidad y oposición judicial", ["Solo el derecho a recibir dividendos", "El veto automático sobre cualquier decisión", "La designación del director general"], "La SAPI combina flexibilidad estatutaria con protección a minorías según porcentajes legales.", "LMV arts. 12–16 · lámina 4", null], ["mn.inf", "La información de una emisora necesaria para conocer su situación real y actual (financiera, administrativa, operacional, económica y jurídica) y que influye en el precio de sus valores se denomina:", "Información relevante", ["Información privilegiada", "Información confidencial", "Secreto bursátil"], "Información relevante = la necesaria para conocer la situación real de la emisora y que afecta el precio.", "Lámina 13", null], ["mn.inf", "Los actos, hechos o acontecimientos de cualquier naturaleza que puedan influir en los precios de los valores inscritos en el RNV son:", "Eventos relevantes", ["Información periódica", "Información reservada", "Operaciones de estabilización"], "Ejemplos: cambios directivos, contratos, licitaciones, fusiones, concurso mercantil, nuevos productos.", "Lámina 13", null], ["mn.inf", "Son ejemplos de eventos relevantes, EXCEPTO:", "El envío del estado de cuenta mensual a un cliente", ["Un cambio en la estructura directiva de la emisora", "La participación de la emisora en una licitación", "Una fusión o adquisición de empresas"], "El estado de cuenta es una obligación de la casa de bolsa con su cliente, no un evento de la emisora.", "Lámina 13", null], ["mn.inf", "El conocimiento de eventos relevantes que aún no han sido revelados al público por la emisora a través de la bolsa constituye:", "Información privilegiada", ["Información relevante ya divulgada", "Secreto bursátil", "Información periódica"], "La clave: evento relevante + no revelado al público = información privilegiada.", "Lámina 14", null], ["mn.inf", "Se presume que tienen información privilegiada los accionistas que posean:", "Más del 10 % de las acciones de la emisora", ["Más del 5 %", "Más del 20 %", "El 30 % o más"], "Más de 10 %. No confundir con el 30 % del gran público inversionista.", "Lámina 14", null], ["mn.inf", "¿Quién de los siguientes se presume que tiene información privilegiada de la emisora?", "El secretario del consejo de administración", ["Un inversionista con 2 % de las acciones sin cargo en la emisora", "Cualquier cliente de una casa de bolsa", "Un analista que solo usa información pública"], "Se presume en consejeros, secretario del consejo, comisarios, director general, directivos relevantes y accionistas con más de 10 %.", "Lámina 14", null], ["mn.inf", "Quien posee información privilegiada solo puede transmitirla:", "A quien deba conocerla por su empleo, cargo o comisión", ["A sus familiares hasta el segundo grado", "A cualquier persona si no obtiene beneficio", "A clientes con perfil sofisticado"], "Fuera de la necesidad funcional legítima, transmitirla está prohibido.", "LMV art. 362 y ss. · lámina 16", null], ["mn.inf", "A quien tiene información privilegiada le está prohibido todo lo siguiente, EXCEPTO:", "Guardar confidencialidad sobre ella", ["Operar valores cuyo precio pueda verse influido por esa información", "Emitir recomendaciones sobre esos valores", "Transmitirla a un tercero sin necesidad funcional"], "Guardar confidencialidad es justamente su obligación.", "Lámina 16", null], ["mn.inf", "Respecto del secreto bursátil, es correcto afirmar que:", "Protege la información de operaciones de los clientes, pero no impide entregarla a la autoridad competente", ["Impide entregar información incluso a la autoridad judicial", "Solo obliga a las emisoras", "Permite compartir datos de clientes con otras casas de bolsa"], "El secreto bursátil cede ante requerimientos legales de autoridad.", "LMV art. 192 · láminas 15 y 75", null], ["mn.inf", "Conforme al secreto bursátil, la casa de bolsa puede dar información de las operaciones de un cliente a:", "Titulares, beneficiarios, representantes o apoderados autorizados", ["Cualquier familiar del cliente", "Otras casas de bolsa que la soliciten", "Medios de comunicación si es de interés público"], "Solo a personas legitimadas (titular, mandante, fideicomitente, fideicomisario, beneficiario, representante o apoderado).", "LMV art. 192 · lámina 15", null], ["mn.inf", "Las autoridades hacendarias pueden obtener información protegida por el secreto bursátil:", "Por conducto de la CNBV", ["Directamente con la casa de bolsa", "Por conducto de la CONDUSEF", "De ninguna manera"], "Las autoridades hacendarias la piden a través de la CNBV; la autoridad judicial en los supuestos legales.", "LMV art. 192 · lámina 15", null], ["mn.inf", "Si un empleado de una casa de bolsa viola el secreto bursátil:", "El empleado responde por la violación y la casa de bolsa debe reparar los daños y perjuicios", ["Solo se le amonesta verbalmente", "La responsabilidad recae en el cliente", "No hay consecuencia si no obtuvo beneficio"], "Hay responsabilidad del empleado y obligación de la casa de bolsa de reparar daños y perjuicios.", "LMV art. 192 · lámina 15", null], ["mn.inf", "Los miembros y el secretario del consejo de una SAB deben guardar confidencialidad sobre:", "La información no pública que conozcan con motivo de su cargo", ["Toda la información, aunque ya sea pública", "Solo la información financiera anual", "Únicamente las actas de asamblea"], "La confidencialidad abarca lo que no es de carácter público.", "Lámina 12", null], ["mn.inf", "Para efectos de la LMV, NO forma parte del gran público inversionista quien:", "Mantenga en lo individual el 30 % o más de las acciones ordinarias de la emisora", ["Tenga el 5 % de las acciones y no sea consejero", "Sea un inversionista minoritario sin poder de mando", "Tenga sus acciones depositadas en una casa de bolsa"], "Se excluye a quien tenga 30 % o más o poder de mando.", "Lámina 11", null], ["mn.inf", "¿Quién de los siguientes NO se considera gran público inversionista?", "Un consejero no independiente o directivo relevante de la emisora", ["Una persona física con 0.5 % de las acciones", "Un fondo de inversión con 3 % de las acciones", "Un inversionista extranjero con 1 % sin vínculo con la emisora"], "Se excluye a consejeros no independientes y directivos relevantes.", "Lámina 11", null], ["mn.inf", "Para definir al gran público inversionista, el grupo vinculado por parentesco abarca hasta el:", "Segundo grado por consanguinidad, afinidad o civil, incluyendo cónyuges y concubinos", ["Cuarto grado", "Primer grado únicamente", "Tercer grado"], "Hasta el segundo grado, incluidos cónyuges, concubinas o concubinarios y quienes actúen concertadamente.", "Lámina 11", null], ["mn.inf", "Tampoco es gran público inversionista la fiduciaria de un fideicomiso constituido para:", "Fondos de pensiones, jubilaciones o planes de opciones de compra de acciones del personal de la emisora", ["Administrar la cartera de un cliente independiente", "Garantizar un crédito bancario de un tercero", "Invertir el patrimonio de una fundación sin relación con la emisora"], "Se excluyen los fideicomisos de pensiones, primas de antigüedad y opciones de acciones del personal de la emisora.", "Lámina 11 inciso e)", null], ["mn.inf", "Pueden presumirse con información privilegiada quienes se aparten de sus patrones históricos de operación y razonablemente hayan tenido acceso a ella por:", "Vínculos familiares, societarios o comunicaciones", ["Leer reportes públicos de análisis", "Haber comprado acciones hace más de un año", "Tener una cuenta en cualquier casa de bolsa"], "El cambio en el patrón histórico más un acceso razonable activa la presunción.", "Lámina 14", null], ["mn.del", "Quien usando información privilegiada opere y obtenga un beneficio de hasta 100,000 días de salario mínimo será sancionado con prisión de:", "2 a 6 años", ["4 a 12 años", "5 a 10 años", "5 a 15 años"], "Información privilegiada (art. 381): hasta 100,000 días → 2 a 6 años; más de 100,000 → 4 a 12 años.", "LMV art. 381 · lámina 17", null], ["mn.del", "Si el beneficio obtenido por uso de información privilegiada excede 100,000 días de salario mínimo, la prisión es de:", "4 a 12 años", ["2 a 6 años", "5 a 10 años", "3 a 9 años"], "Se duplica el rango cuando el beneficio supera 100,000 días.", "LMV art. 381 · lámina 17", null], ["mn.del", "Para los delitos de información privilegiada y manipulación de mercado, se entiende por beneficio:", "Obtener una ganancia o evitarse una pérdida", ["Solo obtener una ganancia", "Solo las ganancias superiores a 100,000 días de salario", "Cualquier operación aunque no genere resultado"], "Evitar una pérdida también es beneficio.", "LMV arts. 381–382", null], ["mn.del", "La manipulación de mercado con beneficio (art. 382) se sanciona con:", "Las mismas penas que el uso de información privilegiada: 2 a 6 o 4 a 12 años según el beneficio", ["5 a 10 años en todos los casos", "5 a 15 años", "Solo multa administrativa"], "Arts. 381 y 382 comparten la misma escala de penas.", "LMV art. 382 · lámina 18", null], ["mn.del", "Difundir información falsa sobre valores o sobre la situación financiera de una emisora se sanciona con prisión de:", "5 a 10 años", ["2 a 6 años", "4 a 12 años", "5 a 15 años"], "Art. 383: información falsa u ocultar eventos relevantes → 5 a 10 años.", "LMV art. 383 · lámina 19", null], ["mn.del", "Ocultar u omitir revelar eventos relevantes que deban divulgarse, salvo que se haya diferido su divulgación conforme a la ley, se sanciona con:", "Prisión de 5 a 10 años", ["Prisión de 2 a 6 años", "Solo una amonestación", "Suspensión de 3 meses a 5 años"], "La omisión de eventos relevantes está en el art. 383 fracc. II.", "LMV art. 383 · lámina 19", null], ["mn.del", "Un apoderado de una casa de bolsa que proporcione información falsa sobre los servicios asesorados que presta puede ser sancionado con prisión de:", "5 a 10 años", ["2 a 6 años", "4 a 12 años", "5 a 15 años"], "Art. 383 Bis: directivos, empleados y apoderados que den información falsa → 5 a 10 años.", "LMV art. 383 Bis · láminas 19 y 85", null], ["mn.del", "Realizar intermediación con valores sin autorización puede sancionarse con prisión de:", "5 a 15 años", ["5 a 10 años", "2 a 6 años", "4 a 12 años"], "Intermediación sin autorización y disponer de recursos del cliente → 5 a 15 años.", "LMV arts. 373 y 375 · lámina 85", null], ["mn.del", "Disponer de los recursos de un cliente para fines distintos de los ordenados, causándole un daño, puede sancionarse con prisión de:", "5 a 15 años", ["5 a 10 años", "2 a 6 años", "3 meses a 5 años"], "Es de las penas más altas: 5 a 15 años.", "Lámina 85", null], ["mn.del", "La CNBV puede suspender a un infractor por un periodo de:", "Tres meses a cinco años", ["Un mes a un año", "Seis meses a diez años", "Uno a tres años"], "La CNBV puede amonestar, remover o suspender de 3 meses a 5 años e inhabilitar en casos graves.", "Lámina 85", null], ["mn.del", "Al imponer multas, la CNBV valora, entre otros elementos:", "Reincidencia, cuantía, condición económica, daño, lucro y dolo", ["Solo el monto de la operación", "Únicamente la antigüedad del infractor", "La opinión de la bolsa de valores"], "También considera impacto, naturaleza de la infracción y atenuantes.", "Lámina 85", null], ["mn.del", "La CNBV puede imponer directamente todas las siguientes sanciones, EXCEPTO:", "Penas de prisión", ["Amonestación", "Remoción o suspensión", "Multas administrativas"], "La CNBV impone sanciones administrativas y puede promover responsabilidades penales; la prisión la impone un juez.", "Láminas 16 y 85", null], ["mn.del", "Un director sabe, antes de que se publique, que su empresa perderá una licitación. Vende sus acciones y evita una pérdida equivalente a 50,000 días de salario mínimo. ¿Qué pena le corresponde?", "Prisión de 2 a 6 años, porque evitar una pérdida cuenta como beneficio", ["Ninguna, porque no obtuvo una ganancia", "Prisión de 4 a 12 años", "Prisión de 5 a 10 años"], "Beneficio = ganancia o pérdida evitada; 50,000 días es menos de 100,000 → 2 a 6 años.", "LMV art. 381", null], ["mn.del", "Las operaciones realizadas con información privilegiada pueden dar lugar a:", "Sanciones administrativas de la CNBV y, según la conducta, responsabilidades penales y civiles", ["Solo una amonestación privada", "Únicamente la cancelación de la cuenta", "Ninguna consecuencia si el monto es pequeño"], "La CNBV sanciona administrativamente y puede promover responsabilidades penales y civiles.", "Lámina 16", null], ["mn.aut", "Es la máxima autoridad en la rectoría del Sistema Financiero Mexicano:", "La Secretaría de Hacienda y Crédito Público (SHCP)", ["El Banco de México", "La CNBV", "La CONDUSEF"], "La SHCP es la máxima autoridad y brazo ejecutor de la política financiera.", "Lámina 24", null], ["mn.aut", "Otorga o revoca concesiones a las bolsas de valores y a las instituciones para el depósito de valores:", "La SHCP", ["La CNBV", "El Banco de México", "La AMIB"], "Concesiones de bolsas e Indeval: SHCP.", "Lámina 24", null], ["mn.aut", "Las atribuciones de la SHCP se encuentran en:", "El art. 31 de la Ley Orgánica de la Administración Pública Federal", ["El art. 5 de la LMV", "La Ley de la CNBV", "La Ley del Banco de México"], "Art. 31 de la LOAPF.", "Lámina 24", null], ["mn.aut", "Opera con las instituciones de crédito como banco de reserva y acreditante de última instancia:", "El Banco de México", ["La SHCP", "La CNBV", "La Bolsa Mexicana de Valores"], "Función típica de banco central.", "Lámina 25", null], ["mn.aut", "El Banco de México es:", "Una persona de derecho público con carácter autónomo", ["Un órgano desconcentrado de la SHCP", "Un organismo público descentralizado", "Un organismo autorregulatorio"], "Banxico es autónomo; CNBV, CONSAR y CNSF son desconcentrados de la SHCP; CONDUSEF es descentralizado.", "Lámina 25", null], ["mn.aut", "Presta servicios de tesorería al Gobierno Federal y actúa como su agente financiero:", "El Banco de México", ["La SHCP", "La CNBV", "Indeval"], "También asesora al Gobierno Federal en materia económica y financiera.", "Lámina 25", null], ["mn.aut", "Regular la emisión y circulación de la moneda, los cambios y los sistemas de pagos es función de:", "El Banco de México", ["La SHCP", "La CNBV", "La CONDUSEF"], "Banxico procura la estabilidad del poder adquisitivo de la moneda.", "Lámina 25", null], ["mn.aut", "La Comisión Nacional Bancaria y de Valores es:", "Un órgano desconcentrado de la SHCP, con autonomía técnica y facultades ejecutivas", ["Un organismo autónomo constitucional", "Un organismo público descentralizado", "Un organismo autorregulatorio"], "CNBV, CONSAR y CNSF comparten esa naturaleza.", "Lámina 26", null], ["mn.aut", "¿Quién lleva el Registro Nacional de Valores?", "La CNBV", ["La Bolsa Mexicana de Valores", "La SHCP", "Indeval"], "El RNV es público y está a cargo de la CNBV, que certifica sus inscripciones.", "LMV art. 70 · láminas 26 y 42", null], ["mn.aut", "Ordenar la suspensión de la cotización de valores e intervenir administrativamente a intermediarios con prácticas no sanas es facultad de:", "La CNBV", ["La SHCP", "La CONDUSEF", "La BMV"], "Facultades ejecutivas de la CNBV.", "Lámina 26", null], ["mn.aut", "La CONDUSEF es:", "Un organismo público descentralizado", ["Un órgano desconcentrado de la SHCP", "Un organismo autorregulatorio", "Una persona de derecho público autónoma como Banxico"], "CONDUSEF es descentralizado, con autonomía técnica y jurídica para dictar resoluciones y laudos.", "Lámina 27", null], ["mn.aut", "Actuar como árbitro en amigable composición o en juicio arbitral de estricto derecho entre usuarios e instituciones financieras corresponde a:", "La CONDUSEF", ["La CNBV", "La AMIB", "El Banco de México"], "También lleva el procedimiento conciliatorio y da orientación jurídica a usuarios.", "Lámina 27", null], ["mn.aut", "Regula y supervisa a las AFORES y SIEFORES:", "La CONSAR", ["La CNBV", "La CNSF", "La CONDUSEF"], "CONSAR: Sistemas de Ahorro para el Retiro.", "Lámina 28", null], ["mn.aut", "Coordina, regula y supervisa a las aseguradoras y afianzadoras:", "La CNSF", ["La CNBV", "La CONSAR", "El Banco de México"], "Comisión Nacional de Seguros y Fianzas.", "Lámina 29", null], ["mn.aut", "¿Cuáles son órganos desconcentrados de zación.", "Lámina 45", null], ["mn.ofe", "La estabilización de una oferta NO se considera manipulación de mercado cuando:", "Cumple las condiciones legales de oportunidad y precio", ["Genera una ganancia al colocador", "Dura más de 30 días", "Se notifica a la CONDUSEF"], "Fuera de esas condiciones podría ser manipulación.", "LMV art. 370 · lámina 84", null], ["mn.ofe", "La LMV define al inversionista calificado como la persona que:", "Habitualmente cuenta con los ingresos, activos o características cualitativas que establezca la CNBV", ["Tiene más de diez años invirtiendo", "Tiene un título universitario en finanzas", "Es necesariamente una institución de crédito"], "La CNBV fija los parámetros y puede establecer distintos tipos de inversionista calificado.", "LMV art. 2 fracc. XVI · lámina 46", null], ["mn.ofe", "El inversionista institucional se define:", "Por remisión a las leyes federales o por su carácter de entidad financiera", ["Por tener inversiones mayores a 20 millones de UDIs", "Por ser persona física con experiencia", "Por designación de la AMIB"], "Incluso cuando actúa como fiduciaria en ciertos fideicomisos.", "LMV art. 2 fracc. XVII · lámina 46", null], ["mn.ofe", "Para participar en ofertas públicas restringidas, el inversionista calificado debe haber mantenido en promedio durante el último año inversiones de al menos:", "20,000,000 de UDIs", ["1,500,000 UDIs", "500,000 UDIs", "3,000,000 de UDIs"], "20 millones de UDIs es el mismo umbral para girar instrucciones a la mesa.", "Lámina 49", null], ["mn.ofe", "La oferta pública restringida se dirige exclusivamente a:", "Inversionistas institucionales y calificados", ["El público en general", "Los empleados de la emisora", "Menos de 100 personas de cualquier tipo"], "Es pública pero restringida a institucionales y calificados.", "Lámina 49", null], ["mn.ofe", "La oferta privada de acciones de personas morales no inscritas en el RNV:", "No requiere autorización de las autoridades si solo participan inversi .ofe", "Las ofertas públicas de suscripción o de enajenación pueden ser:", "Primarias, secundarias, mixtas, nacionales o internacionales", ["Solo primarias", "Solo nacionales", "Solo restringidas"], "Tipos de oferta pública: de suscripción o enajenación, y de adquisición.", "Lámina 47", null], ["mn.cdb", "Son actividades de intermediación, EXCEPTO:", "Supervisar a las entidades financieras", ["Poner en contacto la oferta y la demanda de valores", "Operar valores por cuenta de terceros como comisionista o mandatario", "Negociar valores por cuenta propia con el público"], "Supervisar es tarea de la CNBV, no de un intermediario.", "Lámina 51", null], ["mn.cdb", "La LMV reconoce como intermediarios del mercado de valores a:", "Casas de bolsa, instituciones de crédito, operadoras de fondos, AFORES y distribuidoras de acciones de fondos", ["Solo a las casas de bolsa", "Las bolsas de valores e Indeval", "Los asesores en inversiones independientes"], "Los asesores en inversiones NO son intermediarios.", "Lámina 52", null], ["mn.cdb", "Conforme a las disposiciones de casas de bolsa (art. 27), las acciones inscritas en el RNV se negocian:", "En las bolsas de valores", ["Fuera de bolsa, libremente", "En sistemas de negociación de deuda", "En plataformas de fondos de inversión"], "Acciones, CPOs, obligaciones convertibles, títulos opcionales y certificados bursátiles fiduciarios (desarrollo, inmobiliarios, indizados, proyectos, energía) van a bolsa.", "Disposiciones casas de bolsa art. 27 · lámina 53", null], ["mn.cdb", "Los valores de deuda inscritos (bonos, pagarés, valores gubernamentales):", "Pueden negociarse fuera de las bolsas, incluso en sistemas para facilitar operaciones con valores", ["Deben negociarse siempre en bolsa", "Solo se negocian en el SIC", "Solo se negocian en MexDer"], "La deuda puede ir fuera de bolsa.", "Disposiciones casas de bolsa art. 27", null], ["mn.cdb", "Las acciones de fondos de inversión de capitales y de objeto limitado:", "No están sujetas a ito adicional"], "Contrato + consentimiento expreso y escrito.", "Lámina 63", null], ["mn.ope", "Las operaciones de autoentrada se permiten únicamente sobre:", "Acciones o CPOs inscritos y listados en bolsa, ETFs y renta variable listada en el SIC", ["Bonos gubernamentales", "Derivados extrabursátiles", "Acciones no inscritas en el RNV"], "Solo renta variable listada.", "Lámina 63", null], ["mn.ope", "La casa de bolsa puede vender por cuenta propia y liquidar con valores comprados el mismo día solo cuando se trata de:", "Renta variable de alta y mediana bursatilidad", ["Cualquier valor, sin importar su bursatilidad", "Renta variable de baja bursatilidad", "Valores de deuda privada"], "Mismo emisor, valor nominal, clase y serie, adquiridos el mismo día.", "Lámina 61", null], ["mn.ope", "Si la casa de bolsa no puede aplicar los recursos del cliente el mismo día de su recibo, debe depositarlos o invertirlos a más tardar:", "El día hábil siguiente", ["En tres días hábiles", "En cinco días hábiles", "El mismo día sin excepción"], "Depósito en banco, fondo de deuda o reporto gubernamental de corto plazo.", "LMV art. 194 · láminas 64 y 88", null], ["mn.ope", "Los recursos del cliente no aplicados pueden invertirse en:", "Acciones de fondos de inversión en instrumentos de deuda o reportos de corto plazo sobre valores gubernamentales, en cuenta distinta del activo de la casa", ["Acciones de la propia casa de bolsa", "Divisas a elección de la casa", "Instrumentos derivados"], "Siempre en cuenta separada del activo de la casa de bolsa.", "Lámina 64", null], ["mn.ope", "Si una casa de bolsa canaliza instrucciones de clientes a otra casa de bolsa para su ejecución, debe transferirle los recursos:", "El mismo día de su recepción", ["Al día hábil siguiente", "En tres días hábiles", "Al cierre de mes"], "Mismo día.", "Láminas 64 y 88", null], ["mn.ope", "Los comprobantes de operación y su registro contable quedan a disposición del inversionista por los últimos:", "12 meses", ["6 me esas", ["Gobierno", "Sector externo", "Familias"], "Agentes de la actividad económica: empresas, gobierno y sector externo.", "Laura Garza cap. 9 · 9.1.6", null], ["ae.fun", "Fuerza reguladora que rige la política interna y externa y representa al país ante otros gobiernos:", "Gobierno", ["Empresas", "Sector externo", "Banco Central"], "El gobierno es la fuerza reguladora del país.", "Laura Garza cap. 9 · 9.1.6", null], ["ae.fun", "El sector externo está constituido por:", "El conjunto de agentes económicos no residentes en México que tienen relaciones económicas con el país", ["Las empresas exportadoras mexicanas", "Los mexicanos que viven en el extranjero", "Las sucursales de bancos mexicanos en el exterior"], "Son los no residentes con relaciones económicas con México; se afecta por desempleo y tasas de otros países (sobre todo EUA).", "Laura Garza cap. 9 · 9.1.6", null], ["ae.fun", "El sector externo de México se ve afectado principalmente por:", "El desempleo y las tasas de interés de otros países, sobre todo de Estados Unidos", ["La inflación subyacente local", "El encaje legal", "Las barreras artificiales"], "EUA es nuestro principal socio comercial.", "Laura Garza cap. 9 · 9.1.6", null], ["ae.fun", "¿Cuál NO es una forma en que el desarrollo del sistema financiero influye en el crecimiento económico?", "Fijando los precios de los bienes de consumo", ["Aumentando la tasa de ahorro de hogares y empresas", "Aumentando la productividad marginal del acervo de capital", "Incrementando la proporción del ahorro asignada a la inversión"], "Los tres canales del libro: más ahorro, más productividad marginal del capital, más ahorro hacia inversión.", "Laura Garza cap. 9 · 9.1.7", null], ["ae.fun", "El sector financiero como vehículo de captación y asignación de recursos:", "Moviliza y agrupa el ahorro y promueve una asignación eficiente del capital", ["Sustituye al gobierno en la política fiscal", "Elimina el riesgo crediticio", "Fija el tipo de cambio"], "También produ  las empresas de un país están dispuestas a producir y vender en un periodo, dados los precios y la capacidad productiva:", "Oferta agregada", ["Demanda agregada", "PIB potencial", "Oferta monetaria"], "La curva de oferta agregada relaciona el nivel de precios con la cantidad total ofrecida.", "Laura Garza cap. 9 · 9.2.1", null], ["ae.mac", "Cantidad total que están dispuestos a gastar los diferentes sectores de la economía durante un periodo:", "Demanda agregada", ["Oferta agregada", "Gasto corriente del Gobierno Federal", "Demanda cruzada"], "Pregunta de repaso del libro.", "Laura Garza cap. 9 · 9.2.1 · Repaso 3", null], ["ae.mac", "La pendiente de la curva de oferta agregada se hace más pronunciada cuando:", "Se acerca al nivel de plena utilización de la capacidad productiva", ["Hay alto desempleo", "Bajan las tasas de interés", "Cae la demanda externa"], "Cerca del pleno empleo ya no se puede producir mucho más; la curva se empina.", "Laura Garza cap. 9 · 9.2.1", null], ["ae.mac", "La fórmula de la demanda agregada es:", "DA = C + I + G + (X − M)", ["DA = C + I − G + (M − X)", "DA = C + S + T", "DA = M1 + M2 + M3"], "Consumo + inversión + gasto público + exportaciones netas.", "Laura Garza cap. 9 · 9.2.2", null], ["ae.mac", "Componente estable que representa aproximadamente el 60 % de la demanda agregada:", "Consumo privado (C)", ["Inversión de las empresas (I)", "Gasto público (G)", "Exportaciones netas (X − M)"], "Lo realizan principalmente las economías domésticas.", "Laura Garza cap. 9 · 9.2.2", null], ["ae.mac", "El ahorro depende principalmente de:", "El ingreso disponible", ["La tasa de inflación", "El tipo de cambio", "El gasto público"], "Sus motivaciones son incrementar el patrimonio y tener más seguridad (fondos de pensiones).", "Laura Garza cap. 9 · 9.2.2", null], ["ae.mac", "Los mayores obstáculos para el ahorro según el libro son:", "El efecto demostración y los impuestos", ["Las tasas de interés altas y la inflación", "El tipo de cambio y la balanza comercial", "La política monetaria y el encaje"], "Efecto demostración: intentar emular el consumo de los ingresos más altos.", "Laura Garza cap. 9 · 9.2.2", null], ["ae.mac", "Intentar emular el consumo de las personas con ingresos más altos se llama:", "Efecto demostración", ["Efecto expulsión", "Efecto multiplicador", "Efecto riqueza"], "Es uno de los obstáculos del ahorro.", "Laura Garza cap. 9 · 9.2.2", null], ["ae.mac", "La inversión de las empresas (I) está determinada por:", "Las expectativas empresariales, la tasa de interés y la capacidad instalada utilizada", ["El consumo de los hogares y el ahorro", "El gasto público y los impuestos", "Las exportaciones y las importaciones"], "Con exceso de capital físico no es necesaria más inversión.", "Laura Garza cap. 9 · 9.2.2", null], ["ae.mac", "En la fórmula de la demanda agregada, (X − M) representa:", "Las exportaciones netas", ["La masa monetaria", "El saldo de la cuenta de capital", "El déficit fiscal"], "Exportaciones menos importaciones.", "Laura Garza cap. 9 · 9.2.2", null], ["ae.mac", "Los elementos que integran la masa monetaria, es decir, los componentes de la oferta de dinero en todas sus expresiones, son:", "Los agregados monetarios", ["Las reservas internacionales", "Los componentes de la demanda agregada", "Las razones financieras"], "Los agregados monetarios integran la oferta monetaria.", "Laura Garza cap. 9 · 9.2.3", null], ["ae.mac", "Volumen de dinero disponible en la economía de un país en un momento determinado:", "Oferta monetaria", ["Demanda monetaria", "Reserva internacional", "Base gravable"], "La oferta monetaria se mide con los agregados M1-M4.", "Laura Garza cap. 9 · 9.2.3", null], ["ae.mac", "El concepto de M1 es:", "Billetes y monedas de cuño corriente en poder del público en general", ["Los billetes, monedas, cuentas de ahorro y dólares junto con inversiones a largo plazo", "Resultado de la oferta monetaria", "Todas las anteriores"], "Pregunta de repaso del libro. M1 = disponibilidad líquida: billetes y monedas en poder del público, cuentas de cheques de residentes y depósitos en cuenta corriente.", "Laura Garza cap. 9 · 9.2.4 · Repaso 4", ["Billetes y monedas de cuño corriente en poder del público en general", "Los billetes, monedas, cuentas de ahorro y dólares junto con inversiones a largo plazo", "Resultado de la oferta monetaria", "Todas las anteriores"]], ["ae.mac", "El agregado monetario M1 incluye:", "Billetes y monedas en poder del público, cuentas de cheques de residentes y depósitos en cuenta corriente", ["M1 más captación bancaria de residentes y fondos para el retiro", "Captación de residentes del exterior", "Captación de sucursales de bancos mexicanos en el exterior"], "M1 = disponibilidad líquida.", "Laura Garza cap. 9 · 9.2.4", null], ["ae.mac", "Los billetes y monedas EN PODER DEL PÚBLICO se obtienen:", "Excluyendo la caja de los bancos del total de billetes y monedas en circulación", ["Sumando la reserva internacional", "Restando los fondos para el retiro", "Sumando los depósitos a plazo"], "Lo que está en la caja de los bancos no está en poder del público.", "Laura Garza cap. 9 · 9.2.4", null], ["ae.mac", "El agregado que incluye a M1, la captación bancaria de residentes, los valores públicos y privados en poder de residentes y los FONDOS PARA EL RETIRO es:", "M2", ["M3", "M4", "Base monetaria"], "Truco: los fondos para el retiro entran en M2.", "Laura Garza cap. 9 · 9.2.4", null], ["ae.mac", "M3 incluye a M2 más:", "La captación bancaria de residentes del exterior y los valores públicos en poder de residentes del exterior", ["Los fondos para el retiro", "La captación de sucursales de bancos mexicanos en el exterior", "Los billetes y monedas en poder del público"], "M3 agrega lo de los residentes del exterior.", "Laura Garza cap. 9 · 9.2.4", null], ["ae.mac", "El agregado que incluye la captación de las sucursales y agencias de bancos mexicanos en el exterior es:", "M4", ["M3", "M2", "M1"], "M4 = M3 + captación de sucursales y agencias de bancos mexicanos en el exterior (de residentes en el exterior y nacionales).", "Laura Garza cap. 9 · 9.2.4", null], ["ae.mac", "¿En qué agregado monetario aparecen por primera vez los fondos para el retiro?", "M2", ["M1", "M3", "M4"], "M2 = M1 + captación de residentes + valores en poder de residentes + fondos para el retiro.", "Laura Garza cap. 9 · 9.2.4", null], ["ae.mac", "Una política monetaria EXPANSIVA implica que:", "La base monetaria aumenta (M aumenta)", ["La base monetaria disminuye", "Suben las tasas de interés", "Aumenta el encaje legal"], "El objetivo es estimular la inversión, reducir desempleo y crecer; puede provocar presiones inflacionarias.", "Laura Garza cap. 9 · 9.2.5", null], ["ae.mac", "¿En qué caso estamos ante una política monetaria expansiva?", "Todas son correctas", ["Compra de bonos por el banco central para inyectar liquidez (operaciones de mercado abierto)", "Reducción en el encaje a los bancos", "Reducción de las tasas de interés"], "Pregunta de repaso del libro: las tres son herramientas expansivas.", "Laura Garza cap. 9 · 9.2.5 · Repaso 9", ["Compra de bonos por el banco central para inyectar liquidez (operaciones de mercado abierto)", "Reducción en el encaje a los bancos", "Reducción de las tasas de interés", "Todas son correctas"]], ["ae.mac", "El riesgo principal de una política monetaria expansiva es:", "Generar presiones inflacionarias", ["Aumentar el desempleo", "Reducir la inversión", "Apreciar la moneda"], "Más dinero en circulación puede presionar los precios.", "Laura Garza cap. 9 · 9.2.5", null], ["ae.mac", "¿Cuál es una herramienta de política monetaria RESTRICTIVA?", "Venta de bonos del Estado por parte del banco central", ["Compra de bonos por parte del banco central", "Disminución del encaje legal", "Reducción de la tasa de interés"], "Restrictiva: vender bonos, subir el encaje y subir las tasas para drenar liquidez.", "Laura Garza cap. 9 · 9.2.5", null], ["ae.mac", "La política monetaria restrictiva se utiliza principalmente para:", "Controlar la inflación", ["Reducir el desempleo", "Estimular la inversión", "Aumentar las exportaciones"], "Reduce la presión al alza sobre los precios al contraer la oferta monetaria.", "Laura Garza cap. 9 · 9.2.5", null], ["ae.mac", "Aumentar el encaje a los bancos provoca un efecto contractivo principalmente en:", "M2 y M3", ["M1 únicamente", "Las reservas internacionales", "La balanza comercial"], "Con la misma cantidad de billetes y monedas podrán captar menos depósitos.", "Laura Garza cap. 9 · 9.2.5", null], ["ae.mac", "Ante una crisis con demanda agregada insuficiente, el gobierno puede aplicar una política fiscal expansiva mediante:", "Aumento del gasto público y disminución de impuestos", ["Aumento de impuestos y recorte del gasto", "Venta de bonos del banco central", "Aumento del encaje legal"], "Expansiva fiscal: más gasto y/o menos impuestos; su efecto negativo puede ser más inflación.", "Laura Garza cap. 9 · 9.2.5", null], ["ae.mac", "Una política fiscal RESTRICTIVA consiste en:", "Disminuir el gasto público y subir los impuestos", ["Aumentar el gasto público y bajar impuestos", "Comprar bonos y bajar tasas", "Bajar el encaje y subir el gasto"], "Se usa cuando hay inflación; puede afectar negativamente el empleo.", "Laura Garza cap. 9 · 9.2.5", null], ["ae.mac", "El efecto negativo que puede tener una política fiscal restrictiva es:", "Afectar negativamente la producción y el empleo", ["Aumentar la inflación", "Depreciar la moneda", "Aumentar las reservas internacionales"], "Al bajar la demanda bajan los precios, pero también la producción y el empleo.", "Laura Garza cap. 9 · 9.2.5", null], ["ae.mac", "Bajar impuestos estimula la economía porque:", "Aumenta la renta disponible de las familias y reduce los costos de las empresas", ["Reduce la oferta monetaria", "Aumenta las tasas de interés", "Disminuye la demanda agregada"], "Los impuestos son costos; al bajarlos hay más consumo e inversión.", "Laura Garza cap. 9 · 9.2.5", null], ["ae.mac", "Activos financieros que el banco central invierte en el exterior y que pueden convertirse fácilmente en medios de pago:", "Reservas internacionales", ["Agregados monetarios", "Bonos de regulación monetaria", "Inversión extranjera directa"], "Su característica principal es la liquidez.", "Laura Garza cap. 9 · 9.2.6", null], ["ae.mac", "La característica principal de las reservas internacionales es:", "La liquidez", ["La rentabilidad", "El plazo largo", "Estar denominadas en pesos"], "Capacidad de liquidar obligaciones de pago fuera del país.", "Laura Garza cap. 9 · 9.2.6", null], ["ae.mac", "Según el art. 18 de la Ley del Banco de México, el objetivo de la reserva internacional es:", "Coadyuvar a la estabilidad del poder adquisitivo de la moneda compensando desequilibrios de la balanza de pagos", ["Financiar el gasto público", "Garantizar los depósitos bancarios", "Pagar la deuda interna"], "Compensa diferencias entre ingresos y egresos de divisas.", "Laura Garza cap. 9 · 9.2.6", null], ["ae.mac", "Las reservas internacionales de México son propiedad de:", "El Banco de México", ["La SHCP", "El Gobierno Federal", "La CNBV"], "Son activos propiedad del Banco Central.", "Laura Garza cap. 9 · 9.2.6", null], ["ae.mac", "La reserva internacional se constituye por:", "Divisas y oro propiedad del Banco Central libres de gravamen y sin restricciones de disponibilidad", ["Pesos y valores gubernamentales", "Acciones de empresas mexicanas", "Depósitos de los bancos comerciales en Banxico"], "Deben estar en monedas extranjeras de libre convertibilidad.", "Laura Garza cap. 9 · 9.2.6", null], ["ae.mac", "Los depósitos, títulos y valores que forman parte de la reserva deben ser exigibles a un plazo no mayor de:", "Seis meses (o ser de amplia liquidez)", ["Un año", "Tres meses", "Cinco años"], "También los créditos a cargo de bancos centrales, a no más de 6 meses y al corriente.", "Laura Garza cap. 9 · 9.2.6", null], ["ae.mac", "¿Cuál NO puede formar parte de la reserva internacional?", "Valores emitidos por el Gobierno Federal mexicano en pesos", ["Billetes y monedas metálicos extranjeros", "Depósitos y valores de primer orden pagaderos fuera del país", "Créditos a cargo de bancos centrales a no más de 6 meses"], "Solo activos que representan obligaciones de no residentes, en moneda extranjera.", "Laura Garza cap. 9 · 9.2.6", null], ["ae.mac", "El tipo de cambio como precio de una moneda se establece por:", "La oferta y la demanda de divisas", ["La SHCP", "El Congreso", "La tasa de inflación"], "Se determina en el mercado de divisas.", "Laura Garza cap. 9 · 9.2.7", null], ["ae.mac", "Tipo de cambio determinado rígidamente por el banco central:", "Fijo", ["Flotante", "Flotación sucia", "Flotación manejada"], "Pregunta de repaso del libro: el régimen donde el banco central impide desviaciones es el fijo.", "Laura Garza cap. 9 · 9.2.7 · Repaso 10", null], ["ae.mac", "En un régimen de tipo de cambio flotante, los desequilibrios de la balanza de pagos se corrigen:", "Automáticamente por depreciación o apreciación del tipo de cambio", ["Con intervención diaria del banco central", "Con aranceles", "Con cambios en el encaje"], "El tipo de cambio se fija en un mercado libre.", "Laura Garza cap. 9 · 9.2.7", null], ["ae.mac", "El precio al que la casa de cambio o el banco VENDE la divisa es el tipo de cambio:", "Vendedor", ["Comprador", "Fix", "Spot"], "Comprador = lo que paga la casa de cambio; vendedor = a lo que te vende.", "Laura Garza cap. 9 · 9.2.7", null], ["ae.mac", "El precio que PAGA la casa de cambio o entidad bancaria por la divisa es el tipo de cambio:", "Comprador", ["Vendedor", "Fijo", "Interbancario"], "Desde la óptica de la entidad: compra a ese precio.", "Laura Garza cap. 9 · 9.2.7", null], ["ae.mac", "Registro sistemático de todas las transacciones económicas entre los residentes del país y los del resto del mundo:", "Balanza de pagos", ["Balanza comercial", "Cuenta de capital", "Reserva internacional"], "Componentes: cuenta corriente, cuenta de capital y cuenta de reservas oficiales.", "Laura Garza cap. 9 · 9.2.8", null], ["ae.mac", "Los principales componentes de la balanza de pagos son:", "Cuenta corriente, cuenta de capital y cuenta de reservas oficiales", ["Balanza comercial, deuda pública y reservas", "Exportaciones, importaciones y aranceles", "M1, M2 y M3"], "La balanza comercial es solo una parte de la cuenta corriente.", "Laura Garza cap. 9 · 9.2.8", null], ["ae.mac", "Parte de la balanza de pagos que contempla las importaciones y exportaciones de mercancías o bienes tangibles:", "Balanza comercial", ["Cuenta de capital", "Cuenta de reservas", "Balanza de servicios financieros"], "Solo bienes tangibles.", "Laura Garza cap. 9 · 9.2.8", null], ["ae.mac", "En la balanza de pagos, una transacción que lleva a RECIBIR un pago de extranjeros se registra como:", "Crédito", ["Débito", "Pasivo", "Reserva"], "Crédito = recibir pago de extranjeros; débito = pagar a extranjeros.", "Laura Garza cap. 9 · 9.2.8", null], ["ae.mac", "Un ciclo económico consiste en:", "Expansiones seguidas de recesiones, contracciones y recuperaciones que se repiten pero no de forma periódica", ["Movimientos de precios con periodicidad exacta de cuatro años", "El aumento sostenido del PIB", "La alternancia de políticas fiscales"], "La secuencia se repite, pero NO de forma periódica.", "Laura Garza cap. 9 · 9.2.9", null], ["ae.mac", "El orden de las fases del ciclo económico según el libro es:", "Auge, recesión, depresión y recuperación", ["Recesión, auge, recuperación y depresión", "Depresión, auge, recesión y recuperación", "Recuperación, depresión, auge y recesión"], "Auge (punto más alto) → recesión (empieza a bajar) → depresión (punto más bajo) → recuperación.", "Laura Garza cap. 9 · 9.2.10", null], ["ae.mac", "El momento más elevado del ciclo económico es:", "Auge o expansión", ["Recuperación", "Recesión", "Depresión"], "En el auge suben los precios de forma desigual.", "Laura Garza cap. 9 · 9.2
